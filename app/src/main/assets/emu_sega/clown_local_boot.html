<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NaP ClownMDEmu Local Boot</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#8fd8ff;font:12px monospace;}#canvas{display:block;width:100vw;height:100vh;background:#000;image-rendering:pixelated;}#status{position:absolute;left:6px;right:6px;bottom:6px;padding:4px 6px;background:rgba(0,0,0,.68);color:#8fd8ff;text-align:center;z-index:5;white-space:pre-wrap;}#log{position:absolute;left:6px;top:6px;right:6px;max-height:42%;overflow:hidden;color:#8fd8ff;background:rgba(0,0,0,.42);z-index:4;white-space:pre-wrap;display:none}</style>
</head><body><canvas id="canvas" tabindex="0"></canvas><div id="log"></div><div id="status">WAITING FOR NAP ROM...</div>
<script>
(function(){'use strict';
var remoteBase='https://sonicresearch.org/clownacy/';
var booted=false, romBlobUrl=null, pad={A:false,B:false,C:false,START:false,UP:false,DOWN:false,LEFT:false,RIGHT:false};
function parentLog(msg){try{parent.postMessage({type:'nap-wrapper-log',msg:String(msg)},'*');}catch(_){} try{console.log('[NAP WRAPPER] '+msg);}catch(_){} }
function status(msg){var s=document.getElementById('status');if(s)s.textContent=msg;parentLog(msg);}
function keyDefs(btn){return {UP:[['ArrowUp','ArrowUp',38]],DOWN:[['ArrowDown','ArrowDown',40]],LEFT:[['ArrowLeft','ArrowLeft',37]],RIGHT:[['ArrowRight','ArrowRight',39]],A:[['z','KeyZ',90],['Z','KeyZ',90]],B:[['x','KeyX',88],['X','KeyX',88]],C:[['c','KeyC',67],['C','KeyC',67]],START:[['Enter','Enter',13]]}[btn]||null;}
function makeKeyEvent(type,def){var key=def[0],ch=key.length===1?key.charCodeAt(0):0;var ev=new KeyboardEvent(type,{key:key,code:def[1],bubbles:true,cancelable:true,composed:true,repeat:false});try{Object.defineProperty(ev,'keyCode',{get:function(){return def[2];}});Object.defineProperty(ev,'which',{get:function(){return def[2];}});Object.defineProperty(ev,'charCode',{get:function(){return type==='keypress'?ch:0;}});}catch(_){}return ev;}
function sendKey(btn,down){pad[btn]=!!down;var defs=keyDefs(btn)||[];var targets=[window,document,document.body,document.getElementById('canvas'),document.activeElement].filter(Boolean);var types=down?['keydown','keypress']:['keyup'];var ok=0;defs.forEach(function(def){targets.forEach(function(t){types.forEach(function(type){try{t.dispatchEvent(makeKeyEvent(type,def));ok++;}catch(e){}});});});parentLog('INPUT '+btn+' '+(down?'DOWN':'UP')+' dispatched='+ok);}
function installGamepad(){try{var axes=[0,0,0,0];function buttons(){return [{pressed:pad.B,value:pad.B?1:0},{pressed:pad.C,value:pad.C?1:0},{pressed:pad.A,value:pad.A?1:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:pad.START,value:pad.START?1:0},{pressed:false,value:0},{pressed:false,value:0},{pressed:pad.UP,value:pad.UP?1:0},{pressed:pad.DOWN,value:pad.DOWN?1:0},{pressed:pad.LEFT,value:pad.LEFT?1:0},{pressed:pad.RIGHT,value:pad.RIGHT?1:0}];}
function clonePad(){axes[0]=pad.LEFT?-1:(pad.RIGHT?1:0);axes[1]=pad.UP?-1:(pad.DOWN?1:0);return {id:'NaP Virtual Mega Drive Pad',index:0,connected:true,timestamp:performance.now(),mapping:'standard',axes:axes.slice(),buttons:buttons()};}
navigator.getGamepads=function(){return [clonePad()];};navigator.webkitGetGamepads=navigator.getGamepads;setInterval(function(){try{window.dispatchEvent(new GamepadEvent('gamepadconnected',{gamepad:clonePad()}));}catch(_){}},1000);parentLog('VIRTUAL_GAMEPAD_READY');}catch(e){parentLog('VIRTUAL_GAMEPAD_FAIL '+(e.message||e));}}
function startClown(name,buf){if(booted){status('ROM ALREADY BOOTED - reloadni wrapper pro dalsi ROM');return;}booted=true;installGamepad();try{romBlobUrl=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));status('BOOTING_ROM '+name+' bytes='+buf.byteLength+' blob='+romBlobUrl.slice(0,32));
window.Module={arguments:[romBlobUrl],locateFile:function(path){return remoteBase+path;},canvas:document.getElementById('canvas'),preRun:[],postRun:[function(){parentLog('MODULE_POSTRUN');}],print:function(text){parentLog('PRINT '+text);},printErr:function(text){parentLog('ERR '+text);},setStatus:function(text){if(text)status('STATUS '+text);},totalDependencies:0,onRuntimeInitialized:function(){parentLog('RUNTIME_INITIALIZED');},noInitialRun:false};
window.onerror=function(m,u,l,c,e){parentLog('WINDOW_ERROR '+m+' @'+l+':'+c);};window.onunhandledrejection=function(e){parentLog('UNHANDLED_REJECTION '+(e.reason&&e.reason.message||e.reason||''));};
var s=document.createElement('script');s.async=true;s.src=remoteBase+'clownmdemu.js';s.onload=function(){parentLog('CLOWN_SCRIPT_LOADED');};s.onerror=function(){status('SCRIPT_ERROR clownmdemu.js');};document.body.appendChild(s);parentLog('SCRIPT_APPEND '+s.src);setTimeout(function(){try{document.getElementById('canvas').focus();}catch(_){}},500);
}catch(e){status('BOOT_FAIL '+(e.message||String(e)));}}
window.addEventListener('message',function(ev){var d=ev.data||{};if(!d.type)return;if(d.type==='nap-rom'){startClown(d.name||'cartridge.gen',d.buffer);}else if(d.type==='nap-input'){sendKey(d.button,!!d.down);}else if(d.type==='nap-input-state'){pad=d.buttons||pad;}},false);
status('WRAPPER_READY');
})();
</script></body></html>
