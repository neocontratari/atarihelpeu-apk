lastKeyStatus=(ok?'KEY_SENT_MULTI_PAD':'KEY_BLOCKED')+' '+btn+' '+(down?'DOWN':'UP')+' '+detail.join(' | ')+' | '+lastPadStatus;pushLog('BUILD2NG INPUT '+btn+' '+(down?'DOWN':'UP')+' -> '+lastKeyStatus);if(down)toast(btn+' -> key '+(btn==='A'?'Z + PAD-X':btn==='B'?'X + PAD-A':btn==='C'?'C + PAD-B':btn==='START'?'ENTER + PAD-START':'SIPKY + PAD'),900);return ok;}
function bindKeyButton(id,btn){var el=document.getElementById(id);if(!el)return;el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId);}catch(_){}sendKey(btn,true);},true);el.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();sendKey(btn,false);},true);el.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();sendKey(btn,false);},true);el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
function dpadDirectionFromEvent(e){var b=document.getElementById('dpad');if(!b)return null;var r=b.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)-.5;var y=(e.clientY-r.top)/Math.max(1,r.height)-.5;if(Math.abs(x)<.10&&Math.abs(y)<.10)return null;return Math.abs(x)>Math.abs(y)?(x<0?'LEFT':'RIGHT'):(y<0?'UP':'DOWN');}
function setDpadDir(dir){if(activeDpadDir===dir)return;if(activeDpadDir){padButtons[activeDpadDir]=false;sendKey(activeDpadDir,false);}activeDpadDir=dir;if(activeDpadDir){padButtons[activeDpadDir]=true;sendKey(activeDpadDir,true);}postPadState();}
function buildLogText(){return 'SEGA LOG / BUILD2NG\nAtariHelp.eu EMU-10 '+BUILD+'\n\nSTAV:\n- ClownMDEmu oficialni frontend bezi v nasi monitorove obrazovce\n- HRY/SBIRKA/CARTRIDGE otevre NAS ROM picker v appce a zkusi ROM poslat do ClownMDEmu jako drag/drop cartridge\n- KONZOLE = menu cely frontend; JOYSTICK = herni crop + focus\n- portret i landscape maji samostatne hitboxy pro ovladac\n- A/B/C posila keyboard Z/X/C + virtual Gamepad API: A=pad X, B=pad A, C=pad B\n- START=Enter + pad Start, DPAD=sipky + pad osy/tlacitka\n- zadny fake gameplay, ROM neni v APK ani v ZIPu\n- vybrana ROM: '+selectedRomName+'\n- frameLoaded: '+frameLoaded+'\n- posledni drop status: '+lastDropStatus+'\n- posledni key status: '+lastKeyStatus+'\n- posledni pad status: '+lastPadStatus+'\n\nPOSLEDNI UDALOSTI:\n'+(logLines.length?logLines.slice(-48).join('\n'):'zadne');}
function pad2(n){return ('0'+n).slice(-2);}function logFileName(){var d=new Date();return 'AtariHelp_SEGA_LOG_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.txt';}
function saveLog(){var txt=buildLogText(),fn=logFileName(),ok=false;try{if(window.AHSAVE&&typeof window.AHSAVE.save==='function'){window.AHSAVE.save(fn,txt);ok=true;}}catch(e){pushLog('AHSAVE.save failed '+e.message);}if(!ok){try{var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1200);ok=true;}catch(e2){showMonitor(txt);}}pushLog('BUILD2NG LOG SAVE '+(ok?'OK ':'FAILED ')+fn);toast(ok?'LOG ulozen: '+fn:'LOG zobrazen v monitoru',3200);}
['btnCollection','btnGames','cartSlot'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();requestRom(id);},true);});
var romInput=document.getElementById('romInput');if(romInput)romInput.addEventListener('change',function(e){var f=e.target&&e.target.files&&e.target.files[0];onRomSelected(f);},true);
var con=document.getElementById('btnConsole');if(con)con.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('console','menu');toast('KONZOLE: menu rezim. Software porad muzes pouzit rucne.',2600);},true);
var joy=document.getElementById('btnJoystick');if(joy)joy.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('joystick','play');injectVirtualPad();toast('JOYSTICK: herni crop + focus + virtual gamepad.',3000);},true);
var mon=document.getElementById('mdVideo');if(mon)mon.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();requestRom('monitor');},true);
var blank=document.getElementById('monitorBlank');if(blank)blank.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();requestRom('monitorBlank');},true);
bindKeyButton('btnA','A');bindKeyButton('btnB','B');bindKeyButton('btnC','C');bindKeyButton('btnStart','START');
var dpad=document.getElementById('dpad');if(dpad){dpad.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{dpad.setPointerCapture(e.pointerId);}catch(_){}setDpadDir(dpadDirectionFromEvent(e));},true);dpad.addEventListener('pointermove',function(e){if(e.buttons){e.preventDefault();e.stopPropagation();setDpadDir(dpadDirectionFromEvent(e));}},true);dpad.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
var saves=document.getElementById('btnSaves');if(saves)saves.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();saveLog();},true);
var man=document.getElementById('btnManuals');if(man)man.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showMonitor('BUILD2NG - CLOWNMDEMU CARTRIDGE DROP + VIRTUAL GAMEPAD\n\nHRY/SBIRKA/CARTRIDGE:\n- otevrou NAS ROM picker v aplikaci\n- vybrany soubor se zkusi poslat do ClownMDEmu jako drag/drop cartridge\n\nJOYSTICK:\n- herni crop + focus\n- A/B/C: keyboard + virtual Gamepad API\n\nLANDSCAPE:\n- obrazovka se roztahne na cely mobil\n- hitboxy ovladace se prepocitaji pro landscape\n\nPOCTIVE:\n- kdyz WebView/ClownMDEmu odmitne synteticky drop, v logu bude DROP_FAILED a zustava rucni Software picker.');},true);
var web=document.getElementById('btnWeb');if(web)web.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();try{location.href='https://atarihelp.eu/';}catch(_){}},true);
window.addEventListener('orientationchange',function(){pushLog('BUILD2NG ORIENTATION CHANGE '+(screen.orientation&&screen.orientation.type||'unknown'));setTimeout(function(){if(frameOpenRequested)setFrameMode('play','orientationchange');},400);});
drawPrompt('NAS CARTRIDGE / LANDSCAPE READY');pushLog('AtariHelp.eu EMU-10 '+BUILD+' pripraven - ClownMDEmu v monitoru; HRY/SBIRKA/CARTRIDGE zkusi nas ROM poslat jako auto drag/drop; virtual gamepad pro A/B/C a landscape hitboxy.');toast('BUILD2NG: HRY/SBIRKA/CARTRIDGE vyber nas ROM; zkusim auto vlozit cartridge.',6200);
})();
</script>
