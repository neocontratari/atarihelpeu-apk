<style>

#monitorBlank{position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:5;border-radius:20px;overflow:hidden;background:#000;border:1px solid rgba(80,170,255,.30);box-shadow:0 0 34px rgba(0,102,255,.25) inset;}

#clownFrameWrap.booting::after{content:"LOCAL CLOWNMD BOOT...";position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#ffe17a;font:900 clamp(9px,2.2vw,15px) "Courier New",monospace;text-shadow:0 0 10px #000;background:rgba(0,0,0,.50);padding:4px 2px;pointer-events:none;}
#monitorOverlay{position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:9;display:none;align-items:center;justify-content:center;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.88);border:1px solid rgba(80,170,255,.38);box-shadow:0 0 28px rgba(0,102,255,.25) inset;pointer-events:none;}
#monitorOverlay.show{display:flex;}
#monitorText{white-space:pre-wrap;text-align:left;width:88%;max-height:84%;overflow:hidden;color:#d9ecff;text-shadow:0 0 8px rgba(0,120,255,.7);font:900 clamp(9px,2.3vw,16px)/1.34 "Courier New",monospace;}
.toast{position:absolute;left:5%;right:5%;bottom:11%;z-index:70;display:none;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.84);border:1px solid rgba(75,155,255,.55);color:#d9ecff;font:900 13px/1.35 "Courier New",monospace;text-align:center;}
.toast.show{display:block;}
#logBadge{position:absolute;z-index:12;left:20.4%;top:94.15%;width:11.0%;text-align:center;pointer-events:none;color:#8fd8ff;font:900 clamp(9px,2.3vw,16px) "Courier New",monospace;text-shadow:0 0 10px #0076ff,0 0 18px #0076ff;letter-spacing:.08em;}
#romInput{display:none;}
@media (orientation:landscape) and (max-height:760px){
 html,body{width:100%;height:100%;overflow:hidden;background:#000;}body{display:block;}
 .stage{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;background:#000;box-shadow:none;}
 .skin{object-fit:cover;opacity:.20;filter:brightness(.72) contrast(1.1);}
 #monitorBlank,#mdVideo,#clownFrameWrap,#monitorOverlay{left:0;top:0;width:100%;height:100%;border-radius:0;border:0;}
 #clownFrameWrap.playMode #clownFrame{left:0;top:-8vh;width:100%;height:116vh;}
 #clownFrameWrap.menuMode #clownFrame{left:0;top:0;width:100%;height:100%;}
 #dpad{left:1.2%;top:51%;width:28%;height:47%;}
 #btnA{left:68.5%;top:66%;width:10%;height:19%;}
 #btnB{left:79%;top:60%;width:10%;height:19%;}
 #btnC{left:89%;top:55%;width:10%;height:19%;}
 #btnStart{left:43.5%;top:80%;width:13%;height:14%;}
 #btnConsole{left:2%;top:2%;width:16%;height:11%;}
 #btnJoystick{left:19%;top:2%;width:16%;height:11%;}
 #btnCollection{left:37%;top:2%;width:11%;height:11%;}
 #btnSaves{left:49%;top:2%;width:11%;height:11%;}
 #btnGames{left:61%;top:2%;width:11%;height:11%;}
 #btnManuals{left:73%;top:2%;width:11%;height:11%;}
 #btnWeb{left:85%;top:2%;width:7%;height:11%;}
 #btnMenu{left:92.5%;top:2%;width:6%;height:11%;}
 #cartSlot{left:58%;top:86%;width:20%;height:13%;}
 #cartCenter{left:36%;top:82%;width:26%;height:17%;}
 #btnReset{left:80%;top:86%;width:17%;height:13%;}
 .hit:active{background:rgba(0,118,255,.22);border-radius:16px;}
 #logBadge{display:none;}.toast{left:1%;right:1%;bottom:1%;font-size:11px;padding:6px 8px;}
}
</style>
</head>
<body>
<main class="stage" aria-label="SEGA Mega Drive module">
  <img class="skin" src="sega_megadrive_screen.png" alt="SEGA Mega Drive">
  <div id="monitorBlank" aria-hidden="true"></div>
  <canvas id="mdVideo" width="320" height="224" aria-label="SEGA Mega Drive status canvas"></canvas>
  <div id="clownFrameWrap"><iframe id="clownFrame" title="ClownMDEmu local wrapper" allow="autoplay; fullscreen; gamepad" tabindex="0"></iframe></div>
  <div id="monitorOverlay"><pre id="monitorText"></pre></div>
  <div id="logBadge" aria-hidden="true">LOG</div>
  <input id="romInput" type="file" accept=".gen,.bin,.md,.smd,.zip,application/zip,application/octet-stream">
  <button id="btnConsole" class="hit" type="button">KONZOLE</button>
  <button id="btnJoystick" class="hit" type="button">JOYSTICK</button>
  <button id="btnCollection" class="hit" type="button">SBIRKA</button>
  <button id="btnSaves" class="hit" type="button">ULOZENE</button>
  <button id="btnGames" class="hit" type="button">HRY</button>
  <button id="btnManuals" class="hit" type="button">NAVODY</button>
  <button id="btnWeb" class="hit" type="button">WEB</button>
  <a id="btnMenu" class="hit" href="../index.html">MENU</a>
  <button id="cartSlot" class="hit" type="button">CARTRIDGE SLOT</button>
  <button id="cartCenter" class="hit" type="button">CARTRIDGE</button>
  <button id="btnReset" class="hit" type="button">RESET</button>
  <button id="btnStart" class="hit" type="button">START</button>
  <button id="btnA" class="hit" type="button">A</button>
  <button id="btnB" class="hit" type="button">B</button>
  <button id="btnC" class="hit" type="button">C</button>
  <button id="dpad" class="hit" type="button">DPAD</button>
  <div id="toast" class="toast">BUILD2NJ: cartridge slot/reset + delsi stisk A/B/C.</div>
</main>
<script>
(function(){'use strict';
var BUILD='BUILD2NJ_SEGA_SLOT_RESET_MINHOLD_GAMEPAD_STAGE23';
var logLines=[], frameLoaded=false, selectedRomName='zadna', selectedRomSize=0, selectedRomBuffer=null, lastBootStatus='NO_ROM', lastKeyStatus='NO_KEY', activeDpadDir=null;
var padButtons={A:false,B:false,C:false,START:false,UP:false,DOWN:false,LEFT:false,RIGHT:false};
function $(id){return document.getElementById(id);}
function pushLog(t){var line=new Date().toLocaleTimeString()+' '+t;logLines.push(line);if(logLines.length>220)logLines.shift();try{console.log('[NAP SEGA NI] '+t);}catch(e){}return line;}
function toast(t,ms){var el=$('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(window.__segaToastTimer);window.__segaToastTimer=setTimeout(function(){el.classList.remove('show');},ms||2600);}
function showMonitor(t){var ov=$('monitorOverlay'),tx=$('monitorText');if(tx)tx.textContent=t;if(ov)ov.classList.add('show');}
function hideMonitor(){var ov=$('monitorOverlay');if(ov)ov.classList.remove('show');}
function drawStatus(title,sub){try{var c=$('mdVideo'),ctx=c.getContext('2d',{alpha:false})||c.getContext('2d');ctx.fillStyle='#020611';ctx.fillRect(0,0,320,224);for(var y=0;y<224;y+=7){ctx.fillStyle='rgba(60,150,255,.12)';ctx.fillRect(22,y,276,1);}ctx.strokeStyle='rgba(90,185,255,.55)';ctx.lineWidth=2;ctx.strokeRect(24,24,272,176);ctx.textAlign='center';ctx.fillStyle='#bfe9ff';ctx.font='bold 15px monospace';ctx.fillText(title||'CLOWNMD LOCAL READY',160,72);ctx.fillStyle='#d9f4ff';ctx.font='bold 11px monospace';(sub||'HRY/SBIRKA/CARTRIDGE = VYBER ROM').split('\n').forEach(function(line,i){ctx.fillText(line,160,104+i*17);});}catch(e){}}
function setFrameMode(mode,reason){var w=$('clownFrameWrap');if(!w)return;w.classList.remove('menuMode','playMode','booting');w.classList.add(mode==='menu'?'menuMode':'playMode');pushLog('BUILD2NJ FRAME MODE '+mode+' reason='+reason);}
function focusFrame(){try{var fr=$('clownFrame');fr&&fr.focus();fr&&fr.contentWindow&&fr.contentWindow.focus();}catch(e){}}
function requestRom(reason){pushLog('BUILD2NJ REQUEST ROM PICKER reason='+reason+(selectedRomBuffer?' oldRom='+selectedRomName:''));var inp=$('romInput');if(inp){try{inp.value='';}catch(_){} inp.click();toast('CARTRIDGE SLOT: vyber ROM / vymena cartridge',2200);}else toast('ROM picker nenalezen',2500);}
function openLocalWrapper(reason,mode){hideMonitor();drawStatus('LOCAL CLOWNMD BOOT','CEKAM NA WRAPPER / ROM');var w=$('clownFrameWrap'),fr=$('clownFrame');if(!w||!fr)return;w.style.display='block';w.classList.add('booting');setFrameMode(mode||'play',reason);frameLoaded=false;lastBootStatus='WRAPPER_LOADING';fr.onload=function(){frameLoaded=true;pushLog('BUILD2NJ WRAPPER IFRAME onload reason='+reason);setTimeout(postRomToWrapper,120);};fr.src='clown_local_boot.html#'+Date.now();toast('Nacitam lokalni ClownMDEmu wrapper...',2200);}
function postRomToWrapper(){var fr=$('clownFrame');if(!fr||!fr.contentWindow||!selectedRomBuffer){pushLog('BUILD2NJ POST_ROM skipped frame/buffer missing');return;}try{var copy=selectedRomBuffer.slice(0);fr.contentWindow.postMessage({type:'nap-rom',build:BUILD,name:selectedRomName,buffer:copy},'*',[copy]);lastBootStatus='ROM_POSTED_TO_LOCAL_WRAPPER '+selectedRomName+' bytes='+selectedRomSize;pushLog('BUILD2NJ ROM_POST_TO_LOCAL_WRAPPER name='+selectedRomName+' size='+selectedRomSize);toast('ROM poslana do lokalniho ClownMDEmu wrapperu',2600);}catch(e){lastBootStatus='ROM_POST_FAILED '+(e.message||String(e));pushLog('BUILD2NJ ROM_POST FAILED '+lastBootStatus);showMonitor('ROM POST FAILED\n'+lastBootStatus);}}
function stopWrapper(reason){var w=$('clownFrameWrap'),fr=$('clownFrame');pushLog('BUILD2NJ STOP_WRAPPER reason='+reason);try{if(fr){fr.onload=null;fr.src='about:blank';}}catch(_){} if(w){w.style.display='none';w.classList.remove('booting','menuMode','playMode');}frameLoaded=false;lastBootStatus='WRAPPER_STOPPED '+reason;drawStatus('CARTRIDGE EJECTED','HRY/SBIRKA/CARTRIDGE = VYBER ROM');}
function resetCurrent(reason){if(!selectedRomBuffer){pushLog('BUILD2NJ RESET ignored no ROM reason='+reason);toast('RESET: neni vlozena ROM',2200);return;}pushLog('BUILD2NJ RESET current ROM '+selectedRomName+' reason='+reason);toast('RESET: restart '+selectedRomName,2200);openLocalWrapper('reset:'+selectedRomName,'play');}
function ejectCurrent(reason){selectedRomBuffer=null;selectedRomName='zadna';selectedRomSize=0;lastKeyStatus='NO_KEY';stopWrapper('eject:'+reason);toast('CARTRIDGE vytazena',2200);}
function onRomSelected(f){if(!f){pushLog('BUILD2NJ ROM SELECT cancelled');return;}selectedRomName=f.name||'unknown.rom';selectedRomSize=f.size||0;lastBootStatus='READING_ROM';pushLog('BUILD2NJ ROM SELECTED name='+selectedRomName+' size='+selectedRomSize+' type='+(f.type||''));toast('ROM vybrana: '+selectedRomName,1800);var r=new FileReader();r.onerror=function(){lastBootStatus='FILE_READ_ERROR';pushLog('BUILD2NJ FILE_READ_ERROR '+selectedRomName);showMonitor('FILE READ ERROR\n'+selectedRomName);};r.onload=function(){selectedRomBuffer=r.result;pushLog('BUILD2NJ ROM READ OK name='+selectedRomName+' bytes='+selectedRomBuffer.byteLength);openLocalWrapper('romSelected:'+selectedRomName,'play');};r.readAsArrayBuffer(f);}
function keyDefs(btn){return {UP:[['ArrowUp','ArrowUp',38]],DOWN:[['ArrowDown','ArrowDown',40]],LEFT:[['ArrowLeft','ArrowLeft',37]],RIGHT:[['ArrowRight','ArrowRight',39]],A:[['z','KeyZ',90],['Z','KeyZ',90]],B:[['x','KeyX',88],['X','KeyX',88]],C:[['c','KeyC',67],['C','KeyC',67]],START:[['Enter','Enter',13]]}[btn]||null;}
function postPad(){var fr=$('clownFrame');try{fr&&fr.contentWindow&&fr.contentWindow.postMessage({type:'nap-input-state',buttons:JSON.parse(JSON.stringify(padButtons))},'*');}catch(e){}}
function sendToWrapper(btn,down){var fr=$('clownFrame');if(!fr||!fr.contentWindow){lastKeyStatus='NO_FRAME';return false;}padButtons[btn]=!!down;postPad();try{fr.contentWindow.postMessage({type:'nap-input',button:btn,down:!!down},'*');lastKeyStatus='POST_TO_WRAPPER '+btn+' '+(down?'DOWN':'UP');pushLog('BUILD2NJ INPUT '+lastKeyStatus);return true;}catch(e){lastKeyStatus='POST_FAIL '+(e.message||String(e));pushLog('BUILD2NJ INPUT FAIL '+lastKeyStatus);return false;}}
var holdTimers={};function releaseButtonDelayed(btn,delay){clearTimeout(holdTimers[btn]);holdTimers[btn]=setTimeout(function(){sendToWrapper(btn,false);},delay||120);}
function bindKeyButton(id,btn){var el=$(id);if(!el)return;el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId);}catch(_){}focusFrame();clearTimeout(holdTimers[btn]);sendToWrapper(btn,true);if(btn==='A'||btn==='B'||btn==='C'){setTimeout(function(){if(padButtons[btn])sendToWrapper(btn,true);},55);}},true);el.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();releaseButtonDelayed(btn,(btn==='A'||btn==='B'||btn==='C')?150:95);},true);el.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();releaseButtonDelayed(btn,60);},true);el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
function dpadDirectionFromEvent(e){var b=$('dpad');if(!b)return null;var r=b.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)-.5;var y=(e.clientY-r.top)/Math.max(1,r.height)-.5;if(Math.abs(x)<.10&&Math.abs(y)<.10)return null;return Math.abs(x)>Math.abs(y)?(x<0?'LEFT':'RIGHT'):(y<0?'UP':'DOWN');}
function setDpadDir(dir){if(activeDpadDir===dir)return;if(activeDpadDir)sendToWrapper(activeDpadDir,false);activeDpadDir=dir;if(activeDpadDir)sendToWrapper(activeDpadDir,true);}
function buildLogText(){return 'SEGA LOG / BUILD2NJ\nAtariHelp.eu EMU-10 '+BUILD+'\n\nSTAV:\n- ClownMDEmu se uz neotevira s obri DATA URL v adrese\n- HRY/SBIRKA/CARTRIDGE otevre NAS ROM picker\n- ROM se posle do lokalniho wrapperu clown_local_boot.html jako ArrayBuffer\n- wrapper vytvori Blob URL uvnitr sveho okna a spusti oficialni ClownMDEmu JS s Module.arguments=[blobURL]\n- cil: ClownMDEmu nacita NAS cartridge bez rucniho Software menu\n- A/B/C/START/DPAD posilaji postMessage do wrapperu, kde se generuji lokalni klavesy + virtual gamepad\n- portrait/landscape hitboxy zachovany\n- zadny fake gameplay, ROM neni v APK ani v ZIPu\n- vybrana ROM: '+selectedRomName+' size='+selectedRomSize+'\n- frameLoaded: '+frameLoaded+'\n- boot status: '+lastBootStatus+'\n- key status: '+lastKeyStatus+'\n\nPOSLEDNI UDALOSTI:\n'+(logLines.length?logLines.slice(-90).join('\n'):'zadne');}
function pad2(n){return ('0'+n).slice(-2);}function logFileName(){var d=new Date();return 'AtariHelp_SEGA_LOG_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.txt';}
function saveLog(){var txt=buildLogText(),fn=logFileName(),ok=false;try{if(window.AHSAVE&&typeof window.AHSAVE.save==='function'){window.AHSAVE.save(fn,txt);ok=true;}}catch(e){pushLog('AHSAVE.save failed '+e.message);}if(!ok){try{var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1200);ok=true;}catch(e2){showMonitor(txt);}}pushLog('BUILD2NJ LOG SAVE '+(ok?'OK ':'FAILED ')+fn);toast(ok?'LOG ulozen: '+fn:'LOG zobrazen v monitoru',3200);}
window.addEventListener('message',function(ev){var d=ev.data||{};if(!d||!d.type)return;if(d.type==='nap-wrapper-log'){pushLog('WRAPPER '+d.msg);if(/BOOT_FAIL|RUNTIME_ERROR|SCRIPT_ERROR|WASM|FETCH/.test(d.msg||'')){lastBootStatus='WRAPPER_'+d.msg;}if(/MAIN_STARTED|MODULE_POSTRUN|CANVAS_READY|BOOTING_ROM/.test(d.msg||'')){lastBootStatus=d.msg;}}},false);
['btnCollection','btnGames','cartSlot','cartCenter'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();requestRom(id);},true);});
var resetBtn=$('btnReset');if(resetBtn){resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetCurrent('btnReset');},true);resetBtn.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();ejectCurrent('btnResetLong');},true);}
var romInput=$('romInput');if(romInput)romInput.addEventListener('change',function(e){var f=e.target&&e.target.files&&e.target.files[0];onRomSelected(f);},true);
var con=$('btnConsole');if(con)con.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(frameLoaded){setFrameMode('menu','console');toast('KONZOLE: cely wrapper/menu rezim',2200);}else{openLocalWrapper('consoleNoRom','menu');}},true);
var joy=$('btnJoystick');if(joy)joy.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(frameLoaded){setFrameMode('play','joystick');focusFrame();toast('JOYSTICK: herni vyrez + focus',2200);}else toast('Nejdriv vyber ROM pres HRY/SBIRKA/CARTRIDGE',2600);},true);
bindKeyButton('btnA','A');bindKeyButton('btnB','B');bindKeyButton('btnC','C');bindKeyButton('btnStart','START');
var dpad=$('dpad');if(dpad){dpad.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{dpad.setPointerCapture(e.pointerId);}catch(_){}setDpadDir(dpadDirectionFromEvent(e));},true);dpad.addEventListener('pointermove',function(e){if(e.buttons){e.preventDefault();e.stopPropagation();setDpadDir(dpadDirectionFromEvent(e));}},true);dpad.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
var saves=$('btnSaves');if(saves)saves.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();saveLog();},true);
var man=$('btnManuals');if(man)man.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showMonitor('BUILD2NJ\n\nHRY/SBIRKA/CARTRIDGE:\n- vyberes ROM v nasi appce\n- ROM se neposila jako DATA URL do adresy\n- posle se do lokalniho wrapperu jako ArrayBuffer\n- wrapper vytvori Blob URL a spusti ClownMDEmu s Module.arguments\n\nRESET vpravo u cartridge restartuje aktualni ROM. CARTRIDGE SLOT / vlozena cartridge otevre picker pro novou hru. A/B/C maji prodlouzeny stisk, aby je hra neztratila mezi snimky.');},true);
var web=$('btnWeb');if(web)web.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();try{location.href='https://atarihelp.eu/';}catch(_){}},true);
window.addEventListener('orientationchange',function(){pushLog('BUILD2NJ ORIENTATION CHANGE '+(screen.orientation&&screen.orientation.type||'unknown'));setTimeout(function(){if(frameLoaded)setFrameMode('play','orientationchange');},400);});
drawStatus('LOCAL CLOWNMD READY','HRY/SBIRKA/CARTRIDGE = VYBER ROM');pushLog('AtariHelp.eu EMU-10 '+BUILD+' pripraven - lokalni wrapper pro ClownMDEmu Blob cartridge bez data URL v adrese.');toast('BUILD2NJ: vyber ROM pres HRY/SBIRKA/CARTRIDGE. Zadny data URL v adrese.',5200);
})();
</script>
</body>
</html>
