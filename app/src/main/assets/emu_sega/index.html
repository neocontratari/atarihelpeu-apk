<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SEGA Mega Drive — N&P Vision / ClownMDEmu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#02050a;color:#8fd8ff;font-family:"Courier New",monospace;overflow-x:hidden;}
body{display:flex;justify-content:center;align-items:flex-start;}
.stage{position:relative;width:min(100vw,941px);aspect-ratio:941/1672;background:#02050a;overflow:hidden;box-shadow:0 0 48px rgba(0,0,0,.95);}
.skin{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;z-index:1;}
.hit{position:absolute;z-index:20;border:0;background:transparent;color:transparent;font-size:0;line-height:0;text-decoration:none;cursor:pointer;touch-action:manipulation;}
.hit:active{background:rgba(0,118,255,.14);box-shadow:0 0 32px rgba(0,118,255,.28) inset;border-radius:18px;}
/* Hit zony podle 941x1672 PNG */
#btnConsole{left:68.3%;top:3.3%;width:14.1%;height:4.3%;}
#btnJoystick{left:82.0%;top:3.3%;width:14.1%;height:4.3%;}
#btnCollection{left:3.3%;top:90.2%;width:13.4%;height:7.2%;}
#btnSaves{left:19.2%;top:90.2%;width:13.4%;height:7.2%;}
#btnGames{left:35.2%;top:90.2%;width:13.4%;height:7.2%;}
#btnManuals{left:51.2%;top:90.2%;width:13.4%;height:7.2%;}
#btnWeb{left:67.1%;top:90.2%;width:13.4%;height:7.2%;}
#btnMenu{left:83.1%;top:90.2%;width:13.4%;height:7.2%;}
#cartSlot{left:35.0%;top:72.9%;width:30.5%;height:8.6%;}
#btnStart{left:45.0%;top:61.2%;width:10.5%;height:4.2%;}
#btnA{left:64.0%;top:52.4%;width:7.6%;height:5.9%;}
#btnB{left:71.6%;top:50.9%;width:8.4%;height:6.5%;}
#btnC{left:80.0%;top:49.2%;width:8.8%;height:7.0%;}
#dpad{left:14.3%;top:49.3%;width:22.0%;height:15.4%;}
#monitorBlank{cursor:pointer;touch-action:manipulation;position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:5;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(5,24,45,.92) 0%,rgba(0,0,0,.98) 70%);border:1px solid rgba(80,170,255,.30);box-shadow:0 0 34px rgba(0,102,255,.25) inset,0 0 18px rgba(0,0,0,.75);}
#monitorBlank:after{content:"CLOWNMDEMU READY\A KLIKNI HRY / CARTRIDGE";white-space:pre;position:absolute;left:0;right:0;top:38%;text-align:center;color:rgba(144,216,255,.62);font:900 clamp(10px,2.8vw,18px)/1.3 "Courier New",monospace;text-shadow:0 0 12px rgba(0,112,255,.55);letter-spacing:.08em;}
#mdVideo{cursor:pointer;touch-action:manipulation;position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:6;border-radius:20px;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
#clownFrameWrap{position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:7;border-radius:20px;overflow:hidden;background:#000;border:1px solid rgba(80,170,255,.25);display:none;}
#clownFrame{width:100%;height:100%;border:0;background:#000;display:block;}
#monitorOverlay{position:absolute;left:8.45%;top:14.95%;width:83.2%;height:31.1%;z-index:9;display:none;align-items:center;justify-content:center;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.88);border:1px solid rgba(80,170,255,.38);box-shadow:0 0 28px rgba(0,102,255,.25) inset;pointer-events:none;}
#monitorOverlay.show{display:flex;}
#monitorText{white-space:pre-wrap;text-align:left;width:88%;max-height:84%;overflow:hidden;color:#d9ecff;text-shadow:0 0 8px rgba(0,120,255,.7);font:900 clamp(9px,2.3vw,16px)/1.34 "Courier New",monospace;}
.toast{position:absolute;left:5%;right:5%;bottom:11%;z-index:30;display:none;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.84);border:1px solid rgba(75,155,255,.55);color:#d9ecff;font:900 13px/1.35 "Courier New",monospace;text-align:center;}
.toast.show{display:block;}
#logBadge{position:absolute;z-index:12;left:20.4%;top:94.15%;width:11.0%;text-align:center;pointer-events:none;color:#8fd8ff;font:900 clamp(9px,2.3vw,16px) "Courier New",monospace;text-shadow:0 0 10px #0076ff,0 0 18px #0076ff;letter-spacing:.08em;}
</style>
</head>
<body>
<main class="stage" aria-label="SEGA Mega Drive module">
  <img class="skin" src="sega_megadrive_screen.png" alt="SEGA Mega Drive">
  <div id="monitorBlank" aria-hidden="true"></div>
  <canvas id="mdVideo" width="320" height="224" aria-label="SEGA Mega Drive status canvas"></canvas>
  <div id="clownFrameWrap"><iframe id="clownFrame" title="ClownMDEmu official frontend" allow="autoplay; fullscreen; gamepad" tabindex="0"></iframe></div>
  <div id="monitorOverlay"><pre id="monitorText"></pre></div>
  <div id="logBadge" aria-hidden="true">LOG</div>
  <button id="btnConsole" class="hit" type="button">KONZOLE</button>
  <button id="btnJoystick" class="hit" type="button">JOYSTICK</button>
  <button id="btnCollection" class="hit" type="button">SBIRKA</button>
  <button id="btnSaves" class="hit" type="button">ULOZENE</button>
  <button id="btnGames" class="hit" type="button">HRY</button>
  <button id="btnManuals" class="hit" type="button">NAVODY</button>
  <button id="btnWeb" class="hit" type="button">WEB</button>
  <a id="btnMenu" class="hit" href="../index.html">MENU</a>
  <button id="cartSlot" class="hit" type="button">CARTRIDGE SLOT</button>
  <button id="btnStart" class="hit" type="button">START</button>
  <button id="btnA" class="hit" type="button">A</button>
  <button id="btnB" class="hit" type="button">B</button>
  <button id="btnC" class="hit" type="button">C</button>
  <button id="dpad" class="hit" type="button">DPAD</button>
  <div id="toast" class="toast">BUILD2NE: ClownMDEmu v monitoru, skin zachovan.</div>
</main>
<script>
(function(){
'use strict';
var BUILD='BUILD2NE_SEGA_CLOWNMD_IN_APP_FRAME_KEYS_STAGE18';
var CLOWN_URL='https://clownmdemu.clownacy.com/';
var logLines=[];
var frameLoaded=false;
var lastKeyStatus='NO_KEY_SENT';
var activeDpadDir=null;
function pushLog(t){var line=new Date().toLocaleTimeString()+' '+t;logLines.push(line);if(logLines.length>120)logLines.shift();try{console.log('[NAP SEGA] '+t);}catch(e){}return line;}
function toast(t,ms){var el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(window.__segaToastTimer);window.__segaToastTimer=setTimeout(function(){el.classList.remove('show');},ms||2600);}
function showMonitor(t){var ov=document.getElementById('monitorOverlay'),tx=document.getElementById('monitorText');if(tx)tx.textContent=t;if(ov)ov.classList.add('show');}
function hideMonitor(){var ov=document.getElementById('monitorOverlay');if(ov)ov.classList.remove('show');}
function drawPrompt(msg){try{var c=document.getElementById('mdVideo');if(!c||!c.getContext)return;var ctx=c.getContext('2d',{alpha:false})||c.getContext('2d');ctx.fillStyle='#020611';ctx.fillRect(0,0,320,224);var g=ctx.createRadialGradient(160,95,8,160,112,190);g.addColorStop(0,'#06386c');g.addColorStop(.65,'#030b16');g.addColorStop(1,'#000');ctx.fillStyle=g;ctx.fillRect(0,0,320,224);for(var y=0;y<224;y+=7){ctx.fillStyle='rgba(60,150,255,.12)';ctx.fillRect(22,y,276,1);}ctx.strokeStyle='rgba(90,185,255,.55)';ctx.lineWidth=2;ctx.strokeRect(24,24,272,176);ctx.textAlign='center';ctx.fillStyle='#bfe9ff';ctx.font='bold 15px monospace';ctx.fillText('CLOWNMDEMU WEB CORE',160,64);ctx.fillStyle='#d9f4ff';ctx.font='bold 11px monospace';ctx.fillText('HRY / SBIRKA / CARTRIDGE',160,106);ctx.fillText('OTEVRE OFICIALNI FRONTEND',160,124);ctx.fillStyle='rgba(255,220,120,.95)';ctx.font='bold 10px monospace';ctx.fillText(msg||'ZADNY FAKE - CEKAM NA CLOWNMD',160,172);}catch(e){pushLog('PROMPT DRAW FAILED '+(e.message||String(e)));}}
function focusFrame(){var fr=document.getElementById('clownFrame');if(!fr)return false;var ok=false;try{fr.focus();ok=true;}catch(e){pushLog('CLOWNMD FRAME focus element failed '+e.message);}try{if(fr.contentWindow&&typeof fr.contentWindow.focus==='function'){fr.contentWindow.focus();ok=true;}}catch(e2){pushLog('CLOWNMD FRAME focus window blocked '+e2.message);}return ok;}
function openClown(reason){hideMonitor();var wrap=document.getElementById('clownFrameWrap'),fr=document.getElementById('clownFrame'),canvas=document.getElementById('mdVideo'),blank=document.getElementById('monitorBlank');if(!wrap||!fr){toast('Chybi iframe pro ClownMDEmu.',4000);return;}if(canvas)canvas.style.display='none';if(blank)blank.style.display='none';wrap.style.display='block';if(!frameLoaded){pushLog('BUILD2NE CLOWNMD FRAME OPEN reason='+reason+' url='+CLOWN_URL);fr.onload=function(){pushLog('BUILD2NE CLOWNMD FRAME onload - oficialni frontend nacten do monitoru');toast('ClownMDEmu je v nasi obrazovce. V monitoru: Software -> vyber ROM.',5200);focusFrame();};fr.src=CLOWN_URL;frameLoaded=true;toast('Nacitám ClownMDEmu do nasi obrazovky...',4200);}else{pushLog('BUILD2NE CLOWNMD FRAME FOCUS reason='+reason);toast('ClownMDEmu uz bezi v monitoru.',2500);focusFrame();}}
function keyDef(btn){var m={UP:['ArrowUp','ArrowUp',38],DOWN:['ArrowDown','ArrowDown',40],LEFT:['ArrowLeft','ArrowLeft',37],RIGHT:['ArrowRight','ArrowRight',39],A:['z','KeyZ',90],B:['x','KeyX',88],C:['c','KeyC',67],START:['Enter','Enter',13]};return m[btn]||null;}
function makeKeyEvent(type,def){var ev=new KeyboardEvent(type,{key:def[0],code:def[1],bubbles:true,cancelable:true});try{Object.defineProperty(ev,'keyCode',{get:function(){return def[2];}});Object.defineProperty(ev,'which',{get:function(){return def[2];}});}catch(e){}return ev;}
function sendKey(btn,down){if(!frameLoaded)openClown('button:'+btn);var fr=document.getElementById('clownFrame');var def=keyDef(btn);if(!def||!fr){lastKeyStatus='NO_FRAME_OR_KEYDEF';return false;}var type=down?'keydown':'keyup';var ok=false,detail=[];focusFrame();try{fr.contentWindow.dispatchEvent(makeKeyEvent(type,def));ok=true;detail.push('contentWindow.dispatchEvent OK');}catch(e){detail.push('contentWindow.dispatchEvent BLOCKED '+(e.message||String(e)));}
try{window.dispatchEvent(makeKeyEvent(type,def));document.dispatchEvent(makeKeyEvent(type,def));detail.push('parent.dispatchEvent OK');}catch(e2){detail.push('parent.dispatchEvent FAILED '+(e2.message||String(e2)));}
lastKeyStatus=(ok?'KEY_SENT_TO_FRAME':'KEY_SENT_PARENT_ONLY_OR_BLOCKED')+' '+btn+' '+type+' '+detail.join(' | ');pushLog('BUILD2NE INPUT '+btn+' '+type+' -> '+lastKeyStatus);if(down&&!ok)toast(btn+': iframe muze blokovat synteticke klavesy. Klepni do hry / testni HW klavesnici.',2500);return ok;}
function bindKeyButton(id,btn){var el=document.getElementById(id);if(!el)return;el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId);}catch(_){}sendKey(btn,true);},true);el.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();sendKey(btn,false);},true);el.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();sendKey(btn,false);},true);el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
function dpadDirectionFromEvent(e){var b=document.getElementById('dpad');if(!b)return null;var r=b.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)-.5;var y=(e.clientY-r.top)/Math.max(1,r.height)-.5;if(Math.abs(x)<.12&&Math.abs(y)<.12)return null;return Math.abs(x)>Math.abs(y)?(x<0?'LEFT':'RIGHT'):(y<0?'UP':'DOWN');}
function setDpadDir(dir){if(activeDpadDir===dir)return;if(activeDpadDir)sendKey(activeDpadDir,false);activeDpadDir=dir;if(activeDpadDir)sendKey(activeDpadDir,true);}
function buildLogText(){return 'SEGA LOG / BUILD2NE\nAtariHelp.eu EMU-10 '+BUILD+'\n\nSTAV:\n- original Sega skin zachovan\n- HRY/SBIRKA/CARTRIDGE otevre oficialni ClownMDEmu frontend do nasi monitorove obrazovky\n- Sonic v oficialnim ClownMDEmu byl uz overen uzivatelem ve WebView/Nox\n- nase tlacitka A/B/C/START/D-PAD zkousi posilat defaultni ClownMDEmu klavesy: Z/X/C/Enter/sipky\n- ROM neni v APK ani v ZIPu\n- zadny fake gameplay\n- posledni key status: '+lastKeyStatus+'\n- frameLoaded: '+frameLoaded+'\n\nPOSLEDNI UDALOSTI:\n'+(logLines.length?logLines.slice(-30).join('\n'):'zadne');}
function pad2(n){return ('0'+n).slice(-2);}function logFileName(){var d=new Date();return 'AtariHelp_SEGA_LOG_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.txt';}
function saveLog(){var txt=buildLogText(),fn=logFileName(),ok=false;try{if(window.AHSAVE&&typeof window.AHSAVE.save==='function'){window.AHSAVE.save(fn,txt);ok=true;}}catch(e){pushLog('AHSAVE.save failed '+e.message);}if(!ok){try{var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1200);ok=true;}catch(e2){showMonitor(txt);}}pushLog('BUILD2NE LOG SAVE '+(ok?'OK ':'FAILED ')+fn);toast(ok?'LOG ulozen: '+fn:'LOG zobrazen v monitoru',3200);}
['btnCollection','btnGames','cartSlot'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown(id);},true);});
var con=document.getElementById('btnConsole');if(con)con.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('console');toast('KONZOLE: ClownMDEmu v monitoru, moje grafika vypnuta.',2600);},true);
var joy=document.getElementById('btnJoystick');if(joy)joy.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('joystick');toast('JOYSTICK: focus na ClownMDEmu, tlacitka zkousi klavesy.',2800);},true);
var mon=document.getElementById('mdVideo');if(mon)mon.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('monitor');},true);
var blank=document.getElementById('monitorBlank');if(blank)blank.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openClown('monitorBlank');},true);
bindKeyButton('btnA','A');bindKeyButton('btnB','B');bindKeyButton('btnC','C');bindKeyButton('btnStart','START');
var dpad=document.getElementById('dpad');if(dpad){dpad.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{dpad.setPointerCapture(e.pointerId);}catch(_){}setDpadDir(dpadDirectionFromEvent(e));},true);dpad.addEventListener('pointermove',function(e){if(e.buttons){e.preventDefault();e.stopPropagation();setDpadDir(dpadDirectionFromEvent(e));}},true);dpad.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
var saves=document.getElementById('btnSaves');if(saves)saves.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();saveLog();},true);
var man=document.getElementById('btnManuals');if(man)man.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showMonitor('BUILD2NE - CLOWNMDEMU V NASI OBRAZOVCE\n\nHRY / SBIRKA / CARTRIDGE:\n- nacte oficialni ClownMDEmu frontend do monitoru\n- v monitoru pouzij menu Software a vyber ROM\n\nNASE TLACITKA:\n- D-PAD = sipky\n- A = Z\n- B = X\n- C = C\n- START = Enter\n\nPoznamka: pokud WebView blokuje synteticke klavesy do iframe, log napise KEY...BLOCKED. Pak dalsi krok je native WebView KeyEvent bridge, ne dalsi grafika.');},true);
var web=document.getElementById('btnWeb');if(web)web.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();try{location.href='https://atarihelp.eu/';}catch(_){}});
drawPrompt('KLIKNI HRY / CARTRIDGE');pushLog('AtariHelp.eu EMU-10 '+BUILD+' pripraven - ClownMDEmu se bude nacitat primo do nasi Sega obrazovky; zadny fake Sonic.');toast('BUILD2NE: klikni HRY/CARTRIDGE, ClownMDEmu se otevre v nasi obrazovce.',5200);
})();
</script>
</body>
</html>
