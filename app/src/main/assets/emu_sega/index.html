<script>
(function(){
'use strict';
var BUILD='BUILD2MY_SEGA_DOC_CURRENTSCRIPT_BIND_STAGE12';
var coreReady=false;
var segaLog=[];
var lastRomInfo=null;
var segaBridge=null;
var activeDpadDir=null;
var coreSlot=null;
var coreSlotInfo="CORE_SLOT_NOT_STARTED";
var consoleLongPressTimer=0;
var consoleLongPressFired=false;
function pushLog(t){ var line=new Date().toLocaleTimeString()+' '+t; segaLog.push(line); if(segaLog.length>80) segaLog.shift(); return line; }
function log(t){ try{console.log('[NAP SEGA] '+t);}catch(e){} pushLog(t); }
function toast(t,ms){
  var el=document.getElementById('toast');
  if(!el) return;
  el.textContent=t;
  el.classList.add('show');
  clearTimeout(window.__segaToastTimer);
  window.__segaToastTimer=setTimeout(function(){ el.classList.remove('show'); },ms||2400);
}
function showMonitor(t){
  var ov=document.getElementById('monitorOverlay');
  var tx=document.getElementById('monitorText');
  if(tx) tx.textContent=t;
  if(ov) ov.classList.add('show');
}
function hideMonitor(){
  var ov=document.getElementById('monitorOverlay');
  if(ov) ov.classList.remove('show');
}
function openWeb(url){
  log('OPEN WEB '+url);
  try{
    if(window.Android && typeof window.Android.openExternal==='function'){ window.Android.openExternal(url); return; }
    if(window.Android && typeof window.Android.openUrl==='function'){ window.Android.openUrl(url); return; }
    if(window.Android && typeof window.Android.openExternalUrl==='function'){ window.Android.openExternalUrl(url); return; }
  }catch(e){ log('Android bridge failed: '+e.message); }
  try{ window.location.href=url; }catch(e){ location.href=url; }
}
function ascii(bytes,off,len){
  var s='';
  for(var i=0;i<len && off+i<bytes.length;i++){
    var c=bytes[off+i];
    s += (c>=32 && c<=126) ? String.fromCharCode(c) : ' ';
  }
  return s.replace(/\s+/g,' ').trim();
}
function hex2(n){return ('0'+(n&255).toString(16).toUpperCase()).slice(-2);}
function hex4(n){return ('000'+(n&65535).toString(16).toUpperCase()).slice(-4);}
function crc32(bytes){
  var c, table=[];
  for(var n=0;n<256;n++){
    c=n;
    for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    table[n]=c>>>0;
  }
  c=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c=table[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function mdChecksum(bytes){
  var sum=0;
  for(var i=0x200;i+1<bytes.length;i+=2){
    sum=(sum+((bytes[i]<<8)|bytes[i+1]))&0xFFFF;
  }
  return sum;
}
function read16(bytes,off){return ((bytes[off]<<8)|bytes[off+1])&0xFFFF;}
function looksSmd(bytes){
  return bytes.length>0x4200 && (bytes.length%0x4000)===512 && ascii(bytes,0x100+512,16).indexOf('SEGA')>=0;
}
function deinterleaveSmd(bytes){
  var header=512;
  var out=new Uint8Array(bytes.length-header);
  var pos=0;
  for(var block=header; block<bytes.length; block+=0x4000){
    var end=Math.min(block+0x4000,bytes.length);
    var half=(end-block)>>1;
    for(var i=0;i<half;i++){
      out[pos+i*2]=bytes[block+half+i];
      out[pos+i*2+1]=bytes[block+i];
    }
    pos+=half*2;
  }
  return out;
}
function analyzeRom(bytes,name){
  var originalLen=bytes.length;
  var format='RAW BIN/GEN/MD';
  if(looksSmd(bytes)){
    bytes=deinterleaveSmd(bytes);
    format='SMD deinterleaved';
  }
  if(bytes.length<0x200) throw new Error('Soubor je moc maly pro Mega Drive ROM header.');
  var consoleName=ascii(bytes,0x100,16);
  var domestic=ascii(bytes,0x120,48);
  var overseas=ascii(bytes,0x150,48);
  var serial=ascii(bytes,0x180,14);
  var hdrCrc=read16(bytes,0x18E);
  var calcCrc=mdChecksum(bytes);
  var io=ascii(bytes,0x190,16);
  var region=ascii(bytes,0x1F0,16);
  var ok=/SEGA/.test(consoleName);
  var crc=crc32(bytes).toString(16).toUpperCase();
  while(crc.length<8) crc='0'+crc;
  return {ok:ok,name:name,format:format,originalLen:originalLen,len:bytes.length,romBytes:bytes,consoleName:consoleName,domestic:domestic,overseas:overseas,serial:serial,hdrCrc:hdrCrc,calcCrc:calcCrc,io:io,region:region,crc32:crc};
}
function openRomPicker(){
  var inp=document.getElementById('romInput');
  if(!inp) return;
  inp.value='';
  try{ inp.click(); }catch(e){ toast('ROM picker se nepodarilo otevrit: '+e.message,3500); }
}
function detectCoreSlot(){
  coreSlot = window.NAP_SEGA_CORE_SLOT || null;
  if(!coreSlot){ coreSlotInfo='CORE_SLOT_SCRIPT_MISSING'; log('SEGA CORE SLOT BUILD2MY: nap_sega_core_slot.js nenalezen'); }
  return coreSlot;
}
function openCorePicker(){
  var inp=document.getElementById('coreInput');
  if(!inp){ toast('CORE picker chybi.',3000); return; }
  inp.value='';
  try{ inp.click(); toast('CORE picker: jen .js adapter nebo .wasm + JS glue. ROM patri do HRY/SBIRKA.',4200); }
  catch(e){ toast('CORE picker se nepodarilo otevrit: '+e.message,3500); }
}
function rescanCoreBridge(reason){
  try{ segaBridge=null; coreReady=false; }catch(e){}
  var b=initSegaBridge();
  log('SEGA CORE RESCAN BUILD2MY reason='+(reason||'manual')+' status='+coreStatusLine());
  return b;
}
function startCoreSlotAutoload(){
  var slot=detectCoreSlot();
  if(!slot || typeof slot.loadBuiltInCandidates!=='function') return;
  try{
    slot.loadBuiltInCandidates(log,function(res){
      coreSlotInfo=(res && res.status) ? res.status : 'CORE_SLOT_AUTOLOAD_DONE_UNKNOWN';
      log('SEGA CORE SLOT BUILD2MY AUTOLOAD RESULT: '+coreSlotInfo);
      rescanCoreBridge('autoload:'+coreSlotInfo);
    });
  }catch(e){
    coreSlotInfo='CORE_SLOT_AUTOLOAD_FAILED:'+e.message;
    log('SEGA CORE SLOT BUILD2MY AUTOLOAD ERROR: '+e.message);
  }
}
function explainWrongCoreFile(fileName, status){
  var txt='SEGA CORE PICKER - TOHLE NENI CORE\n\n';
  txt+='Vybrany soubor: '+(fileName||'neznamy')+'\n';
  txt+='Status: '+(status||'UNSUPPORTED_CORE_FILE_EXTENSION')+'\n\n';
  txt+='Tohle vypada jako ROM / cartridge, ne jako emulatorovy core adapter.\n\n';
  txt+='PRO HRU SONIC / ALADDIN / ROM:\n';
  txt+='- pouzij SBIRKA, HRY nebo CARTRIDGE SLOT\n';
  txt+='- podporovane ROM: .gen / .bin / .md / .smd\n\n';
  txt+='PRO REALNY CORE:\n';
  txt+='- dlouhy stisk KONZOLE bere .js/.mjs adapter nebo .wasm + JS glue\n';
  txt+='- samotny .wasm nestaci bez JS glue/adapteru\n\n';
  txt+='ROM zustava nactena, ale core porad chybi. Zadny fake obraz nespoustim.';
  showMonitor(txt);
  toast('Vybral jsi ROM do CORE pickeru. Pro Sonic pouzij HRY/SBIRKA/CARTRIDGE.',6200);
}
function explainWasmNeedsGlue(fileName, status){
  var txt='SEGA CORE PICKER - WASM NESTACI SAMOTNY\n\n';
  txt+='Soubor: '+(fileName||'neznamy')+'\n';
  txt+='Status: '+(status||'WASM_STORED_JS_ADAPTER_REQUIRED')+'\n\n';
  txt+='WASM je jen binarni jadro. V Android WebView ho musi spustit JS glue/adapter, ktery vytvori globalni adapter napr. NAP_SEGA_REAL_CORE nebo GenesisPlusGX. BUILD2MY umi ulozit WASM blob URL pro navazany JS adapter.\n\n';
  txt+='Ted jsem WASM jen ulozil jako blob URL pro adapter, ale hra jeste nebezi.';
  showMonitor(txt);
  toast('WASM ulozen, ale chybi JS glue/adapter.',6200);
}
function explainJsLoadedNoAdapter(fileName, status){
  var txt='SEGA CORE PICKER - JS NACTEN, ALE BEZ ADAPTERU\n\n';
  txt+='Soubor: '+(fileName||'neznamy')+'\n';
  txt+='Status: '+(status||'EXTERNAL_JS_LOADED_BUT_NO_ADAPTER')+'\n\n';
  txt+='Soubor se nacetl, ale nevytvoril zadny znamy adapter symbol/API. Hledam napr.:\n';
  txt+='NAP_SEGA_REAL_CORE, NAP_REAL_SEGA_CORE, SegaMDCore, GenesisCore, GenesisPlusGX, GPGX, JSMooGenesis, MegaDriveCore, MDCore, JSMD.\n\n';
  txt+='Bez toho nebudu kreslit fake obraz.';
  showMonitor(txt);
  toast('JS nacten, ale neobsahuje rozpoznany Sega adapter.',6200);
}
function handleCoreFile(file){
  if(!file) return;
  var slot=detectCoreSlot();
  if(!slot || typeof slot.loadExternalCoreFile!=='function'){ toast('CORE SLOT loader neni dostupny.',3600); return; }
  var fname=file.name||'';
  var lower=fname.toLowerCase();
  if(/\.(gen|bin|md|smd|sms|gg|zip|7z|rar)$/i.test(lower)){
    coreSlotInfo='ROM_SELECTED_IN_CORE_PICKER';
    log('SEGA CORE SLOT BUILD2MY: ROM vybrana omylem do CORE pickeru: '+fname);
    rescanCoreBridge('external:'+coreSlotInfo);
    explainWrongCoreFile(fname, coreSlotInfo);
    return;
  }
  toast('Nacitam realny core soubor: '+fname,3600);
  try{
    slot.loadExternalCoreFile(file,log,function(res){
      coreSlotInfo=(res && res.status) ? res.status : 'CORE_SLOT_EXTERNAL_DONE_UNKNOWN';
      rescanCoreBridge('external:'+coreSlotInfo);
      if(coreSlotInfo==='UNSUPPORTED_CORE_FILE_EXTENSION'){
        explainWrongCoreFile(fname, coreSlotInfo);
        return;
      }
      if(coreSlotInfo==='WASM_STORED_JS_ADAPTER_REQUIRED'){
        explainWasmNeedsGlue(fname, coreSlotInfo);
        return;
      }
      if(coreSlotInfo==='EXTERNAL_JS_LOADED_BUT_NO_ADAPTER'){
        explainJsLoadedNoAdapter(fname, coreSlotInfo);
        return;
      }
      if(coreSlotInfo.indexOf('EXTERNAL_JS_LOAD_FAILED')===0 || coreSlotInfo.indexOf('EXTERNAL_JS_READ_FAILED')===0){
        showMonitor('SEGA REAL CORE SLOT - CHYBA\n\nSoubor: '+fname+'\nStatus: '+coreSlotInfo);
        toast('Core JS se nepodarilo nacist.',5200);
        return;
      }
      var txt='SEGA REAL CORE SLOT - BUILD2MY\n\n';
      txt+='Soubor: '+fname+'\n';
      txt+='Status: '+coreSlotInfo+'\n';
      txt+='Bridge: '+coreStatusLine()+'\n\n';
      txt+='Pokud je adapter nalezeny a ROM uz byla vybrana, zkousim ROM znovu poslat do realneho core.\n';
      if(lastRomInfo){
        var r=attemptCoreLoad(lastRomInfo);
        txt+='ROM resend: '+(r.status||'UNKNOWN')+'\n';
      } else {
        txt+='ROM resend: zatim neni vybrana ROM.\n';
      }
      showMonitor(txt);
      toast(coreReady ? 'Realny core adapter nalezen.' : 'Soubor nacten, ale realny kompatibilni adapter API porad neni pripraven.',5200);
    });
  }catch(e){
    coreSlotInfo='CORE_SLOT_EXTERNAL_FAILED:'+e.message;
    showMonitor('SEGA REAL CORE SLOT - CHYBA\n\n'+coreSlotInfo);
    toast('Core load chyba: '+e.message,4200);
  }
}

function initSegaBridge(){
  if(segaBridge) return segaBridge;
  try{
    if(!window.NAPSegaCoreBridge){
      log('SEGA CORE BRIDGE BUILD2MY: nap_sega_core_bridge.js nenalezen');
      coreReady=false;
      return null;
    }
    segaBridge=new window.NAPSegaCoreBridge(document.getElementById('mdVideo'), log);
    coreReady=!!segaBridge.init();
    log('SEGA CORE BRIDGE BUILD2MY STATUS: '+segaBridge.getStatusLine());
    return segaBridge;
  }catch(e){
    coreReady=false;
    log('SEGA CORE BRIDGE BUILD2MY INIT ERROR: '+e.message);
    return null;
  }
}
function coreStatusLine(){
  var b=initSegaBridge();
  if(!b) return 'BRIDGE_SCRIPT_MISSING';
  return b.getStatusLine();
}
function attemptCoreLoad(info){
  var b=initSegaBridge();
  if(!b) return {ok:false,status:'BRIDGE_SCRIPT_MISSING'};
  var romBytes=(info && info.romBytes) ? info.romBytes : null;
  var res=b.loadRom(romBytes,info || {});
  coreReady=!!(res && res.ok);
  return res || {ok:false,status:'CORE_LOAD_NO_RESULT'};
}
function segaInput(button,down){
  var b=initSegaBridge();
  var ok=false;
  if(b) ok=down ? b.press(button) : b.release(button);
  log('SEGA INPUT BUILD2MY '+(down?'DOWN ':'UP ')+button+' -> '+(ok?'SENT_TO_REAL_CORE':'CORE_NOT_READY'));
  if(down && !ok) toast(button+' vstup pripraven. Ceka na realny core adapter.',1300);
  return ok;
}

function handleRomFile(file){
  if(!file) return;
  var reader=new FileReader();
  toast('Nacitam ROM: '+file.name,3000);
  reader.onerror=function(){toast('CHYBA: ROM soubor nejde precist.',4000);};
  reader.onload=function(){
    try{
      var bytes=new Uint8Array(reader.result);
      var info=analyzeRom(bytes,file.name);
      lastRomInfo=info;
      log('SEGA ROM HEADER BUILD2MY file='+info.name+' size='+info.len+' console='+info.consoleName+' title='+info.overseas+' region='+info.region+' crc32='+info.crc32);
      if(!info.ok){
        showMonitor('SEGA ROM CHECK\n\nCHYBA: header neobsahuje SEGA.\nSoubor: '+info.name+'\nVelikost: '+info.originalLen+' B');
        toast('Tohle nevypada jako Mega Drive ROM.',4200);
        return;
      }
      var coreRes=attemptCoreLoad(info);
      var txt='SEGA ROM CHECK - OK\n';
      txt+='BUILD2MY ORIGIN GUARD PATCH STAGE10\n\n';
      txt+='Soubor: '+info.name+'\n';
      txt+='Format: '+info.format+'\n';
      txt+='Velikost: '+Math.round(info.len/1024)+' KB\n';
      txt+='Console: '+info.consoleName+'\n';
      txt+='Title: '+(info.overseas||info.domestic)+'\n';
      txt+='Serial: '+info.serial+'\n';
      txt+='Region: '+info.region+'\n';
      txt+='Header CRC: $'+hex4(info.hdrCrc)+'\n';
      txt+='Calc CRC:   $'+hex4(info.calcCrc)+(info.hdrCrc===info.calcCrc?' OK':' DIFF')+'\n';
      txt+='File CRC32: '+info.crc32+'\n\n';
      txt+='CORE BRIDGE: '+(coreRes.status||'UNKNOWN')+'\n';
      txt+='CANVAS: 320x224 real-core video target\n';
      txt+='Zadny fake Sonic. Pokud chybi realny core adapter, hra se nespusti.';
      if((coreRes.status||'').indexOf('ROM_LOAD_PROMISE_PENDING')===0){
        hideMonitor();
        toast('Core probe nastartovan - cekam na realny engine/obraz.',5200);
      }else{
        showMonitor(txt);
        toast(coreRes.ok ? ('ROM poslana do realneho core: '+(info.overseas||info.domestic)) : ('ROM OK, core jeste chybi: '+(info.overseas||info.domestic)),5200);
      }
    }catch(e){
      showMonitor('SEGA ROM CHECK\n\nCHYBA: '+e.message);
      toast('ROM chyba: '+e.message,4200);
    }
  };
  reader.readAsArrayBuffer(file);
}
['btnCollection','btnGames','cartSlot'].forEach(function(id){
  var b=document.getElementById(id);
  if(b) b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openRomPicker();},true);
});
var consoleBtn=document.getElementById('btnConsole');
if(consoleBtn){
  consoleBtn.addEventListener('pointerdown',function(e){
    consoleLongPressFired=false;
    clearTimeout(consoleLongPressTimer);
    consoleLongPressTimer=setTimeout(function(){ consoleLongPressFired=true; openCorePicker(); },850);
  },true);
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    consoleBtn.addEventListener(ev,function(){ clearTimeout(consoleLongPressTimer); },true);
  });
  consoleBtn.addEventListener('click',function(e){
    e.preventDefault(); e.stopPropagation();

function bindButtonInput(id,button){

  b.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();segaInput(button,false);},true);
  b.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();segaInput(button,false);},true);
  b.addEventListener('pointerleave',function(e){if(e.buttons){segaInput(button,false);}},true);

}
function dpadDirectionFromEvent(e){
  var b=document.getElementById('dpad');
  if(!b) return null;
  var r=b.getBoundingClientRect();
  var x=(e.clientX-r.left)/Math.max(1,r.width)-0.5;
  var y=(e.clientY-r.top)/Math.max(1,r.height)-0.5;
  if(Math.abs(x)<0.12 && Math.abs(y)<0.12) return null;
  return Math.abs(x)>Math.abs(y) ? (x<0?'LEFT':'RIGHT') : (y<0?'UP':'DOWN');
}
function setDpadDir(dir){
  if(activeDpadDir===dir) return;
  if(activeDpadDir) segaInput(activeDpadDir,false);
  activeDpadDir=dir;
  if(activeDpadDir) segaInput(activeDpadDir,true);
}

}

function pad2(n){return ('0'+n).slice(-2);}
function logFileName(){
  var d=new Date();
  return 'AtariHelp_SEGA_LOG_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.txt';
}
function b64utf8(txt){
  try{return btoa(unescape(encodeURIComponent(txt)));}catch(e){try{return btoa(txt);}catch(_){return '';}}
}
function tryAndroidSaveText(filename,txt){
  // BUILD2MY: realni nativni bridge v tehle appce neni window.Android, ale AHSAVE.
  // MainActivity uz dlouho umi AHSAVE.save(name,text) a uklada do Downloads/AtariHelp.
  try{
    if(window.AHSAVE && typeof window.AHSAVE.save==='function'){
      var res=window.AHSAVE.save(filename,txt);
      log('SEGA LOG DOWNLOAD BUILD2MY: AHSAVE.save -> '+res);
      window.__segaLastSaveResult=res||('DOWNLOADS_OK: Downloads/AtariHelp/'+filename);
      return true;
    }
  }catch(e0){ log('SEGA LOG DOWNLOAD BUILD2MY: AHSAVE.save failed '+e0.message); }
  try{
    if(window.AHSAVE && typeof window.AHSAVE.saveBase64==='function'){
      var res2=window.AHSAVE.saveBase64(filename,b64utf8(txt));
      log('SEGA LOG DOWNLOAD BUILD2MY: AHSAVE.saveBase64 -> '+res2);
      window.__segaLastSaveResult=res2||('DOWNLOADS_OK: Downloads/AtariHelp/'+filename);
      return true;
    }
  }catch(e00){ log('SEGA LOG DOWNLOAD BUILD2MY: AHSAVE.saveBase64 failed '+e00.message); }
  try{
    if(window.Android){
      var b64=b64utf8(txt);
      var methods=[
        ['saveSegaLog',[txt,filename]],
        ['saveLog',[txt,filename]],
        ['saveTextToDownloads',[filename,txt]],
        ['saveTextFile',[filename,txt]],
        ['downloadText',[filename,txt]],
        ['saveFile',[filename,txt]],
        ['saveBase64ToDownloads',[filename,b64,'text/plain']],
        ['saveBase64File',[filename,b64,'text/plain']]
      ];
      for(var i=0;i<methods.length;i++){
        var name=methods[i][0], args=methods[i][1];
        if(typeof window.Android[name]==='function'){
          window.Android[name].apply(window.Android,args);
          log('SEGA LOG DOWNLOAD BUILD2MY: Android.'+name+' -> '+filename);
          window.__segaLastSaveResult='ANDROID_OK: '+name+' '+filename;
          return true;
        }
      }
    }
  }catch(e){ log('SEGA LOG DOWNLOAD BUILD2MY: Android save failed '+e.message); }
  return false;
}
function tryBrowserDownload(filename,txt){
  try{
    var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){try{URL.revokeObjectURL(url);a.remove();}catch(e){}},1600);
    log('SEGA LOG DOWNLOAD BUILD2MY: browser download -> '+filename);
    return true;
  }catch(e){ log('SEGA LOG DOWNLOAD BUILD2MY: blob download failed '+e.message); }
  try{
    var a2=document.createElement('a');
    a2.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
    a2.download=filename;
    a2.style.display='none';
    document.body.appendChild(a2);
    a2.click();
    setTimeout(function(){try{a2.remove();}catch(e){}},1600);
    log('SEGA LOG DOWNLOAD BUILD2MY: data download -> '+filename);
    return true;
  }catch(e2){ log('SEGA LOG DOWNLOAD BUILD2MY: data download failed '+e2.message); }
  return false;
}
function saveLogToDownloads(txt){
  var filename=logFileName();
  var ok=tryAndroidSaveText(filename,txt) || tryBrowserDownload(filename,txt);
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); } }catch(e){}
  if(ok){
    var res=window.__segaLastSaveResult||('Downloads/AtariHelp/'+filename);
    log('SEGA LOG DOWNLOAD BUILD2MY: ulozeno bez zobrazeni pres monitor overlay -> '+res);
    toast('LOG ulozen: '+filename,4200);
  } else {
    toast('LOG zobrazen v monitoru, automaticke ulozeni selhalo.',4200);
  }
  return ok;
}
function showSegaLog(showOnScreen){
  var txt=buildLogText();
  var ok=saveLogToDownloads(txt);
  if(showOnScreen || !ok){
    showMonitor(ok ? ('LOG ULOZEN DO DOWNLOADS/ATARIHELP\n\nDLOUHY LOG JE V TXT SOUBORU.\nTENTO NAHLED JE JEN SERVISNI, NE HRA.') : txt);
  }else{
    hideMonitor();
  }
}
