function applyEuCompatibilityPatches(name,buf){
  var u8=new Uint8Array(buf), notes=[], codePatched=false;
  try{
    var title=(readAsciiFromRom(u8,0x120,48)+' '+readAsciiFromRom(u8,0x150,48)).toUpperCase();
    var region=readAsciiFromRom(u8,0x1f0,16).trim().toUpperCase();
    var nm=String(name||'').toUpperCase();
    var looksEu=(region.indexOf('E')>=0||nm.indexOf('EUROPE')>=0||nm.indexOf('(E)')>=0||nm.indexOf('PAL')>=0);
    if(!looksEu){lastEuPatchStatus='NO_PATCH nonEU region='+region;pushLog('BUILD2QL EU_COMPAT_SKIP nonEU name='+name+' headerRegion='+region);return {buffer:buf,patched:false,summary:lastEuPatchStatus};}
    if(u8.length>=0x200){
      writeAsciiToRom(u8,0x1f0,'U',16);
      notes.push('HEADER_REGION_E_TO_U_0x1F0');
    }
    if(title.indexOf('ALADDIN')>=0||nm.indexOf('ALADDIN')>=0){
      notes.push('ALADDIN_HEADER_COMPAT_ONLY');
    }

    // Generic PAL/EU lock patch:
    // many Mega Drive games read $A10001, mask bits $C0 and compare with $C0 (export PAL).
    // The remote ClownMDEmu path behaves like NTSC/US ($80), so for EU test ROM copies we change cmp #$C0 -> cmp #$80.
    // This is still only an in-memory copy patch; the original ROM file is not changed.
    var genericPat=[0x10,0x39,0x00,0xa1,0x00,0x01,0x02,0x00,0x00,0xc0,0x0c,0x00,0x00,0xc0];
    var genericCount=0, searchFrom=0, genericFirst=-1;
    while(searchFrom<u8.length){
      var pos=findBytes(u8.subarray(searchFrom),genericPat);
      if(pos<0)break;
      pos+=searchFrom;
      if(u8[pos+13]===0xc0){
        u8[pos+13]=0x80;
        codePatched=true;
        genericCount++;
        if(genericFirst<0)genericFirst=pos+13;
      }
      searchFrom=pos+genericPat.length;
    }
    if(genericCount>0){
      var tag='GENERIC_REGION_CMP_C0_TO_80_COUNT_'+genericCount+'_FIRST_0x'+genericFirst.toString(16).toUpperCase();
      if(title.indexOf('ASTERIX')>=0||nm.indexOf('ASTERIX')>=0)tag='ASTERIX_'+tag;
      if(title.indexOf('PROBOTECTOR')>=0||nm.indexOf('PROBOTECTOR')>=0||title.indexOf('CONTRA')>=0||nm.indexOf('CONTRA')>=0)tag='PROBOTECTOR_'+tag;
      if(title.indexOf('AYRTON')>=0||nm.indexOf('AYRTON')>=0||title.indexOf('SENNA')>=0||nm.indexOf('SENNA')>=0)tag='AYRTON_'+tag;
      notes.push(tag);
    }else{
      if(title.indexOf('ASTERIX')>=0||nm.indexOf('ASTERIX')>=0)notes.push('ASTERIX_GENERIC_PATTERN_NOT_FOUND');
      if(title.indexOf('PROBOTECTOR')>=0||nm.indexOf('PROBOTECTOR')>=0||title.indexOf('CONTRA')>=0||nm.indexOf('CONTRA')>=0)notes.push('PROBOTECTOR_GENERIC_PATTERN_NOT_FOUND');
    }

    // Ayrton Senna's Super Monaco GP II (Japan/Europe) uses the opposite lock:
    // it reads $A10001, masks $C0, then blocks if the machine looks like USA ($80).
    // The remote ClownMDEmu path exposes USA-style bits, so the in-memory copy changes cmp #$80 -> cmp #$C0.
    // This keeps the original ROM file untouched and only lets the test copy pass the region guard.
    if(title.indexOf('AYRTON')>=0||nm.indexOf('AYRTON')>=0||title.indexOf('SENNA')>=0||nm.indexOf('SENNA')>=0){
      var ayrtonPat=[0x10,0x39,0x00,0xa1,0x00,0x01,0x02,0x00,0x00,0xc0,0x0c,0x00,0x00,0x80];
      var ayrtonCount=0, ayrtonFirst=-1, ayrtonSearchFrom=0;
      while(ayrtonSearchFrom<u8.length){
        var ap=findBytes(u8.subarray(ayrtonSearchFrom),ayrtonPat);
        if(ap<0)break;
        ap+=ayrtonSearchFrom;
        if(u8[ap+13]===0x80){
          u8[ap+13]=0xc0;
          codePatched=true;
          ayrtonCount++;
          if(ayrtonFirst<0)ayrtonFirst=ap+13;
        }
        ayrtonSearchFrom=ap+ayrtonPat.length;
      }
      if(ayrtonCount>0){
        notes.push('AYRTON_REGION_CMP_80_TO_C0_COUNT_'+ayrtonCount+'_FIRST_0x'+ayrtonFirst.toString(16).toUpperCase());
      }else{
        notes.push('AYRTON_REGION_CMP_80_TO_C0_NOT_FOUND');
      }
    }

    var checksum=-1;
    if(codePatched){checksum=updateGenesisChecksum(u8);notes.push('CHECKSUM_0x'+(('0000'+(checksum&0xffff).toString(16).toUpperCase()).slice(-4)));}
    lastEuPatchStatus=notes.length?notes.join(' | '):'NO_MATCHED_PATCH';
    pushLog('BUILD2QL EU_COMPAT_APPLIED name='+name+' headerRegion='+region+' title='+title.trim()+' notes='+lastEuPatchStatus);
    return {buffer:u8.buffer,patched:notes.length>0,summary:lastEuPatchStatus};
  }catch(e){lastEuPatchStatus='PATCH_ERROR '+(e.message||e);pushLog('BUILD2QL EU_COMPAT_ERROR '+lastEuPatchStatus);return {buffer:buf,patched:false,summary:lastEuPatchStatus};}
}
