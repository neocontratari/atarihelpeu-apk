function $(id){return document.getElementById(id);}
function pushLog(t){var line=new Date().toLocaleTimeString()+' '+t;logLines.push(line);if(logLines.length>220)logLines.shift();try{console.log('[NAP SEGA NL] '+t);}catch(e){}return line;}
function toast(t,ms){var el=$('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(window.__segaToastTimer);window.__segaToastTimer=setTimeout(function(){el.classList.remove('show');},ms||2600);}
function showMonitor(t){var ov=$('monitorOverlay'),tx=$('monitorText');if(tx)tx.textContent=t;if(ov)ov.classList.add('show');}
function hideMonitor(){var ov=$('monitorOverlay');if(ov)ov.classList.remove('show');}
function drawStatus(title,sub){try{var c=$('mdVideo'),ctx=c.getContext('2d',{alpha:false})||c.getContext('2d');ctx.fillStyle='#020611';ctx.fillRect(0,0,320,224);for(var y=0;y<224;y+=7){ctx.fillStyle='rgba(60,150,255,.12)';ctx.fillRect(22,y,276,1);}ctx.strokeStyle='rgba(90,185,255,.55)';ctx.lineWidth=2;ctx.strokeRect(24,24,272,176);ctx.textAlign='center';ctx.fillStyle='#bfe9ff';ctx.font='bold 15px monospace';ctx.fillText(title||'CLOWNMD LOCAL READY',160,72);ctx.fillStyle='#d9f4ff';ctx.font='bold 11px monospace';(sub||'HRY/SBIRKA/CARTRIDGE = VYBER ROM').split('\n').forEach(function(line,i){ctx.fillText(line,160,104+i*17);});}catch(e){}}

function dbOpen(){return new Promise(function(resolve,reject){try{var req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=function(){try{req.result.createObjectStore(DB_STORE);}catch(_){}};req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error||new Error('indexedDB open fail'));};}catch(e){reject(e);}});}
function dbPut(key,val){return dbOpen().then(function(db){return new Promise(function(resolve,reject){try{var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(val,key);tx.oncomplete=function(){try{db.close();}catch(_){} resolve();};tx.onerror=function(){try{db.close();}catch(_){} reject(tx.error||new Error('indexedDB put fail'));};}catch(e){try{db.close();}catch(_){} reject(e);}});});}
function dbGet(key){return dbOpen().then(function(db){return new Promise(function(resolve,reject){try{var tx=db.transaction(DB_STORE,'readonly');var req=tx.objectStore(DB_STORE).get(key);req.onsuccess=function(){resolve(req.result||null);};req.onerror=function(){reject(req.error||new Error('indexedDB get fail'));};tx.oncomplete=function(){try{db.close();}catch(_){}};}catch(e){try{db.close();}catch(_){} reject(e);}});});}
function dbDel(key){return dbOpen().then(function(db){return new Promise(function(resolve,reject){try{var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(key);tx.oncomplete=function(){try{db.close();}catch(_){} resolve();};tx.onerror=function(){try{db.close();}catch(_){} reject(tx.error||new Error('indexedDB del fail'));};}catch(e){try{db.close();}catch(_){} reject(e);}});});}
function arrayBufferToBase64(buf){var bytes=new Uint8Array(buf),chunk=0x8000,parts=[];for(var i=0;i<bytes.length;i+=chunk){parts.push(String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)));}return btoa(parts.join(''));}
function base64ToArrayBuffer(b64){var bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(var i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer;}
function storeHardBootRom(name,buf,reason){var rec={name:name||'cartridge.gen',size:buf.byteLength||0,time:Date.now(),reason:reason||'unknown',buffer:buf};return dbPut('rom',rec).then(function(){pushLog('BUILD2NS HARDBOOT_STORE indexedDB OK name='+rec.name+' bytes='+rec.size+' reason='+rec.reason);return 'indexedDB';}).catch(function(e){pushLog('BUILD2NS HARDBOOT_STORE indexedDB FAILED '+(e.message||e)+' - zkousim sessionStorage');try{sessionStorage.setItem('napSegaHardBootRom',JSON.stringify({name:rec.name,size:rec.size,time:rec.time,reason:rec.reason,b64:arrayBufferToBase64(buf)}));pushLog('BUILD2NS HARDBOOT_STORE sessionStorage OK name='+rec.name+' bytes='+rec.size);return 'sessionStorage';}catch(e2){pushLog('BUILD2NS HARDBOOT_STORE FAILED '+(e2.message||e2));throw e2;}});}
function loadHardBootRom(){return dbGet('rom').then(function(rec){if(rec&&rec.buffer){pushLog('BUILD2NS HARDBOOT_LOAD indexedDB OK name='+rec.name+' bytes='+rec.size+' reason='+rec.reason);return dbDel('rom').then(function(){return rec;}).catch(function(){return rec;});}try{var txt=sessionStorage.getItem('napSegaHardBootRom');if(txt){sessionStorage.removeItem('napSegaHardBootRom');var r=JSON.parse(txt);r.buffer=base64ToArrayBuffer(r.b64);delete r.b64;pushLog('BUILD2NS HARDBOOT_LOAD sessionStorage OK name='+r.name+' bytes='+r.size);return r;}}catch(e){pushLog('BUILD2NS HARDBOOT_LOAD sessionStorage FAIL '+(e.message||e));}return null;}).catch(function(e){pushLog('BUILD2NS HARDBOOT_LOAD FAIL '+(e.message||e));return null;});}
function powerOffWrapperBeforeNavigation(reason){
  var fr=$('clownFrame'), w=$('clownFrameWrap');
  pushLog('BUILD2NS POWER_OFF_WRAPPER_BEGIN reason='+reason);
  try{Object.keys(padButtons).forEach(function(k){padButtons[k]=false;});postPad();}catch(_){}

  try{if(fr&&fr.contentWindow&&typeof fr.contentWindow.stop==='function'){fr.contentWindow.stop();pushLog('BUILD2NS POWER_OFF_FRAME_WINDOW_STOP OK');}}catch(e2){pushLog('BUILD2NS POWER_OFF_FRAME_STOP_FAIL '+(e2.message||e2));}
  try{if(fr){fr.onload=null;fr.src='about:blank';}}catch(e3){pushLog('BUILD2NS POWER_OFF_ABOUTBLANK_FAIL '+(e3.message||e3));}
  try{if(w){w.classList.remove('booting','menuMode','playMode');w.style.display='none';}}catch(_){}
  frameLoaded=false;
  lastBootStatus='TWO_PHASE_POWER_OFF '+reason;
}
function pagePowerReload(reason){
  pushLog('BUILD2NS TWO_PHASE_POWER_NAV reason='+reason);
  powerOffWrapperBeforeNavigation(reason);
  var url='sega_poweroff.html?return=index.html&stamp='+Date.now()+'&reason='+encodeURIComponent(reason||'unknown');

function hardPowerBootBuffer(name,buf,reason){lastBootStatus='HARD_POWER_STORE '+reason;drawStatus('SEGA POWER OFF','VYPINAM CLOWNMD CORE / UKLADAM CARTRIDGE\n'+(name||''));toast('SEGA POWER OFF/ON: ciste vypnuti core',2400);storeHardBootRom(name,buf,reason).then(function(mode){pushLog('BUILD2NS HARD_POWER_BOOT mode='+mode+' name='+name+' reason='+reason);setTimeout(function(){pagePowerReload(reason);},180);}).catch(function(e){lastBootStatus='HARD_POWER_STORE_FAILED '+(e.message||e);showMonitor('HARD POWER STORE FAILED\n'+lastBootStatus);});}
function tryAutoBootAfterPowerCycle(){if(bootAutoloadStarted)return;bootAutoloadStarted=true;loadHardBootRom().then(function(rec){if(!rec||!rec.buffer){pushLog('BUILD2NS HARDBOOT no pending ROM');return;}selectedRomName=rec.name||'cartridge.gen';selectedRomSize=rec.size||rec.buffer.byteLength||0;selectedRomBuffer=rec.buffer;pushLog('BUILD2NS HARDBOOT AUTOBOOT name='+selectedRomName+' bytes='+selectedRomSize+' reason='+(rec.reason||''));drawStatus('POWER CYCLE OK','BOOTUJI '+selectedRomName);toast('POWER ON: '+selectedRomName,1600);setTimeout(function(){openLocalWrapper('hardboot:'+selectedRomName,'play');},420);});}
function setFrameMode(mode,reason){var w=$('clownFrameWrap');if(!w)return;w.classList.remove('menuMode','playMode','booting');w.classList.add(mode==='menu'?'menuMode':'playMode');pushLog('BUILD2NS FRAME MODE '+mode+' reason='+reason);}

function postRomToWrapper(){var fr=$('clownFrame');if(!fr||!fr.contentWindow||!selectedRomBuffer){pushLog('BUILD2NS POST_ROM skipped frame/buffer missing');return;}try{var copy=selectedRomBuffer.slice(0);fr.contentWindow.postMessage({type:'nap-rom',build:BUILD,name:selectedRomName,buffer:copy},'*',[copy]);lastBootStatus='ROM_POSTED_TO_LOCAL_WRAPPER '+selectedRomName+' bytes='+selectedRomSize;pushLog('BUILD2NS ROM_POST_TO_LOCAL_WRAPPER name='+selectedRomName+' size='+selectedRomSize);toast('ROM poslana do lokalniho ClownMDEmu wrapperu',2600);}catch(e){lastBootStatus='ROM_POST_FAILED '+(e.message||String(e));pushLog('BUILD2NS ROM_POST FAILED '+lastBootStatus);showMonitor('ROM POST FAILED\n'+lastBootStatus);}}
function stopWrapper(reason){var w=$('clownFrameWrap'),fr=$('clownFrame');pushLog('BUILD2NS STOP_WRAPPER local cleanup reason='+reason);try{if(fr){fr.onload=null;fr.src='about:blank';fr.remove();}}catch(_){} if(w){w.style.display='none';w.classList.remove('booting','menuMode','playMode');}frameLoaded=false;lastBootStatus='WRAPPER_STOPPED_LOCAL '+reason;drawStatus('CARTRIDGE EJECTED','HRY/SBIRKA/CARTRIDGE = VYBER ROM');}
function resetCurrent(reason){if(!selectedRomBuffer){pushLog('BUILD2NS HARD RESET ignored no ROM reason='+reason);toast('RESET: neni vlozena ROM',2200);return;}pushLog('BUILD2NS HARD POWER RESET current ROM '+selectedRomName+' reason='+reason);hardPowerBootBuffer(selectedRomName,selectedRomBuffer,'reset:'+reason);}
function ejectCurrent(reason){selectedRomBuffer=null;selectedRomName='zadna';selectedRomSize=0;lastKeyStatus='NO_KEY';stopWrapper('eject:'+reason);toast('CARTRIDGE vytazena',2200);}

function onRomSelected(f){if(!f){pushLog('BUILD2NS ROM SELECT cancelled');return;}selectedRomName=f.name||'unknown.rom';selectedRomSize=f.size||0;lastBootStatus='READING_ROM_FOR_HARD_POWER';pushLog('BUILD2NS ROM SELECTED name='+selectedRomName+' size='+selectedRomSize+' type='+(f.type||''));toast('ROM vybrana: '+selectedRomName+' - delam power-cycle',1800);var r=new FileReader();r.onerror=function(){lastBootStatus='FILE_READ_ERROR';pushLog('BUILD2NS FILE_READ_ERROR '+selectedRomName);showMonitor('FILE READ ERROR\n'+selectedRomName);};r.onload=function(){selectedRomBuffer=r.result;pushLog('BUILD2NS ROM READ OK name='+selectedRomName+' bytes='+selectedRomBuffer.byteLength);hardPowerBootBuffer(selectedRomName,selectedRomBuffer,'romSelected');};r.readAsArrayBuffer(f);}
function keyDefs(btn){return {UP:[['ArrowUp','ArrowUp',38]],DOWN:[['ArrowDown','ArrowDown',40]],LEFT:[['ArrowLeft','ArrowLeft',37]],RIGHT:[['ArrowRight','ArrowRight',39]],A:[['z','KeyZ',90],['Z','KeyZ',90]],B:[['x','KeyX',88],['X','KeyX',88]],C:[['c','KeyC',67],['C','KeyC',67]],START:[['Enter','Enter',13]]}[btn]||null;}
function postPad(){var fr=$('clownFrame');try{fr&&fr.contentWindow&&fr.contentWindow.postMessage({type:'nap-input-state',buttons:JSON.parse(JSON.stringify(padButtons))},'*');}catch(e){}}

var holdTimers={};function releaseButtonDelayed(btn,delay){clearTimeout(holdTimers[btn]);holdTimers[btn]=setTimeout(function(){sendToWrapper(btn,false);},delay||120);}
function bindKeyButton(id,btn){var el=$(id);if(!el)return;el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId);}catch(_){}focusFrame();clearTimeout(holdTimers[btn]);sendToWrapper(btn,true);if(btn==='A'||btn==='B'||btn==='C'){setTimeout(function(){if(padButtons[btn])sendToWrapper(btn,true);},55);}},true);el.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();releaseButtonDelayed(btn,(btn==='A'||btn==='B'||btn==='C')?150:95);},true);el.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();releaseButtonDelayed(btn,60);},true);el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
function dpadDirectionFromEvent(e){var b=$('dpad');if(!b)return null;var r=b.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)-.5;var y=(e.clientY-r.top)/Math.max(1,r.height)-.5;if(Math.abs(x)<.10&&Math.abs(y)<.10)return null;return Math.abs(x)>Math.abs(y)?(x<0?'LEFT':'RIGHT'):(y<0?'UP':'DOWN');}
function setDpadDir(dir){if(activeDpadDir===dir)return;if(activeDpadDir)sendToWrapper(activeDpadDir,false);activeDpadDir=dir;if(activeDpadDir)sendToWrapper(activeDpadDir,true);}
function buildLogText(){return 'SEGA LOG / BUILD2NS\nAtariHelp.eu EMU-10 '+BUILD+'\n\nSTAV:\n- ClownMDEmu se uz neotevira s obri DATA URL v adrese\n- HRY/SBIRKA/CARTRIDGE otevre NAS ROM picker\n- ROM se posle do lokalniho wrapperu clown_local_boot.html jako ArrayBuffer\n- wrapper vytvori Blob URL uvnitr sveho okna a spusti oficialni ClownMDEmu JS s Module.arguments=[blobURL]\n- cil: ClownMDEmu nacita NAS cartridge bez rucniho Software menu\n- A/B/C/START/DPAD posilaji postMessage do wrapperu, kde se generuji lokalni klavesy + virtual gamepad\n- audio neni rollback build: cisty zaklad 2NN + visible canvas fix + cleanup AudioContext\n- monitorovy vyrez z BUILD2NR zachovan; fixuje se cerna obrazovka ve wrapperu\n- portrait/landscape hitboxy zachovany\n- zadny fake gameplay, ROM neni v APK ani v ZIPu\n- vybrana ROM: '+selectedRomName+' size='+selectedRomSize+'\n- frameLoaded: '+frameLoaded+'\n- boot status: '+lastBootStatus+'\n- key status: '+lastKeyStatus+'\n- image tune: '+imageTuneStatus+'\n- audio tune: '+audioTuneStatus+'\n\nPOSLEDNI UDALOSTI:\n'+(logLines.length?logLines.slice(-90).join('\n'):'zadne');}
function pad2(n){return ('0'+n).slice(-2);}function logFileName(){var d=new Date();return 'AtariHelp_SEGA_LOG_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.txt';}
function saveLog(){var txt=buildLogText(),fn=logFileName(),ok=false;try{if(window.AHSAVE&&typeof window.AHSAVE.save==='function'){window.AHSAVE.save(fn,txt);ok=true;}}catch(e){pushLog('AHSAVE.save failed '+e.message);}if(!ok){try{var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1200);ok=true;}catch(e2){showMonitor(txt);}}pushLog('BUILD2NS LOG SAVE '+(ok?'OK ':'FAILED ')+fn);toast(ok?'LOG ulozen: '+fn:'LOG zobrazen v monitoru',3200);}
window.addEventListener('message',function(ev){var d=ev.data||{};if(!d||!d.type)return;if(d.type==='nap-wrapper-log'){pushLog('WRAPPER '+d.msg);if(/BOOT_FAIL|RUNTIME_ERROR|SCRIPT_ERROR|WASM|FETCH/.test(d.msg||'')){lastBootStatus='WRAPPER_'+d.msg;}if(/MAIN_STARTED|MODULE_POSTRUN|CANVAS_READY|BOOTING_ROM/.test(d.msg||'')){lastBootStatus=d.msg;}}},false);
['btnCollection','btnGames','cartSlot','cartCenter'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();requestRom(id);},true);});
var resetBtn=$('btnReset');if(resetBtn){resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetCurrent('btnReset');},true);resetBtn.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();resetCurrent('btnResetLongAsReset');},true);}
var romInput=$('romInput');if(romInput)romInput.addEventListener('change',function(e){var f=e.target&&e.target.files&&e.target.files[0];onRomSelected(f);},true);
var con=$('btnConsole');if(con)con.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(frameLoaded){setFrameMode('menu','console');toast('KONZOLE: cely wrapper/menu rezim',2200);}else{openLocalWrapper('consoleNoRom','menu');}},true);
var joy=$('btnJoystick');if(joy)joy.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(frameLoaded){setFrameMode('play','joystick');focusFrame();toast('JOYSTICK: herni vyrez + focus',2200);}else toast('Nejdriv vyber ROM pres HRY/SBIRKA/CARTRIDGE',2600);},true);
bindKeyButton('btnA','A');bindKeyButton('btnB','B');bindKeyButton('btnC','C');bindKeyButton('btnStart','START');
var dpad=$('dpad');if(dpad){dpad.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();try{dpad.setPointerCapture(e.pointerId);}catch(_){}setDpadDir(dpadDirectionFromEvent(e));},true);dpad.addEventListener('pointermove',function(e){if(e.buttons){e.preventDefault();e.stopPropagation();setDpadDir(dpadDirectionFromEvent(e));}},true);dpad.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('pointercancel',function(e){e.preventDefault();e.stopPropagation();setDpadDir(null);},true);dpad.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();},true);}
var saves=$('btnSaves');if(saves)saves.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();saveLog();},true);
var man=$('btnManuals');if(man)man.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showMonitor('BUILD2NS\n\nHRY/SBIRKA/CARTRIDGE:\n- vyberes ROM v nasi appce\n- ROM se neposila jako DATA URL do adresy\n- posle se do lokalniho wrapperu jako ArrayBuffer\n- wrapper vytvori Blob URL a spusti ClownMDEmu s Module.arguments\n\nRESET vpravo u cartridge dela dvoufazovy POWER OFF/ON cele SEGA stranky. CARTRIDGE SLOT / vlozena cartridge otevre picker pro novou hru a taky se provede power-cycle, aby nezustal bezet stary ClownMDEmu runtime. DPAD neposila zadny skok, A/B/C zustavaji akcni tlacitka. BUILD2NS zachova cisty zvuk z 2NN a monitor z 2NR, ale vypina zrcadleny video-delay canvas, ktery zpusobil cernou obrazovku. Pouziva primy visible ClownMDEmu canvas.');},true);
var web=$('btnWeb');if(web)web.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();try{location.href='https://atarihelp.eu/';}catch(_){}},true);
window.addEventListener('orientationchange',function(){pushLog('BUILD2NS ORIENTATION CHANGE '+(screen.orientation&&screen.orientation.type||'unknown'));setTimeout(function(){if(frameLoaded)setFrameMode('play','orientationchange');},400);});
drawStatus('LOCAL CLOWNMD READY','HRY/SBIRKA/CARTRIDGE = VYBER ROM');pushLog('AtariHelp.eu EMU-10 '+BUILD+' pripraven - TWO PHASE POWER reset zachovan, cisty audio 2NN + primy visible canvas bez cerne obrazovky.');tryAutoBootAfterPowerCycle();toast('BUILD2NS: zvuk 2NN + primy obraz bez cerneni.',5200);
})();
</script>
