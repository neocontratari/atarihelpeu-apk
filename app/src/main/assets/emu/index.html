.main-menu{background:linear-gradient(#101318,#090a0c);border-top:1px solid #262b34;padding:12px 14px 14px;}.main-menu h3{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:10px;}.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}.menu-card{min-height:88px;border-radius:10px;border:1px solid #7e5c20;background:linear-gradient(#1c2026,#0c0d0f);color:var(--gold);box-shadow:inset 0 0 14px #000,0 0 0 2px rgba(240,198,106,.05);font-weight:bold;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;}.menu-card small{display:block;color:#d9d0bd;font-size:11px;font-weight:bold;}.menu-card svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.8}.menu-card.on{background:linear-gradient(#332410,#17100a);}

'use strict';
function CPU6502(read, write){
  const c={a:0,x:0,y:0,sp:0xFF,pc:0,nf:0,vf:0,df:0,if_:1,zf:0,cf:0,

  const rd=read, wr=write;

  function adc(v){
    if(!c.df){ const t=c.a+v+c.cf;
      c.vf=(~(c.a^v)&(c.a^t)&0x80)?1:0; c.cf=t>0xFF?1:0; c.a=t&0xFF; nz(c.a);
    } else { // NMOS decimal ADC
      let lo=(c.a&0x0F)+(v&0x0F)+c.cf;
      let hi=(c.a>>4)+(v>>4);
      c.zf=((c.a+v+c.cf)&0xFF)===0?1:0;

      c.vf=(~(c.a^v)&(c.a^(hi<<4))&0x80)?1:0;
      if(hi>9) hi+=6;
      c.cf=hi>15?1:0;
      c.a=((hi<<4)|(lo&0x0F))&0xFF;
    }
  }
  function sbc(v){
    if(!c.df){ adc(v^0xFF); }
    else { // NMOS decimal SBC: flags from binary, result decimal
      const bt=c.a-v-(1-c.cf);
      let lo=(c.a&0x0F)-(v&0x0F)-(1-c.cf);
      let hi=(c.a>>4)-(v>>4);

          }
        }
        // GTIA reproduktor (klik klaves XL OS pres CONSOL bit3)
        if(st.spkDecay>0){ st.spkDecay--; s+=st.spkLevel*0.25; }
        var dcout=s-st.dcx+0.995*st.dcy; st.dcx=s; st.dcy=dcout;   // DC-blocker
        buf[i]=dcout;
      }
    };
    sp.connect(ac.destination);
    audio={ac:ac,sp:sp,st:st,sh:sh};
    if(M) M.onSpeaker=function(level){ st.spkLevel=level?1:-1; st.spkDecay=(ac.sampleRate*0.004)|0; };
    log('AUDIO: POKEY WebAudio bezi ('+ac.sampleRate+' Hz)');
  }

  // ---------- klavesnice: XL/XE scan kody ----------
  // zakladni kody (bez shift/ctrl); +0x40 shift, +0x80 ctrl
  var KEY={ 'l':0,'j':1,';':2,'k':5,'+':6,'*':7,'o':8,'p':10,'u':11,'i':13,'-':14,'=':15,
    'v':16,'c':18,'b':21,'x':22,'z':23,'4':24,'3':26,'6':27,'5':29,'2':30,'1':31,
    ',':32,' ':33,'.':34,'n':35,'m':37,'/':38,'r':40,'e':42,'y':43,'t':45,'w':46,'q':47,
    '9':48,'0':50,'7':51,'8':53,'f':56,'h':57,'d':58,'g':61,'s':62,'a':63,'<':54,'>':55 };
  var SHIFTED={'!':'1','"':'2','#':'3','$':'4','%':'5','&':'6',"'":'7','@':'8','(':'9',')':'0',
    ':':';','?':'/','^':'*','_':'-','|':'=','\\':'+','[':',',']':'.'};
  function charToScan(chr){
    if(KEY[chr]!==undefined) return KEY[chr];
    var lo=chr.toLowerCase();
    if(chr!==lo && KEY[lo]!==undefined) return KEY[lo]|0x40;       // velke pismeno
    if(SHIFTED[chr]!==undefined) return KEY[SHIFTED[chr]]|0x40;    // shift symbol
    return undefined;
  }
  var CODE={ 'Enter':12,'NumpadEnter':12,'Backspace':52,'Escape':28,'Tab':44,'CapsLock':60,
    'ArrowUp':14|0x80,'ArrowDown':15|0x80,'ArrowLeft':6|0x80,'ArrowRight':7|0x80,
    'F1':17 /*HELP*/,'Backquote':39 /*INVERZE (Atari logo)*/ };
  function bindKeyboard(){
    window.addEventListener('keydown',function(e){
      if(!M) return;
      if(e.code==='F2'){ consolSet('option',true); e.preventDefault(); return; }
      if(e.code==='F3'){ consolSet('select',true); e.preventDefault(); return; }
      if(e.code==='F4'){ consolSet('start',true); e.preventDefault(); return; }
      if(e.code==='F5'){ doReset(); e.preventDefault(); return; }
      if(e.code==='F6'){ M.breakKey(); log('KEY BREAK'); e.preventDefault(); return; }
      if(joyMode){
        var jm={'ArrowUp':1,'ArrowDown':2,'ArrowLeft':4,'ArrowRight':8}[e.code];
        if(jm){ joySet(joyMask|jm); e.preventDefault(); return; }
        if(e.code==='Space'){ joyFire=true; joyApply(); e.preventDefault(); return; }
      }
      var sc=CODE[e.code];
      if(sc===undefined && e.key && e.key.length===1) sc=charToScan(e.key);
      if(sc===undefined) return;
      if(e.ctrlKey) sc|=0x80;
      M.keyDown(sc&0xFF);
      e.preventDefault();
    });
    window.addEventListener('keyup',function(e){
      if(joyMode){
        var jm={'ArrowUp':1,'ArrowDown':2,'ArrowLeft':4,'ArrowRight':8}[e.code];
        if(jm){ joySet(joyMask&~jm); return; }
        if(e.code==='Space'){ joyFire=false; joyApply(); return; }
      }
      if(M) M.keyUp();
    });
  }

  // ---------- on-screen XE klavesnice ----------
  var ROWS=[
    [['Esc',28],['!\n1',31],['"\n2',30],['#\n3',26],['$\n4',24],['%\n5',29],['&\n6',27],["'\n7",51],['@\n8',53],['(\n9',48],[')\n0',50],['Clear\n<',54],['Insert\n>',55],['Delete\nBk Sp',52],['Break',-3]],
    [['Clr/Set\nTab',44],['Q',47],['W',46],['E',42],['R',40],['T',45],['Y',43],['U',11],['I',13],['O',8],['P',10],['↑\n-',14],['↓\n=',15],['Return',12]],
    [['Control',-1],['A',63],['S',62],['D',58],['F',56],['G',61],['H',57],['J',1],['K',5],['L',0],[':\n;',2],['←\n+',6],['→\n*',7],['Caps',60]],
    [['Shift',-2],['Z',23],['X',22],['C',18],['V',16],['B',21],['N',35],['M',37],['[\n,',32],[']\n.',34],['?\n/',38],['Shift',-2],['Fuji\nInverse',39]],
    [['',-99],['Space',33],['',-99]]
  ];
  var oskShift=false, oskCtrl=false;
  function buildOSK(host){
    ROWS.forEach(function(row){
      var r=document.createElement('div'); r.className='krow';
      row.forEach(function(k){
        if(k[1]===-99){ var sp=document.createElement('div'); r.appendChild(sp); return; }
        var b=document.createElement('button'); b.className='key'; b.textContent=k[0];
        if(k[0]==='MEZERNIK') b.classList.add('space');
        if(k[1]<0) b.classList.add('mod');
        var press=function(ev){ ev.preventDefault();
          if(k[1]===-1){ oskCtrl=!oskCtrl; b.classList.toggle('on',oskCtrl); return; }
          if(k[1]===-2){ oskShift=!oskShift; b.classList.toggle('on',oskShift); return; }
          if(k[1]===-3){ M&&M.breakKey(); log('KEY BREAK'); return; }
          var sc=k[1]; if(oskShift) sc|=0x40; if(oskCtrl) sc|=0x80;
          M&&M.keyDown(sc&0xFF);
        };
        var rel=function(ev){ ev.preventDefault(); if(k[1]>=0){ M&&M.keyUp(); } };
        b.addEventListener('pointerdown',press); b.addEventListener('pointerup',rel); b.addEventListener('pointerleave',rel);
        r.appendChild(b);
      });
      host.appendChild(r);
    });
  }

  // ---------- joystick (kruhovy pad + FIRE) ----------
  var joyMode=false, joyMask=0, joyFire=false;
  function joyApply(){ if(M) M.setJoy(joyMask,joyFire); }
  function joySet(mask){ if(mask!==joyMask){ joyMask=mask; joyApply(); } }
  function setJoyMode(on){
    joyMode=on;
    document.body.classList.toggle('joy-active', !!on);
    document.getElementById('osk').style.display=on?'none':'';
    document.getElementById('joy').style.display=on?'flex':'none';
    var b=document.getElementById('btnJoy');
    if(b){ b.classList.toggle('on', !!on); b.setAttribute('aria-pressed', on?'true':'false'); }
    joySet(0); joyFire=false; joyApply();
  }
  function bindJoy(){
    var pad=document.getElementById('joyPad'), knob=document.getElementById('joyKnob');
    var fire=document.getElementById('joyFire'), pid=null;
    function fromEvent(e){
      var r=pad.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      var dx=e.clientX-cx, dy=e.clientY-cy, rad=r.width/2;
      var len=Math.sqrt(dx*dx+dy*dy), dead=rad*0.22;
      var kx=dx, ky=dy, max=rad*0.62;
      if(len>max){ kx=dx/len*max; ky=dy/len*max; }
      knob.style.transform='translate('+kx+'px,'+ky+'px)';
      if(len<dead){ joySet(0); return; }
      var a=Math.atan2(dy,dx), m=0;            // 8 smeru po 45 stupnich
      var oct=Math.round(a/(Math.PI/4));
      if(oct===0) m=8;            // vpravo
      else if(oct===1) m=8|2;     // vpravo dolu
      else if(oct===2) m=2;       // dolu
      else if(oct===3) m=4|2;     // vlevo dolu
      else if(oct===4||oct===-4) m=4;  // vlevo
      else if(oct===-3) m=4|1;    // vlevo nahoru
      else if(oct===-2) m=1;      // nahoru
      else if(oct===-1) m=8|1;    // vpravo nahoru
      joySet(m);
    }
    pad.addEventListener('pointerdown',function(e){ e.preventDefault(); pid=e.pointerId; pad.setPointerCapture(pid); fromEvent(e); });
    pad.addEventListener('pointermove',function(e){ if(pid===e.pointerId) fromEvent(e); });
    function padUp(e){ if(pid===e.pointerId){ pid=null; joySet(0); knob.style.transform=''; } }
    pad.addEventListener('pointerup',padUp); pad.addEventListener('pointercancel',padUp);
    fire.addEventListener('pointerdown',function(e){ e.preventDefault(); joyFire=true; joyApply(); fire.classList.add('on'); });
    var fOff=function(){ joyFire=false; joyApply(); fire.classList.remove('on'); };
    fire.addEventListener('pointerup',fOff); fire.addEventListener('pointercancel',fOff); fire.addEventListener('pointerleave',fOff);
  }

  // ---------- vkladani TXT (typing queue pres scan kody) ----------
  var typeQ=[], typeWait=0;
  function queueText(text){
    var skipped=0;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(ch==='\r') continue;
      if(ch==='\n'){ typeQ.push(12|0x100); continue; }                // RETURN (priznak: pockat na radek)
      if(ch==='\x01'){ typeQ.push(12|0x300); continue; }              // RETURN + dlouha pauza (po NEW)
      var sc;
      if(/[a-zA-Z]/.test(ch)) sc=KEY[ch.toLowerCase()];                // caps po bootu pise velka
      else sc=charToScan(ch);
      if(sc===undefined){ skipped++; continue; }
      typeQ.push(sc);
    }
    log('VLOZIT TXT: '+typeQ.length+' znaku pres OS buffer CH'+(skipped?(', preskoceno '+skipped+' neznamych'):''));
  }
  function typeStep(){ // vola se 2x za frame; pise pres CH ($02FC) = stejna cesta jako klavesove IRQ
    if(!M){ typeQ.length=0; return; }
    if(typeWait>0){ typeWait--; return; }
    if(!typeQ.length) return;
    var it=typeQ[0];
    if(!M.stuffKey(it&0xFF)) return;                                   // OS jeste neprecetl minuly znak
    typeQ.shift();
    if(it&0x200) typeWait=25;                                          // po NEW: pockej, az ho BASIC opravdu provede
    else if(it&0x100) typeWait=6;                                      // po RETURN kratka rezerva; CH-plny se skrti sam
    if(!typeQ.length) log('VLOZIT TXT: hotovo.');
  }

  // ---------- celociselne skalovani (zadne carecky) ----------
  function fitScreen(){
    if(!canvas) return;
    var bez=canvas.parentElement, avail=bez.clientWidth-0;
    if(avail<=0) return;
    if(avail>=384){ var s=Math.floor(avail/384); canvas.style.width=(384*s)+'px'; canvas.style.margin='0 auto'; }
    else { canvas.style.width='100%'; canvas.style.margin='0'; }
  }

  // ---------- konzole / power ----------
  var consolState={start:false,select:false,option:false};
  function consolSet(k,v){ consolState[k]=v; if(M) M.consol(consolState.start,consolState.select,consolState.option); }
  function bindHold(id,k){ var b=document.getElementById(id);
    b.addEventListener('pointerdown',function(e){e.preventDefault();consolSet(k,true);b.classList.add('on');});
    var off=function(e){consolSet(k,false);b.classList.remove('on');};
    b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off);
  }
  function power(opt){
    startAudio();
    M=window.EMU10.createMachine(); M.audioQ=[]; if(audio&&audio.sh)audio.sh.head=-1;
    if(audio) M.onSpeaker=function(level){ audio.st.spkLevel=level?1:-1; audio.st.spkDecay=(audio.ac.sampleRate*0.004)|0; };
    M.coldStart({option:opt});
    if(opt){ consolState.option=true; setTimeout(function(){ consolState.option=false; M.consol(false,false,false); },4000);
             M.consol(false,false,true); }
    running=true;
    document.getElementById('led').classList.add('on');
    if(typeof setJoyMode==='function') setJoyMode(false);   // klavesnice zpet
    typeQ.length=0;
    log(opt?'POWER + OPTION: cold start, OPTION drzene 4 s -> SELF TEST':'POWER: cold start -> BASIC');
    log('ROM: prava XL OS 16K (reset $C2AA) + prava Atari BASIC 8K');
  }
  function doReset(){ if(!M) return; M.reset(); log('RESET (warm start pres reset vektor)'); }

  // ---------- loader XEX / ATR ----------
  function bootXex(name,u8,keepKb){
    startAudio();
    M=window.EMU10.createMachine(); M.audioQ=[]; if(audio&&audio.sh)audio.sh.head=-1;
    if(audio) M.onSpeaker=function(level){ audio.st.spkLevel=level?1:-1; audio.st.spkDecay=(audio.ac.sampleRate*0.004)|0; };
    if(u8[0]===0x96&&u8[1]===0x02){
      log('NAHRAJ XEX: '+name+' je ATR obraz disku - montuji jako disketu D1:.');
      bootAtr(name,u8,true); return;
    }
    var info;
    try{ info=M.mountXex(u8); }
    catch(err){ log('NAHRAJ XEX: '+name+' - CHYBA: '+err.message); return; }
    if(info&&info.error){ log('NAHRAJ XEX: '+name+' - CHYBA: '+info.error); running=true; return; }
    M.coldStart({option:true});
    consolState.option=true; M.consol(false,false,true);
    setTimeout(function(){ consolState.option=false; if(M)M.consol(false,false,false); },1500); // jen na dobu coldstartu - drzene OPTION mate hry, ktere ho ctou na titulce
    running=true; document.getElementById('led').classList.add('on');
    log('NAHRAJ XEX: '+name+' ('+info.bytes+' B, '+info.records+' zaznamu, zavadec v2 primo na cilove adresy)');
    log('Boot pres prave SIO: OS -> boot sektory -> stage2 $0100 -> SIOV zaznamy. OPTION drzene (BASIC OFF).');
    if(info.underRom) log('POZOR: program piše pod OS ROM ($C000+) - vyzaduje RAM pod ROM, plna podpora v BUILD3. Muze selhat.');
    typeQ.length=0;
    var tb=/turbo|tbxl/i.test(name);
    setJoyMode(!tb && !keepKb);
    if(!tb && !keepKb) log('Joystick aktivni (palec = smer, FIRE vpravo). Prepnuti: tlacitko KLAVESNICE.');
  }
  function bootAtr(name,u8,opt){
    startAudio();
    M=window.EMU10.createMachine(); M.audioQ=[]; if(audio&&audio.sh)audio.sh.head=-1;
    if(audio) M.onSpeaker=function(level){ audio.st.spkLevel=level?1:-1; audio.st.spkDecay=(audio.ac.sampleRate*0.004)|0; };
    M.mountDisk(u8);
    M.coldStart({option:opt});
    if(opt){ consolState.option=true; M.consol(false,false,true);
      setTimeout(function(){ consolState.option=false; if(M)M.consol(false,false,false); },5000); }
    running=true; document.getElementById('led').classList.add('on');
    setJoyMode(false); typeQ.length=0;
    log('NAHRAJ ATR: '+name+' ('+u8.length+' B)'+(opt?' + OPTION (BASIC OFF)':''));
  }
  function bootAny(name,u8){
    if(u8[0]===0x50&&u8[1]===0x4B){             // 'PK' = ZIP
      var files;
      try{ files=ahUnzip(u8); }
      catch(e){ log('ZIP '+name+': CHYBA - '+e.message); return; }
      log('ZIP '+name+': '+files.filter(function(f){return f.data.length;}).map(function(f){return f.name;}).join(', '));
      var pick=null;
      for(var i=0;i<files.length;i++) if(/\.(xex|exe|com)$/i.test(files[i].name)){ pick=files[i]; break; }
      if(!pick) for(var i=0;i<files.length;i++) if(/\.atr$/i.test(files[i].name)){ pick=files[i]; break; }
      if(!pick){ log('ZIP '+name+': neobsahuje XEX/ATR'); return; }
      log('ZIP: automaticky spoustim '+pick.name);
      bootAny(pick.name,pick.data); return;
    }
    if(u8[0]===0x96&&u8[1]===0x02){ bootAtr(name,u8,true); return; }
    bootXex(name,u8);
  }
  // most pro Android: Java sype stazeny soubor po davkach a spusti ho
  var rxName='', rxParts=[];
  window.AHRECV_BEGIN=function(name){ rxName=name; rxParts=[]; log('Prijimam z webu: '+name); };
  window.AHRECV_PART=function(b64){ rxParts.push(b64); };
  window.AHRECV_END=function(){
    try{
      var bin=atob(rxParts.join('')), u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i)&0xFF;
      log('Prijato '+u8.length+' B - spoustim.');
      bootAny(rxName,u8);
    }catch(e){ log('Prijem selhal: '+e.message); }
    rxParts=[];
  };
  function pickFile(accept,cb){
    var inp=document.getElementById('filePick');
    inp.accept=accept;
    inp.onchange=function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){ cb(f.name,new Uint8Array(rd.result)); inp.value=''; };
      rd.readAsArrayBuffer(f);
    };
    inp.click();
  }

  // ---------- hlavni smycka ----------
  var last=0, acc=0;
  function tick(ts){
    requestAnimationFrame(tick);
    if(!running||!M) return;
    if(!last) last=ts;
    acc+=Math.min(ts-last,100); last=ts;
    var n=0;
    while(acc>=20 && n<3){ typeStep(); M.runFrame(); typeStep(); acc-=20; n++;
      if(M.cpu.jam){ running=false;
        log('CPU JAM op $'+M.cpu.jamOp.toString(16).toUpperCase()+' na $'+M.cpu.jamPc.toString(16).toUpperCase()+' frame '+M.frame);
        log('PC=$'+M.cpu.pc.toString(16).toUpperCase()+' PORTB=$'+M.portB().toString(16).toUpperCase());
        break; }
    }
    var u8=new Uint8ClampedArray(M.fb.buffer);
    img.data.set(u8); ctx.putImageData(img,0,0);
  }

  // ---------- start ----------
  window.addEventListener('DOMContentLoaded',function(){
    logEl=document.getElementById('log');
    canvas=document.getElementById('scr'); ctx=canvas.getContext('2d');
    img=ctx.createImageData(384,240);
    document.getElementById('btnPower').addEventListener('click',function(){power(false);});
    document.getElementById('btnXex').addEventListener('click',function(){ pickFile('.xex,.exe,.com,.zip',function(n,u8){ bootAny(n,u8); }); });
    document.getElementById('btnAtr').addEventListener('click',function(){ pickFile('.atr,.zip',function(n,u8){ if(u8[0]===0x50&&u8[1]===0x4B){bootAny(n,u8);} else bootAtr(n,u8,document.getElementById('chkOpt').checked); }); });
    document.getElementById('btnTbxl').addEventListener('click',function(){ bootXex('TBXL 1.5 (vestavene)', b64u8(EMU10_TBXL_B64), true); });
    document.getElementById('btnJoy').addEventListener('click',function(){ setJoyMode(!joyMode); });
    document.getElementById('btnTxt').addEventListener('click',function(){ document.getElementById('txtOverlay').style.display='flex'; });
    function txtToAtari(text){
      if(!text) return;
      var pre=document.getElementById('chkNew').checked ? 'NEW\x01' : '';
      queueText(pre + text.replace(/\r/g,'').replace(/\n*$/,'\n'));
    }
    document.getElementById('btnTxtGo').addEventListener('click',function(){
      var ta=document.getElementById('txtIn'); document.getElementById('txtOverlay').style.display='none';
      txtToAtari(ta.value);
    });
    document.getElementById('btnTxtFile').addEventListener('click',function(){
      document.getElementById('txtOverlay').style.display='none';
      pickFile('.txt,.lst,.bas',function(n,u8){
        var text=''; for(var i=0;i<u8.length;i++){ var b=u8[i]; if(b===0x9B){text+='\n';continue;} text+=String.fromCharCode(b); } // ATASCII EOL -> \n
        log('NAHRAJ TXT: '+n+' ('+u8.length+' B) - piseme do BASICu.');
        txtToAtari(text);
      });
    });
    document.getElementById('btnProgNew').addEventListener('click',function(){
      typeQ.length=0; queueText('NEW\x01'); log('SMAZAT PROGRAM: NEW odeslano.');
    });
    document.getElementById('btnTxtClose').addEventListener('click',function(){ document.getElementById('txtOverlay').style.display='none'; });
    bindJoy();
    window.addEventListener('resize',fitScreen); fitScreen();
    document.getElementById('btnSelfTest').addEventListener('click',function(){power(true);});
    document.getElementById('btnReset').addEventListener('click',doReset);
    document.getElementById('btnBreak').addEventListener('click',function(){ if(M){M.breakKey(); log('KEY BREAK');} });
    document.getElementById('btnSaveLog').addEventListener('click',function(){
      var ov=document.getElementById('logOverlay'), ta=document.getElementById('logFull');
      ta.value=LOGBUF.join('\n'); ov.style.display='flex';
    });
    document.getElementById('btnLogCopy').addEventListener('click',function(){
      var ta=document.getElementById('logFull'); ta.focus(); ta.select();
      var done=false;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ log('LOG zkopirovan do schranky.'); });
        done=true;
      }
      if(!done){ try{ document.execCommand('copy'); log('LOG zkopirovan do schranky.'); }catch(e){ log('Kopirovani selhalo - oznacte text a kopirujte rucne.'); } }
    });
    document.getElementById('btnLogDownload').addEventListener('click',function(){
      if(window.AHSAVE && window.AHSAVE.save){
        try{ var p=window.AHSAVE.save('atarihelp-EMU10-log-'+Date.now()+'.txt', LOGBUF.join('\n'));
          log('LOG ulozen do mobilu: '+p); return; }
        catch(e){ log('AHSAVE selhal: '+e.message); }
      }
      try{ var blob=new Blob([LOGBUF.join('\n')],{type:'text/plain'});
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='atarihelp-EMU10-BUILD2T-log-'+Date.now()+'.txt'; a.click();
      }catch(e){ log('Stazeni v teto aplikaci nejde - pouzijte KOPIROVAT.'); }
    });
    document.getElementById('btnLogClose').addEventListener('click',function(){
      document.getElementById('logOverlay').style.display='none';
    });
    bindHold('btnOption','option'); bindHold('btnSelect','select'); bindHold('btnStart','start');
    var bh=document.getElementById('btnHelp');
    bh.addEventListener('pointerdown',function(e){e.preventDefault(); if(M){M.keyDown(17); bh.classList.add('on');}});
    var bhUp=function(){ if(M)M.keyUp(); bh.classList.remove('on'); };
    bh.addEventListener('pointerup',bhUp); bh.addEventListener('pointerleave',bhUp);
    buildOSK(document.getElementById('osk'));
    bindKeyboard();
    log('AtariHelp.eu EMU-10 BUILD2T EXACT UI CODE pripraven.');
    log('Jadro proslo headless testy: BASIC READY 4.6 s | ? 1+1 = 2 | SELF TEST OK');
    requestAnimationFrame(tick);
  });
})();

</script>
