<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>N&P VISION — TAPE LOADER</title>
<style>
:root{--gold:#f2c464;--blue:#8fd8ff;--dark:#050608;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:#050608;color:var(--gold);font-family:"Courier New",monospace;overflow-x:hidden;}
body{display:flex;justify-content:center;align-items:flex-start;}
.stage{position:relative;width:min(100vw,941px);aspect-ratio:941/1672;background:#050608;overflow:hidden;box-shadow:0 0 45px rgba(0,0,0,.95);}
.skin{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;z-index:0;}
.hit{position:absolute;z-index:5;border:0;background:transparent;color:transparent;font-size:0;line-height:0;cursor:pointer;touch-action:manipulation;}
.hit:active{background:rgba(255,203,95,.10);box-shadow:0 0 24px rgba(255,203,95,.18) inset;border-radius:18px;}
#filePick{display:none;}
#btnAdd{left:8.7%;top:65.3%;width:82.6%;height:5.5%;}
#btnPlay{left:8.7%;top:72.2%;width:39.8%;height:4.9%;}
#btnPause{left:51.4%;top:72.2%;width:39.9%;height:4.9%;}
#btnStop{left:8.7%;top:78.6%;width:39.8%;height:4.9%;}
#btnClear{left:51.4%;top:78.6%;width:39.9%;height:4.9%;}
#btnYoutube{left:8.7%;top:85.4%;width:82.6%;height:5.5%;}
#btnBack{left:8.7%;top:92.3%;width:39.8%;height:4.6%;}
#btnEmu{left:51.4%;top:92.3%;width:39.9%;height:4.6%;}
#statusText{position:absolute;left:11.9%;top:38.15%;width:76%;height:2.8%;z-index:2;display:flex;align-items:center;justify-content:center;color:#8fd8ff;font:900 clamp(11px,2.25vw,21px)/1 "Courier New",monospace;letter-spacing:.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 7px rgba(108,201,255,.22);}
#playlistBox{position:absolute;left:10.2%;top:44.05%;width:79.5%;height:18.2%;z-index:2;overflow:auto;padding:6px 10px;color:#f2c464;font:800 clamp(10px,2.0vw,17px)/1.28 "Courier New",monospace;}
.track{display:block;width:100%;border:1px solid rgba(244,197,92,.32);border-radius:10px;background:rgba(7,12,18,.76);color:#f2c464;text-align:left;margin:5px 0;padding:8px 9px;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track.active{color:#8fd8ff;border-color:rgba(108,201,255,.70);box-shadow:0 0 14px rgba(108,201,255,.18) inset;}
.empty{color:#8fd8ff;padding:8px 0;opacity:.95;}
</style>
</head>
<body>
<main class="stage" aria-label="N&P VISION Tape Loader">
  <img class="skin" src="../design/tape_loader_page_np.png" alt="N&P VISION Tape Loader">
  <div id="statusText">READY • PRIDAT MP3 / WAV</div>
  <div id="playlistBox"><div class="empty">Playlist je prazdny.</div></div>

  <input id="filePick" type="file" accept=".mp3,.wav,audio/mpeg,audio/mp3,audio/wav,audio/x-wav" multiple>
  <button id="btnAdd" class="hit" type="button">PRIDAT MP3/WAV</button>
  <button id="btnPlay" class="hit" type="button">PLAY</button>
  <button id="btnPause" class="hit" type="button">PAUSE</button>
  <button id="btnStop" class="hit" type="button">STOP</button>
  <button id="btnClear" class="hit" type="button">VYMAZAT</button>
  <a id="btnYoutube" class="hit" href="https://www.youtube.com/" rel="noopener">YOUTUBE</a>
  <a id="btnBack" class="hit" href="../index.html">ZPET</a>
  <a id="btnEmu" class="hit" href="../emu/index.html">EMULATOR</a>
</main>

<script>
(function(){
'use strict';
var audio=new Audio();
var tracks=[];
var active=-1;
var status=document.getElementById('statusText');
var box=document.getElementById('playlistBox');
var pick=document.getElementById('filePick');

function log(t){ try{console.log('[TAPE LOADER PAGE] '+t);}catch(e){} }
function setStatus(t){ if(status) status.textContent=t; log(t); }
function urlForFile(f){ return URL.createObjectURL(f); }
function render(){
  box.innerHTML='';
  if(!tracks.length){
    var e=document.createElement('div'); e.className='empty'; e.textContent='Playlist je prazdny.'; box.appendChild(e);
    setStatus('READY • PRIDAT MP3 / WAV');
    return;
  }
  tracks.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='track'+(i===active?' active':'');
    b.type='button';
    b.textContent=(i+1)+'. '+t.name;
    b.addEventListener('click',function(){ loadTrack(i,true); });
    box.appendChild(b);
  });
  setStatus('PLAYLIST READY • '+tracks.length+' TRACKU');
}
function loadTrack(i, autoplay){
  if(i<0 || i>=tracks.length) return;
  active=i;
  audio.src=tracks[i].url;
  audio.currentTime=0;
  render();
  setStatus('NACITANO • '+tracks[i].name);
  if(autoplay) play();
}
function play(){
  if(!tracks.length){ pick.click(); return; }
  if(active<0) loadTrack(0,false);
  try{
    var p=audio.play();
    if(p && p.catch) p.catch(function(e){ setStatus('PLAY BLOKOVAN • KLIKNI ZNOVU'); log(e.message); });
    setStatus('PLAY • '+tracks[active].name);
  }catch(e){ setStatus('PLAY CHYBA'); log(e.message); }
}
function pause(){
  try{ audio.pause(); setStatus('PAUSE'); }catch(e){ log(e.message); }
}
function stop(){
  try{ audio.pause(); audio.currentTime=0; setStatus('STOP'); }catch(e){ log(e.message); }
}
function clearAll(){
  try{ audio.pause(); audio.removeAttribute('src'); }catch(e){}
  tracks.forEach(function(t){ try{URL.revokeObjectURL(t.url);}catch(e){} });
  tracks=[]; active=-1; render();
}
pick.addEventListener('change',function(){
  var files=Array.prototype.slice.call(pick.files||[]);
  if(!files.length) return;
  files.forEach(function(f){
    if(!/\.(mp3|wav)$/i.test(f.name||'')){ setStatus('PRESKOCENO • NE MP3/WAV'); return; }
    tracks.push({name:f.name, url:urlForFile(f)});
  });
  pick.value='';
  render();
  if(active<0 && tracks.length) loadTrack(0,false);
});
document.getElementById('btnAdd').addEventListener('click',function(){ pick.click(); });
document.getElementById('btnPlay').addEventListener('click',play);
document.getElementById('btnPause').addEventListener('click',pause);
document.getElementById('btnStop').addEventListener('click',stop);
document.getElementById('btnClear').addEventListener('click',clearAll);
document.getElementById('btnYoutube').addEventListener('click',function(e){
  e.stopPropagation();
  setStatus('YOUTUBE • OTEVIRAM');
  log('YOUTUBE href https://www.youtube.com/');
}, true);
audio.addEventListener('ended',function(){
  if(active+1<tracks.length){ loadTrack(active+1,true); }
  else { setStatus('KONEC PLAYLISTU'); }
});
render();
log('BUILD2FY: cista samostatna stranka tape-loader/index.html. Zadny popup pres uvod.');
})();
</script>
</body>
</html>
