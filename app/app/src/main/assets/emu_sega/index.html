function readAsciiFromRom(u8,off,len){var s='';try{for(var i=0;i<len&&off+i<u8.length;i++){var c=u8[off+i];s+=c>=32&&c<127?String.fromCharCode(c):' ';}}catch(_){}return s;}
function writeAsciiToRom(u8,off,str,len){try{for(var i=0;i<len&&off+i<u8.length;i++){u8[off+i]=i<str.length?str.charCodeAt(i)&255:32;}}catch(e){pushLog('BUILD2RV EU_COMPAT writeAscii fail '+(e.message||e));}}
function findBytes(u8,pat){outer:for(var i=0;i<=u8.length-pat.length;i++){for(var j=0;j<pat.length;j++){if(u8[i+j]!==pat[j])continue outer;}return i;}return -1;}
function updateGenesisChecksum(u8){try{if(u8.length<0x202)return -1;var sum=0;for(var i=0x200;i+1<u8.length;i+=2){sum=(sum+((u8[i]<<8)|u8[i+1]))&0xffff;}u8[0x18e]=(sum>>8)&255;u8[0x18f]=sum&255;return sum;}catch(e){pushLog('BUILD2RV EU_COMPAT checksum fail '+(e.message||e));return -1;}}
function applyEuCompatibilityPatches(name,buf){
  // BUILD2RV AUDIT: native C++ core must respect the cartridge header region.
  // Previous builds changed many Europe/PAL ROMs to U/NTSC in memory. That made some tests pass,
  // but breaks other normal Europe games (example: Samurai Shodown Europe region guard).
  // This is not per-game patching: it is the general rule for C++ native path.
  try{
    var u8=new Uint8Array(buf);
    var title=(readAsciiFromRom(u8,0x120,48)+' '+readAsciiFromRom(u8,0x150,48)).trim();
    var region=readAsciiFromRom(u8,0x1f0,16).trim().toUpperCase();
    lastEuPatchStatus='NO_PATCH_RESPECT_ROM_HEADER region='+(region||'EMPTY');
    pushLog('BUILD2RV REGION_AUDIT_NO_PATCH name='+name+' headerRegion='+(region||'EMPTY')+' title='+title);
    return {buffer:buf,patched:false,summary:lastEuPatchStatus};
  }catch(e){lastEuPatchStatus='NO_PATCH_REGION_AUDIT_ERROR '+(e.message||e);pushLog('BUILD2RV REGION_AUDIT_ERROR '+lastEuPatchStatus);return {buffer:buf,patched:false,summary:lastEuPatchStatus};}
}

var __lastNativeRectLog=0;
/* BUILD2RX LEFT-STRIP FIX (Nox "odskok vlevo"):
   #monitorBlank ma v C++ only skinu display:none => getBoundingClientRect() vraci 0x0,
   takze KAZDA session padala do fallbackPortraitMonitorRect(), ktery prepocitava geometrii
   stage z velikosti okna. Realny .stage ma ale width:min(100vw,941px) + aspect-ratio a klidne
   PRETEKA viewport na vysku - fallback pak stage umele zmensil a vycentroval, cimz posunul
   video o ~6 CSS px doprava a vlevo zustal videt pruh pozadi monitoru (Nox: fallback left=35,
   realny stage left=29). RW C++ audit dokazal, ze framebuffer je OK (leftBoundary=0,
   levy sloupec je herni obsah), takze chyba byla ciste v umisteni TextureView.
   Fix: merit REALNY #stage element a aplikovat na nej stejna procenta jako CSS #monitorBlank
   (left 6.42%, top 17.16%, w 87.28%, h 29.60%). Stary fallback zustava jen pro pripad,
   ze by stage nesel zmerit. */
function portraitMonitorRectFromStage(){
  try{
    var st=$('stage')||document.querySelector('.stage');
    if(!st)return null;
    var r=st.getBoundingClientRect();
    if(!r||r.width<160||r.height<240)return null;
    return {left:r.left+r.width*0.0642, top:r.top+r.height*0.1716, width:r.width*0.8728, height:r.height*0.2960, source:'stagePercent'};
  }catch(e){return null;}
}
function fallbackPortraitMonitorRect(){
  var vp=nativeViewportSize();
  var sw=Math.max(320,vp.w||window.innerWidth||360);
  var sh=Math.max(480,vp.h||window.innerHeight||640);
  var stageW=Math.min(sw,941);
  var stageH=stageW*1672/941;
  if(stageH>sh&&sh>480){stageH=sh;stageW=stageH*941/1672;}
  var left=(sw-stageW)/2, top=0;
  return {left:left+stageW*0.0642, top:top+stageH*0.1716, width:stageW*0.8728, height:stageH*0.2960, fallback:true};
}
function updateNativeCppRect(){try{

  var cssLeft=r?r.left:0,cssTop=r?r.top:0,cssW=r?r.width:0,cssH=r?r.height:0;
  if(land){
    var vp=nativeViewportSize();
    cssLeft=0;cssTop=0;
    cssW=Math.max(vp.w,320);
    cssH=Math.max(vp.h,180);
  } else if(cssW<120||cssH<80){
    var sp=portraitMonitorRectFromStage();
    if(sp){
      cssLeft=sp.left;cssTop=sp.top;cssW=sp.width;cssH=sp.height;
      var nowS=Date.now();
      if(nowS-__lastNativeRectLog>900){__lastNativeRectLog=nowS;pushLog('BUILD2RX NATIVE_RECT_STAGE_PERCENT css='+Math.round(cssLeft)+','+Math.round(cssTop)+','+Math.round(cssW)+'x'+Math.round(cssH)+' leftStripFix=YES');}
    } else {
      var fb=fallbackPortraitMonitorRect();
      cssLeft=fb.left;cssTop=fb.top;cssW=fb.width;cssH=fb.height;
      var now=Date.now();
      if(now-__lastNativeRectLog>900){__lastNativeRectLog=now;pushLog('BUILD2RV NATIVE_RECT_FALLBACK_MONITOR css='+Math.round(cssLeft)+','+Math.round(cssTop)+','+Math.round(cssW)+'x'+Math.round(cssH));}
    }

  if(cssW<120||cssH<80){var now2=Date.now();if(now2-__lastNativeRectLog>900){__lastNativeRectLog=now2;pushLog('BUILD2RV NATIVE_RECT_SKIP_ZERO_OR_SMALL css='+Math.round(cssLeft)+','+Math.round(cssTop)+','+Math.round(cssW)+'x'+Math.round(cssH)+' land='+land);}setTimeout(updateNativeCppRect,280);return;}
  var x=Math.round(cssLeft*dpr), y=Math.round(cssTop*dpr), ww=Math.round(cssW*dpr), hh=Math.round(cssH*dpr);
  if(window.AHNATIVE&&AHNATIVE.setNativeRect){var res=AHNATIVE.setNativeRect(x,y,ww,hh);pushLog('BUILD2RV NATIVE_RECT_DPR css='+Math.round(cssLeft)+','+Math.round(cssTop)+','+Math.round(cssW)+'x'+Math.round(cssH)+' dpr='+dpr+' native='+x+','+y+','+ww+'x'+hh+' landscapeFullVideo='+(land?'YES':'NO')+' result='+res);}
}catch(e){pushLog('BUILD2RV NATIVE_RECT_FAIL '+(e.message||e));}}

function dpadDirectionFromEvent(e){var b=$('dpad');if(!b)return null;var r=b.getBoundingClientRect();var x=(e.clientX-r.left)/Math.max(1,r.width)-.5;var y=(e.clientY-r.top)/Math.max(1,r.height)-.5;var dist=Math.sqrt(x*x+y*y);if(dist<.16)return null;return Math.abs(x)>Math.abs(y)?(x<0?'LEFT':'RIGHT'):(y<0?'UP':'DOWN');}

function setupLandscapeMultiTouch(){
  if(window.__napLandscapeMultiTouchInstalled)return;
  window.__napLandscapeMultiTouchInstalled=true;
  window.__napMobileTouchEngineActive=true;
  /* BUILD2RZ LANDSCAPE PAD V3:
     - ZADNY druhy pad: pouziva se JEDEN puvodni skin ovladac (#dpad + #btnA/B/C sloupec vpravo).
     - Dpad je thumbstick: puntik (#dpadNub) klouze pod palcem, zadny kriz.
     - Citlivost: mala mrtva zona (7% polomeru), smerove bity s prekryvem = diagonaly.
     - Mapovani 1:1: btnA -> Genesis A, btnB -> B, btnC -> C (sloupec vpravo nad sebou).
     - Stisknute prvky se rozsviti (trida .on). Portrait ovladani beze zmeny. */
  var last={UP:false,DOWN:false,LEFT:false,RIGHT:false,A:false,B:false,C:false};
  function rectOf(id){var el=$(id);if(!el)return null;var r=el.getBoundingClientRect();if(!r||r.width<10)return null;return{el:el,cx:r.left+r.width/2,cy:r.top+r.height/2,r:Math.min(r.width,r.height)/2};}
  function inCircle(c,x,y,slop){if(!c)return false;var dx=x-c.cx,dy=y-c.cy,rr=c.r*(slop||1.22);return dx*dx+dy*dy<=rr*rr;}
  function applyKey(k,on){if(last[k]===on)return;last[k]=on;sendToWrapper(k,on);}
  function setNub(dp,dx,dy){
    var nub=$('dpadNub');if(!nub)return;
    if(dp===null){nub.style.transform='translate(0px,0px)';return;}
    var maxOff=dp.r*0.62;
    var d=Math.sqrt(dx*dx+dy*dy)||1;
    var k=Math.min(1,maxOff/d);
    nub.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)';
  }
  function markVis(dOn){
    var dp=$('dpad');if(dp)dp.classList.toggle('on',!!dOn);
    ['A','B','C'].forEach(function(k){var el=$('btn'+k);if(el)el.classList.toggle('on',!!last[k]);});
  }
  function update(ev){
    if(!isLandscapeNow())return;
    var t0=(ev.touches&&ev.touches[0])||ev;
    try{
      var target=t0&&document.elementFromPoint(t0.clientX,t0.clientY);
      if(target && target.closest && target.closest('#btnCollection,#btnGames,#cartSlot,#cartCenter,#btnSaves,#btnManuals,#btnWeb,#btnMenu')){return;}
    }catch(_){ }
    var dp=rectOf('dpad'),cA=rectOf('btnA'),cB=rectOf('btnB'),cC=rectOf('btnC');
    var touches=ev.touches||[];
    var want={UP:false,DOWN:false,LEFT:false,RIGHT:false,A:false,B:false,C:false};
    var touchedControl=false,nubDx=null,nubDy=null;
    for(var i=0;i<touches.length;i++){
      var x=touches[i].clientX,y=touches[i].clientY;
      if(dp&&inCircle(dp,x,y,1.35)){
        var dx=x-dp.cx,dy=y-dp.cy,d=Math.sqrt(dx*dx+dy*dy);
        touchedControl=true;
        if(nubDx===null){nubDx=dx;nubDy=dy;}
        if(d>=dp.r*0.07){
          var rx=dx/d,ry=dy/d;
          if(rx<-0.38)want.LEFT=true; if(rx>0.38)want.RIGHT=true;
          if(ry<-0.38)want.UP=true;   if(ry>0.38)want.DOWN=true;
        }
        continue;
      }
      if(inCircle(cA,x,y)){want.A=true;touchedControl=true;continue;}
      if(inCircle(cB,x,y)){want.B=true;touchedControl=true;continue;}
      if(inCircle(cC,x,y)){want.C=true;touchedControl=true;continue;}
    }
    var anyLast=last.UP||last.DOWN||last.LEFT||last.RIGHT||last.A||last.B||last.C;
    if(!touchedControl && !anyLast)return;
    try{ev.preventDefault();ev.stopPropagation();}catch(_){ }
    ['UP','DOWN','LEFT','RIGHT','A','B','C'].forEach(function(k){applyKey(k,want[k]);});
    setNub(nubDx===null?null:dp,nubDx||0,nubDy||0);
    markVis(want.UP||want.DOWN||want.LEFT||want.RIGHT);
  }
  function releaseAll(ev){
    if(!isLandscapeNow())return;
    update(ev);
    if((ev.touches||[]).length===0){
      ['UP','DOWN','LEFT','RIGHT','A','B','C'].forEach(function(k){applyKey(k,false);});
      setNub(null,0,0);markVis(false);
    }
  }
  var st=$('stage')||document.body;
  ['touchstart','touchmove'].forEach(function(type){st.addEventListener(type,update,{capture:true,passive:false});});
  ['touchend','touchcancel'].forEach(function(type){st.addEventListener(type,releaseAll,{capture:true,passive:false});});
  window.addEventListener('orientationchange',function(){setTimeout(function(){['UP','DOWN','LEFT','RIGHT','A','B','C'].forEach(function(k){applyKey(k,false);});setNub(null,0,0);markVis(false);},80);},true);
  pushLog('BUILD2RZ LANDSCAPE_PAD_V3_READY singlePad=YES thumbstickNub=YES abcColumn=RIGHT diagonals=YES mapping=A/B/C-1:1');
}

function qtOnce(key,fn){
  var now=Date.now();

function bindUiAction(id,key,fn){

    try{el.addEventListener(type,fire,{capture:true,passive:false});}catch(_){try{el.addEventListener(type,fire,true);}catch(__){}}
