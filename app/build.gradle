plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 301
        versionName "EMU10-B255-ATARI-STUDENY-START-RESET"  // Rene po testu: "neni to spravne - self test zvuk neni cisty, bootovaci zvuk neni spravny, csave mas asi ve smycce. Pridej tlacitko reset a return. Po znovu nabootovani po self testu skoci zelena obrazovka - atari musi byt stoprocentni, jinak se sesype jako domecek z karet." NEJVAZNEJSI NALEZ: bootNative() NEBYL skutecny studeny start - Machine::reset() cistil jen CPU+PIA (kvuli PORTB bankovani), ale ANTIC (rozpracovany display list), GTIA (barvy/PRIOR/CONSOL) a POKEY (AUDF/AUDC/AUDCTL, cely zvukovy generator vc. kliku) ZUSTAVALY z PREDCHOZI relace (self-test, zaseknuty CSAVE...) - presne to vysvetluje "zelenou obrazovku" po druhem bootu (PC skoncil na $C02C misto $F312 - OS BEZEL JINYM KODEM kvuli cizimu stavu po sobe). OPRAVA: bootNative() ted SMAZE A ZNOVU POSTAVI cely stroj (presne jako vypnuti+zapnuti napajeni), misto rucniho vyjmenovavani poli k vycisteni (riziko, ze se na neco zapomene priste). RAM rucne vynulovana zvlast (nema vychozi inicializator). OVERENO: novy C++ test (9. kontrola) - "znecisteny" stroj s zapsanymi POKEY/GTIA/ANTIC registry NEOVLIVNI cerstve vytvoreny Machine. Take pridano: RESET tlacitko (Machine::reset() - NEmaze pamet, na rozdil od BOOT - skutecne chovani Atari RESET tlacitka, i zachranna brzda pri zaseknuti) + RETURN tlacitko (samotna klavesa, atariNapisText s prazdnym textem). Rozsireno regsNative() o stav bitu reproduktoru + pocitadlo kliku (predtim slo videt jen AUDF/AUDC/AUDCTL, ne jestli KLIK vubec probehl - to bezi pres jina pole). CSAVE zaseknuti (mozna smycka cekajici na kazetovy port) zatim NEVYRESENO - potrebuje dalsi diagnostiku, RESET tlacitko alespon dava zpusob, jak se z toho dostat behem testovani.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
