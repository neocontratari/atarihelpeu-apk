plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 283
        versionName "EMU10-B237-TVCAST-PAUZA-ANIMACI"  // Rene: "po super settings grafice se zacal sekat prenos na TV - tezko posilas log, protoze ho na tuhle chybu nemas nastaveny." Hypoteza: TV cast bere obraz PRIMO Z JADRA (obchazi WebView), ale WebView porad musi neustale prekreslovat nove animovane pozadi v panelech (10 letajicich planet u PS1, prsteny/kopce u Segy) - realna prace pro GPU, sdileny hardware s H.264 enkoderem. Nova AHPS1/AHSega.tvCastActive() (cte uz existujici napTvWebRunning) + JS kontrola kazdou 1s + CSS animation-play-state:paused na vsech animovanych panelovych vrstvach, kdyz TV cast bezi - kvalita PRENOSU dulezitejsi nez plynulost dekorativniho pozadi, ktere clovek na TV stejne nevidi. DIAGNOSTIKA: appka uz mela TV_WEB_H264_FRAME_AVG/FRAME_SLOW logovani (nikdy nezminovane), jen chybelo propojeni s tim, na jake strance appky se to stalo - pridano "stranka=" do obou hlasek, priste konkretni data mista dalsich dohadu.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
