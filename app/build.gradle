plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 287
        versionName "EMU10-B241-SBIRKA-A-SKLO-OPRAVA"  // Rene poslal log (sega.txt) - "nejde se dostat na www stranky, ani z ps1 a atari, trva to strasne dlouho, a stranky mi funguji." Log ukazal PRESNOU pricinu: VSECHNY TRI verejne CORS proxy sluzby appky (proxy.cors.sh - DNS nejde rozresit, api.allorigins.win - HTTP 522, corsproxy.io - HTTP 401) selhavaly ve smycce po desitky vterin, appka NIKDY nezkusila PRIME pripojeni jako posledni zachranu - a presne to primo funguje bez problemu (overeno web_fetch). Pridan fallback na prime pripojeni, kdyz vsechny 3 proxy selzou - overeno izolovanym testem kontrolni logiky (3x FAIL -> DIRECT_OK, zadna zbytecna volani, zadna nekonecna smycka). DRUHA VEC ZE STEJNEHO LOGU: konecne SPRAVNA pricina "prolinani obrazu do vsech vyberu" (B235/B239/B240 nestacily) - panely maji PRUHLEDNE "sklo" pozadi (.35-.62 krytí, schvalne kvuli vesmirnemu/Sonic pozadi za nimi), a segaPlocha lezi POD strankou - i kdyz appka spravne pozada o schovani, DOKUD se to nestihne projevit, pruhledne sklo ukazuje aktivni hru skrz sebe. Reseni neni dalsi cekani (90ms z B240 nestacilo), ale udelat panely SAMOTNE prakticky nepruhledne (.96-.98) - WebView vykresluje svuj vlastni obsah spolehlive bez ohledu na casovani nativniho mostu. Aplikovano na PS1 i Sega (stejny vzor, stejne riziko, i kdyz PS1 to nehlasil).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
