plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 264
        versionName "EMU10-B218-JEDNA-TRVALA-KARTA"  // ZASADNI OPRAVA ARCHITEKTURY: Rene - "memory card nepracuje jak na PS1... porad zasunuta v PS1." B215-B217 resily SPATNY problem (kazda hra vlastni kartu). Realna PS1 ma JEDNU fyzickou kartu sdilenou vsemi hrami i BIOSem - nap_srm_set_path uz nezavisi na tom, jaka hra bezi, vzdy je to g_savedir/memory_card_1.srm. Navic nalezena a opravena chybejici mezera: ps1BootDoMonitoru (funkce, co bootuje BIOS bez disku I hru) vubec nevolala nap_srm_set_path/nap_srm_load - karta se pri tomhle zpusobu bootu nikdy nenacetla. Overeno 5krokovym testem: BIOS pri prvnim zapnuti prazdna karta, hra ulozi pozici, simulovany restart appky, BIOS po restartu vidi ulozenou hru, jina hra nabootovana vidi tu samou kartu se stejnymi daty.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
