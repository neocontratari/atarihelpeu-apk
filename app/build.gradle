plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 327
        versionName "EMU10-B281-DVOUTON-VYKON-PO-CSAVE-OPRAVA"  // Rene - "ted tam mas dalsi problem po tom csave - jsou zase lagy delaji zpozdeni zvuku." Analyza REALNEHO LOGU ukazala presny vzor: podtekani zvukoveho bufferu stabilne ~9 BEHEM CSAVE, ale EXPLOZE (10->123->323->364) v NASLEDUJICICH MINUTACH PO dokonceni CSAVE. PRESNE OVERENO testem (ne odhad): SKCTL bit3 (dvouton priznak) ZUSTAVA ZAPNUTY NAVZDY po CSAVE (primo zmereno - i 30s po dokonceni, bez jakekoliv dalsi aktivity, porad $2B/bit3 zapnuty) - pravdepodobne autenticke chovani ROM (OS neuklizi SKCTL po kazetove operaci), NE chyba emulace. SKUTECNY PROBLEM: B279/B280 kod kontroloval JEN "je SKCTL bit3 zapnuty?" a pokud ano, VZDY pouzil DRAZSI dvoukanalovy vypocet (dve nezavisla volani pokeyGenSamples + vyberova smycka po vzorcich pro mark/space kanaly) - i KDYZ zadny prenos dat uz davno neprobiha. To zpusobovalo TRVALE ZVYSENOU zatez CPU PO KAZDEM CSAVE, navzdy (dokud appka nebezela znovu), postupne vedouci k narustajicimu podtekani zvukoveho bufferu presne jak Rene pozoroval v logu. OPRAVA: dvoukanalovy (drahy) vypocet se ted pouzije JEN kdyz je SOUCASNE (a) SKCTL bit3 zapnuty A (b) prave probiha GENUINNE NEDAVNY prenos (cpu.c.cycles - serRamecStart < 1773447 cyklu, tedy posledni bajt byl odeslan pred min nez ~1 vterinou) - jinak (stary/zadny prenos, i kdyz SKCTL bit3 stale zustava zapnuty) se pouzije levny, standardni jednokanalovy vypocet. OVERENO primo na produkcnim kodu: pocitadlo drahych volani ukazuje 280 volani BEHEM 24s prubehu CSAVE (spravne, tam MA byt drahy vypocet), ale PRESNE 0 NOVYCH drahych volani v nasledujicich 30 sekundach PO CSAVE (spravne, mel by se pouzivat levny vypocet, presne to i dela). Vsech 9 predchozich testu prochazi beze zmeny. Dvouton frekvence (oficialni De Re Atari specifikace, B279) potvrzeny beze zmeny (5236.9Hz mark, 4009.1Hz space). CLOAD regrese-test (ERROR 138) potvrzen beze zmeny. Obrazovka spravne konci READY. Kompletni prekompilace nap_atari_native.cpp, zavorky vyvazeny.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
