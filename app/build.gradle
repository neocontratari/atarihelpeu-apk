plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 267
        versionName "EMU10-B221-PLOCHA-SE-SCHOVA-V-PANELECH"  // Rene: screenshoty ukazaly obraz BIOSu "zamotany" do HTML panelu (knihovna/D-PAD nastaveni), minimalizace appky to spravila. Pricina: ps1Plocha je NATIVNI View nad WebView (zOrderOnTop kvuli hrani) - zadne CSS v panelu ji nemuze schovat. Oprava: nova tenka metoda AHPS1.ps1PlochaVisible(bool) - jen View.setVisibility, STEJNY bezpecny mechanismus jako uz existujici prechody v intru, ZADNY zasah do EGL/vlakna renderovani/bootovani jadra. Kazdy panel (knihovna, D-PAD, OVLADANI, MEMORY CARD status, editace rozlozeni) ted schova plochu pri otevreni a vrati pri zavreni. Navic: hlaska "Spoustim hru" pri SPUSTIT v knihovne prodlouzena z 2.4s na 11s (skutecne booteni trva ~10s, driv to vypadalo jako by se appka zaseknula).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
