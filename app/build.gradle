plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 332
        versionName "EMU10-B286-WAV-KODOVANI-NEBLOKUJE"  // Rene po B285
        // (poslal novy log): "sakra lepsi, synchron je lepsi, ale furt to
        // neni 1ku1... projed si to dukladne a podivej se na jadro a klidne
        // si projed i www stranky - myslim ze jsme cca 95 procent, ale v
        // c++ chci atari stoprocent." B285 OREZAN mechanismus funguje
        // spravne (v logu videt presne 3x, presne pri self-testu, zahlceni
        // uz nenastava - Rene sam potvrdil). Zbyvajici rozdil: v logu dal
        // roste ZVUK_PODTEKANI (underrun) pocitadlo, oddelene od OREZAN,
        // hlavne TESNE PO KONZOLE:start+OREZAN udalostech (+22, +10) a v
        // mensi mire kolem kazdeho ulozeni CSAVE_WAV (+1 az +5). DVA NALEZY
        // (oba primo zmerene, ne odhadnute):
        // (1) ukoncitNahravani() (CSAVE -> .wav soubor, bezi presne kdyz
        // motor kazety zhasne) delala CELE base64-kodovani (~2.5MB zvuku,
        // presne Reneho velikosti z logu) JEDNIM souvislym synchronnim
        // behem - novy Node test (test_b286_wav_blokovani.js, presna kopie
        // algoritmu) zmeril ~20-26ms na rychlem stolnim stroji (realny
        // telefon muze byt pomalejsi), z toho samotne SPOJENI kousku jen
        // ~1.7ms - temer cela rezie je v String.fromCharCode.apply() base64
        // kodovani. OPRAVA: stejny vysledek (OVERENO bajt-za-bajtem
        // identicky vystup na 10 ruznych velikostech vc. hranicnich
        // pripadu), ale rozdelene na davky po 40 kouscich zpracovane PRES
        // VICE TIKU UDALOSTNI SMYCKY (setTimeout 0) - hlavni vlakno uz
        // neni blokovane vic nez pár ms najednou.
        // (2) OREZAN (B285) sam nastavoval "dalsiZvukStart" BEZ REZERVY
        // presne na "ted" - kdyz naplanujZvukovyBuffer() hned pote znovu
        // (cerstve) cte zvukCtx.currentTime, muze uz byt o kousek dal (rezie
        // samotneho orezani), takze prvni nasledujici kousek(y) nahlasi
        // "podtekani", i kdyz jde jen o rezii orezani, ne skutecne
        // nestihani (tohle zduvodneno, ne zmereno se stejnou jistotou jako
        // (1) - jde o rezii v ramci behu prohlizece/WebView, CLI testy na
        // ni nedosahnou). OPRAVA: +50ms rezerva pri kazdem orezani.
        // TAKE OVERENO (Reneho opakovany pozadavek na jistotu o C++):
        // novy CLI test (test_b286_rychlost_behem_csave.cpp) meri
        // wall-clock cas KAZDEHO JEDNOTLIVEHO snimku zvlast behem klidu,
        // CSAVE LEADER faze a CSAVE DATA/dvouton faze (ne jen pred/po jako
        // B285, ale primo BEHEM realne audio aktivity) - prumery prakticky
        // shodne (3.17-3.41ms/snimek, pomer DATA/KLID 0.957-0.971x,
        // opakovane mereno), nejhorsi jednotlivy snimek 11.35ms = 56.8% z
        // 20ms realneho rozpoctu na snimek (PAL 50fps) - pohodlna rezerva,
        // zadny snimek se ani nepriblizuje limitu. C++ jadro tedy NENI
        // pomalejsi ani PO CSAVE (B285) ani BEHEM aktivniho prenosu (B286) -
        // dve nezavisla mereni, stejny zaver. Cela existujici C++ sada
        // (23/23) beze zmeny prochazi dal - tahle oprava je zase cela jen
        // v JS prehravani/ukladani (index.html), do jadra se nesahalo.
        // NEOVERENO JESTE skutecnym poslechem/testem na telefonu.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
