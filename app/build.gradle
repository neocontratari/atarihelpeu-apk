plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 268
        versionName "EMU10-B222-ODPOCET-A-GRAFIKA-BIOS"  // Rene: "furt to neni stoprocentni" (obraz v panelech) + "dej si zalezet na grafice vyberu her" + "zadny odpocet neni videt". 1) ps1PlochaVisible() posilena o setAlpha(0/1) vedle setVisibility - SurfaceView ma vlastni hardwarovou vrstvu, setVisibility samo umi zpozdit; oboje spolu je spolehlivejsi, porad zadny zasah do EGL/vlakna. 2) Vsechny panely (.panel/.box/.libGame) predelany na zlato-modry PS1-BIOS styl - dvojity zlaty ram, modra zare pozadi jako MAIN MENU obrazovka, hry jako CD sloty s prosvetlenym kolem PLAY. 3) Staticka hlaska pri SPUSTIT nahrazena skutecnym tikajicim odpoctem (10->0).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
