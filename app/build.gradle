plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 307
        versionName "EMU10-B261-PS1-INTERLACE-SKUTECNA-PRICINA"  // Rene: "pojd jeste na tu ps1." SKUTECNA PRICINA NALEZENA - a je uplne jinde nez v B259. KRITICKY OMYL Z B259: zkoumal jsem plugins/gpu-gles/gpulib_if.c, ale ten se od B82 VUBEC NEKOMPILUJE (viz CMakeLists.txt komentar - "19377 radku proverenehogpu_neon lezelo nepouzitych" zatimco se prekladal rucne psany gpu_naples2/gpu-gles) - cela B259 diagnostika sla do MRTVEHO KODU, proto se v Reneho logu nic z ni neobjevilo. SKUTECNY aktivni vykreslovac je gpu_neon. V nem (plugins/gpulib/gpu.c, GPUvBlank()) je interlace podmineny TREMI veci naraz: allow_interlace (nastaveni z FRONTENDU) && STATUS_INTERLACE (hra) && STATUS_DHEIGHT (hra). Jadro se na allow_interlace pta pres RETRO_ENVIRONMENT_GET_VARIABLE s klicem "pcsx_rearmed_neon_interlace_enable_v2" (frontend/libretro.c) - a nase nap_core_option_value() (seznam vsech nastaveni, na ktera appka jadru odpovida) tenhle klic VUBEC NEMELA - jadro dostalo "nenalezeno", allow_interlace zustal na vychozi 0=VYPNUTO. ZADNA hra tedy nikdy nedostala interlace, at o nej zadala jakkoli - presne to vysvetluje Doom "rozsypanou" grafiku. OPRAVA: pridan jeden radek do existujiciho seznamu (presne stejny vzor jako vsech ostatnich ~7 jiz fungujicich polozek v teze funkci) - hodnota "auto" (ne "enabled") zamerne, protoze samotny gpu.c komentar vysvetluje proc - "interlace nevypada dobre na progresivnich displejich" (telefon JE progresivni) a auto rezim ma vestavenou ochranu proti hram, ktere bit nastavi ale VRAM aktivne necetou. STEJNE OMEZENI JAKO U PS1 CELKOVE: nejde tohle zkompilovat/spustit v tomto sandboxu (OpenGL/Android) - overena je jen syntaxe a shoda se zavedenym, uz funkcnim vzorem stejne funkce (7 existujicich polozek), ne skutecny beh. Rene bude testovat pres GitHub Actions jako vzdy u PS1 zmen. POUCKA PRO NASTUPCE: PRED investigaci konkretniho .c/.cpp souboru VZDY nejdriv overit v CMakeLists.txt/Android.mk, jestli se ten soubor VUBEC KOMPILUJE - jinak muze cela hodiny dlouha investigace smerovat do mrtveho kodu, presne jak se stalo v B259.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
