plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 288
        versionName "EMU10-B242-SEGA-SETVISIBILITY-A-DVE-OPRAVY"  // Rene: "proc to neudelas stejne jak v ps1 - tam to bylo uz osetreny." Ma pravdu - ctyri predchozi pokusy pro Segu (B235 zaklad, B239 nesouvisejici, B240 zpozdeni, B241 nepruhledne panely) NESTACILY, coz silne naznacuje, ze segaPlocha se CHOVA jako zOrderOnTop=true (renderuje NAD WebView) bez ohledu na to, ze setZOrderOnTop() se v kodu nikde nevola - proti tomu HTML pruhlednost nema sanci. Sega plocha ted pouziva STEJNY mechanismus jako PS1 portrait (setVisibility, ne setAlpha) na vsech trech mistech (segaPlochaVisible, hlidac, segaPlochaZapni pri vytvoreni) - Sega nema zadnou landscape-panel scenu, takze staci jednoduche VZDY setVisibility bez orientation-vetveni jako u PS1. DALSI DVE OPRAVY ZE STEJNE ZPRAVY: (1) SBIRKA - poradi zkouseni OBRACENO, PRIMO JAKO PRVNI (rychle, o cem uz vime ze funguje), 3 proxy jen jako zaloha - drive se vzdy nejdriv plytvalo casem na 3 nefunkcni proxy. (2) "furt se to stahuje po reinstalaci" - nalezena skutecna pricina: rozhodovani "mam se zeptat na stazeni BIOS+Sonic?" zaviselo i na SharedPreferences prizanku "uz jsem se ptal", ktery Android pri odinstalaci SMAZE (presne ta sama poucka jako u PS1 memory karty v B225) - i kdyz SOUBORY (na verejnem uloziste) porad existovaly. Rozhodovani ted zavisi VYHRADNE na skutecne pritomnosti souboru na disku.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
