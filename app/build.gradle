plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 302
        versionName "EMU10-B256-ATARI-OPRAVA-REGRESE-BOOT"  // Rene: "ted nenabehlo vubec nic. Me uz vadilo, ze podle tebe je to dostacujici - NE - to musi byt vyborny! Zacinas dela chyby." MA CHYBA, plne priznana: pri prepisu bootNative() v B255 (smaz+postav znovu misto rucniho cisteni poli) jsem OMYLEM VYNECHAL radek g_stroj->reset() - bez nej cpu.reset() nikdy nenacte reset vektor z ROM ($FFFC/$FFFD) a CPU zustane na PC=0 (vychozi CpuState()), takze 600 snimku bezelo uplne naprazdno. Presne to Rene videl v logu (PC=0 DMACTL=0 DLIST=0 pri KAZDEM z obou pokusu o boot). Tohle byla REGRESE, ne oprava - a proslo to, protoze muj test z B255 testoval jen Machine/genAudio IZOLOVANE, nikdy nezkousel celou bootNative() cestu se SKUTECNYMI ROM daty od zacatku do konce. OPRAVA: radek g_stroj->reset() vracen zpet, na spravne misto (po vycisteni RAM, pred prvnim runFrame()). NOVY TEST (test_atari_boot.cpp, ulozen trvale) - PRESNE ten test, ktery mel existovat uz v B255: cte skutecny reset vektor PRIMO z ROM dat (nezavisle na kodu jadra), overuje ze reset() da presne tenhle PC, overuje ze po 600 snimcich (presne stejna posloupnost jako bootNative()) PC/DMACTL/DLIST nejsou nula a CPU nezaseklo, a overuje ze DVA nezavisle "studene starty" davaji IDENTICKY vysledek. Vsechny 4 kontroly presly - DMACTL=34 presne odpovida tomu, co appka davala pri drivejsich uspesnych bootech. POUCKA PRO NASTUPCE (a pro me): "kompiluje se" NENI totez co "funguje" - kdykoli se meni JNI funkce, kterou appka pri startu vola, je nutne mit test, ktery projde CELOU tou cestou se SKUTECNYMI daty (ne mockem), ne jen izolovane testovat vnitrni komponenty. Rene ma pravdu - "dostatecne" nestaci, musi to byt vyborne.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
