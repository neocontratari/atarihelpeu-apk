plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 284
        versionName "EMU10-B238-SEGA-KNIHOVNA-A-ULOZENI"  // Rene: "tu Segu sis nedelal Partaku? Sbirka jede furt stejne, ULOZENE nefunguje, HRY skace primo do mobilu - projdi si co jsem chtel a oprav to." Vsechny 4 casti dodelany: 1) HRY otevira knihovnu her (verejne uloziste Downloads/AtariHelp/Sega_hry, prezije odinstalaci jako u PS1) se SPUSTIT/SMAZAT, "VYBRAT SOUBOR RUCNE" jako sekundarni volba. 2) ULOZENE otevira seznam ulozenych pozic PER HRU (ne uz jeden sdileny slot z B236) - NACIST hru samo nahraje, pokud jeste nebezi. 3) SBIRKA hraje hned jako doposud, navic po nabehnuti nabidne "ULOZIT DO TELEFONU" (mizi samo za 8s). 4) Bottom-row v landscape: SAVE (vlevo) - START (uprostred, uz od B236) - LOAD GAME (vpravo), spocitane pozice s bezpecnou mezerou od D-padu i sloupce A/B/C, vyjmuty z herniho vstupu (pridano do existujici exclusion listy v update()). Sledovani aktualni hry (segaCurrentGameName/Bytes) zavesene na JEDINE spolecne misto (loadRomBase64), kudy prochazi VSECHNY zpusoby nahrani.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
