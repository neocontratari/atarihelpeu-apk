plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.atarihelp.eglrender'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'eu.atarihelp.eglrender'
        minSdk 24            // stejne jako AtariHelp.eu (emu10)
        targetSdk 34
        versionCode 6
        versionName '1.5-HRA-PRES-WIFI'

        ndk {
            // PS1 jadro (libnapps1core.so) existuje jen pro arm64 -
            // tvuj telefon je arm64 (jadro na nem v emu10 prokazatelne bezi)
            abiFilters 'arm64-v8a'
        }
    }

    // Stale stejny podpisovy klic (debug.keystore je soucasti repozitare).
    // Diky tomu jde kazda dalsi verze nainstalovat PRES tu predchozi
    // bez odinstalace - podpis se mezi buildy nemeni.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
