plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 271
        versionName "EMU10-B225-KARTA-VEREJNE-ULOZISTE"  // Rene: "kdyz apku vymazu a znova nainstaluji, cd/iso si hry pamatuje, ale memory card je prazdna." Pricina: saveDir (=g_savedir v jadru, tam vznika memory_card_1.srm) sel pres getFilesDir() = appce-privatni uloziste, ktere Android PRI ODINSTALACI SMAZE. Hry v knihovne prezily, protoze uz davno lezi ve verejnem Downloads/AtariHelp. Nova getPublicMemoryCardDir() (Downloads/AtariHelp/PS1_pametova_karta) pouzita na vsech trech mistech, kde appka bootuje BIOS/hru - presne jako realna PS1 karta, fyzicky oddelena od konzole, prezije i vymazani appky. Jednorazova migrace existujici karty ze stare privatni cesty, at Rene neprijde o rozehrane testovani.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
