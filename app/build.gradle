plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 315
        versionName "EMU10-B269-ATARI-CSAVE-REALNY-WAV-EXPORT"  // Rene: "udelej realny WAV, budu ho testovat na skutecnem stroji, ne na Altirre - te neverim... proto chci nejdriv ciste jadro a realny atari v apce." Novy JS tlacitko/JNI most 'atariCsaveDoWav(nazev)': napise CSAVE presne stejnym produkcnim casovanim jako atariNapisText (8 snimku/klavesa - KRITICKE po poucce z B268, jina casovani = jina vetev v ROM), pak zachyti VESKERY zvuk (nova nativni fce atariZachytitCsaveZvukNative, 45s bezpecna rezerva i pro delsi programy) primo z genAudio() - ZADNA zvlast psana FSK simulace, appka uz spravne pise AUDF/AUDC/GTIA presne jako realny hardware (overeno testy v B268: beep pocty 2/1, motor timing ~18s/~53s, ERROR 138 vse sedi). Vysledek ulozen jako standardni 44100Hz/16bit/mono .wav do verejneho uloziste Downloads/AtariHelp/Atari_emu/ (prezije odinstalaci appky, presne jako hry a PS1 memory card - viz B_SB26 poucka). OVERENO: (1) test se 100radkovym programem (kazda radka ~47 znaku REM, ~4700 bajtu) - vsech 100 radku napsano bez zaseknuti, overeno prikazem LIST na radcich 1/50/100 ze presne odpovidaji napsanemu obsahu. (2) CSAVE tohoto dlouheho programu dobehne bez chyby, motor bezi 28.2s (vs ~18s pro kratky/prazdny program - doba spravne roste s delkou programu). (3) zachyceny zvuk analyzovan po vterinach - souvisly tón presne 0-18s (zapis dat), pak ciste ticho zbytek 45s okna zadny sum/artefakt po dokonceni. RMS energie a max amplituda v ocekavanem rozsahu (ne ticho, ne prebuzeno). POCTIVA POZNAMKA: tohle je JEN CSAVE->WAV smer (zapis). CLOAD<-WAV (cist realnou nahravku zpet, ne jen "zadna kazeta" scenar) NENI SOUCASTI teto zmeny - vyzaduje samostatnou "virtualni kazetu" infrastrukturu (zachytit bajty pri zapisu, prehrat je zpet jako SKSTAT prechody se spravnym FSK timingem vcetne vodicich tonu mezi 132B bloky) ktera zatim neexistuje. Rene potvrdil, ze i v JS referenci byl CLOAD pro delsi/vicebllokove nahravky JEDINA znama chyba - tohle zustava pro pristi kolo.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
