plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 275
        versionName "EMU10-B229-RESET-VLAJKA-OPRAVENA"  // Rene upresnil: "tam nebyl dvojity stisk - pokud byl bios bez cd a ten se nacetl, tak DALSI [reset] udelal chybu." SKUTECNA PRICINA: stopPs1SessionHard() spravne zastavila bezici BIOS (NativePs1CoreBridge.stopSafe()), ale NIKDY nevracela ps1BiosRunning zpet na false! Nasledny ps1MaybeStartBios() (volany z ps1Reset) videl STARY priznak "BIOS bezi" a novy start vubec nezacal - jadro bylo doopravdy zastavene (odtud ten zvuk pri zastaveni), ale nic noveho uz nenaskocilo. Pridano ps1BiosRunning=false (a pro uplnost i ps1GameWindowOwnsCore=false) primo do stopPs1SessionHard() - stejne misto, co uz melo ps1BootActive/ps1SessionActive. B228 pojistka proti dvojitemu stisku zustava (jina, doplnujici vec, ne nahrada).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
