plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 326
        versionName "EMU10-B280-CSAVE-WAV-BASE64-OPRAVA"  // Rene - "jak to ze ne, to uz sme meli, nekam sis to zakopal - tam ukladame s csave format wav!!" Mel pravdu - automaticke ukladani WAV pri napsani CSAVE (B273, atariUlozitZvukJakoWav + zahajNahravani/ukoncitNahravani) v kodu STALE EXISTUJE, jen jsem si na nej v B279 nevzpomnel. SKUTECNA PRICINA "csave se neuklada": v logu se opakovane objevovala "BUILD2SB81 CSAVE_WAV chyba=base64:bad base-64" - PRIMO OVERENO v Pythonu (ne odhad): kod delil nahravana data na kusy po 8192 bajtech pred base64 kodovanim ("var KUS=8192"), ale 8192 NENI delitelne tremi - base64 kóduje po skupinach PRESNE 3 bajtu -> 4 znaky, takze KAZDY kus o velikosti nedelitelne 3 dostane VLASTNI vycpavkove znaky "=" na konci - a kdyz se takove kusy CONCATENUJI dohromady, vycpavka konci UPROSTRED vysledneho retezce (ne jen na uplnem konci), coz je NEPLATNY base64 - presne to zpusobovalo hlasenou chybu "Excess data after padding" pri pokusu o dekodovani na Java strane. OPRAVA: KUS zmeneno na 8190 (=2730*3, delitelne tremi) - primo overeno v Pythonu na simulovanych datech (25600 bajtu): puvodni kod (KUS=8192) davá neplatny base64 s vycpavkou uprostred, opraveny kod (KUS=8190) davá platny base64, uspesne dekodovatelny zpet na PRESNE puvodni data. Tohle je JS-only oprava (jeden radek), C++ jadro NEDOTCENO - vsech 9 predchozich testu prochazi beze zmeny. Kompletni prekompilace nap_atari_native.cpp (nezmeneno), zavorky index.html vyvazeny. POCTIVE: B279 chybne tvrdilo, ze appka "nema perzistentni virtualni kazetu" - TOHLE BYLO SPATNE, appka VIRTUALNI KAZETU (WAV export) MA od B273, jen nefungovala kvuli tehle base64 chybe. Omluva za zapomneti vlastni drivejsi prace.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
