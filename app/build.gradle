plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 317
        versionName "EMU10-B271-ATARI-ZVUK-ZAHOZENI-OPRAVA"  // Rene testoval B270 na realnem telefonu: "CLOAD je rychlejsi, ERROR 138 zvuk klapne az na konci, ale na zacatku po vypsani ne - ani u CSAVE. Poradny test musi byt takovy, ze se vypise jen CSAVE/CLOAD BEZ tveho return - ten musim dat ja." PRESNE OVERENO (cislama, ne odhadem): po napsani CSAVE+RETURN se behem nasledujiciho synchronniho 60-snimkoveho bloku (soucast atariNapisText, kvuli vykonu) nahromadi 96 zvukovych prechodu - presne to hledane pipnuti! ALE nasledny B268 fix (vyresil JINY bug - 67 kliku pri vstupu do self-testu) tyhle prechody VZDY zahodi driv, nez je normalni smycka genAudio() uvidi - konflikt dvou vlastnich oprav, jedna zachytava, druha maze. NOVE TLACITKA: "NAPSAT: CSAVE/CLOAD (bez RETURN)" - pisi jen text, RETURN posila uzivatel sam samostatnym tlacitkem, presne jak Rene zadal (nova metoda atariNapisTextBezReturn). OPRAVA ZAHAZOVANI: mistro tiseho behu (keySafe pouze nastavuje klavesu a bezi snimky BEZ genAudio) + naslednym zahozenim, VSECHNY tri postizena mista (atariNapisText, atariNapisTextBezReturn, atariDoSelfTestu, bootNative) ted BEHEM CELE OPERACE PRUBEZNE ZACHYTAVAJI zvuk (presne stejny mechanismus, jaky uz byl overeny u atariCsaveDoWav pro WAV export) a POSILAJI HO ZPET jako "zvuk_b64" pole v JSON odpovedi - JS strana (upravena funkce volej()) ho pak SKUTECNE prehraje pres existujici zvukovy pipeline (pridejVzorkyDoHromady), misto aby zustal nevyuzity nebo byl zahozen. Vyhoda: zadny konflikt s B268 fix, protoze genAudio() se ted vola PRUBEZNE (kazdy snimek), takze zadne "stare nahromadene prechody" k zahozeni ani nevzniknou - problem vyresen z koreni, ne zaplatovan. bootNative (C++) upravena stejnym zpusobem - "dlouhy boot zvuk" (Rene zminoval na zacatku) by ted mel byt SKUTECNE slyset, ne tise probehnuty. OVERENO: vsech 10 predchozich testu prochazi beze zmeny + 2 nove testy (end-to-end simulace noveho vzoru pro CSAVE pipnuti - RMS 0.176, 59% nenulovych vzorku, jasne slysitelne; zachyceni zvuku behem 600-snimkoveho bootu - RMS 0.036, 28% nenulovych vzorku, appka nespadne). Kompletni recompilace nap_atari_native.cpp (B64 tabulka presunuta na zacatek souboru, aby byla dostupna i pro upravenou bootNative) i MainActivity.java (zavorky vyvazeny, 0). POCTIVE: RESET misto CSAVE po CLOAD->READY (Rene zmatek v logu) - v logu RESET zalogovan jako VYSLOVNA, samostatna akce TESNE PRED napsanim CSAVE, ne jako vedlejsi efekt CSAVE - vypada na nahodne zmacknuti tlacitka, ne kodovy bug, ale bez dalsiho potvrzeni to netvrdim s jistotou. Self-test zvuk/rychlost a attract mode v praxi na telefonu zustavaji NEVYRESENY - to jsou oddelene vykonnostni otazky.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
