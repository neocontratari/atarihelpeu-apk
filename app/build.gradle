plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 290
        versionName "EMU10-B244-STARTUP-RETRY-STORAGE"  // Rene poslal presny a klicovy postreh: "intro najede presne jak ma, i core Segy a core PS1, i kdyz sem dal NESTAHNOUT - takze jedna cast appky (spustSegu(), spousti se AZ BEHEM intra) soubory najde bez problemu, ale ta PRVNI kontrola (bezici synchronne v onCreate(), tedy MNOHEM DRIV) je nenajde." Screenshot souboroveho spravce navic potvrdil, ze soubory NA DISKU FYZICKY BYLY (emu/sega, PS1_BIOS oba existovaly) - takze B242/B243 opravy logiky byly spravne, ale zaklad (samotna kontrola pritomnosti) obcas selhava kvuli znamemu Android chovani: hned po studenem startu (obzvlast cerstva instalace) muze byt verejne uloziste jeste "dobihajici" a File.listFiles() chvilku vraci prazdno, i kdyz soubory fyzicky existuji - do doby, kdy intro dobehne o par vterin pozdeji ke sve dalsi etape, uz to stihne byt v poradku. OPRAVA: kdyz prvni pokus najde "chybi", appka to NEVZDA hned - kratce pocka (700ms, pak 1400ms, max 2 opakovani) a zkusi znovu, presne tak dlouho, aby to melo stejnou sanci jako ta pozdejsi kontrola v intru. Overeno izolovanym testem kontrolni logiky (3 scenare: rychla cesta bez retry, retry zachranil situaci, genuinne chybejici soubory bez zacykleni).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
