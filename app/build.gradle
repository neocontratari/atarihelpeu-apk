plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 286
        versionName "EMU10-B240-SEGA-3-OPRAVY-Z-LOGU"  // Rene poslal skutecny log + screenshot ("beze zmeny, chyby zustaly") a dve dalsi hlaseni. 1) PROLINANI OBRAZU: log NEukazal PLOCHA_ZRUSENA/VYTVORENA kolem prepinacu (na rozdil od PS1 B224) - nejpravdepodobnejsi vysvetleni je JS->Java->UI-vlakno zpozdeni pred tim, nez se panel synchronne otevre. Vsechny 4 Sega panely ted pockaji 90ms PRED zobrazenim (napSegaOtevriSeZpozdenim) - sotva postrehnutelne pro cloveka, dost casu pro nativni alpha=0 aby dorazil. 2) "PROC SE PTA JESTLI ULOZIT HRU Z TELEFONU": log potvrdil - segaLibraryLaunch (spusteni JIZ ULOZENE hry z knihovny) slo stejnou JS cestou (napInjectRomBase64) jako SBIRKA, a ta VZDY nabidla ulozeni, i kdyz hra uz v knihovne byla. Pridan treti parametr (zeSbirky) - knihovna ho posila jako false, SBIRKA ho neposila vubec (=puvodni chovani). 3) ULOZENE POZICE PREZIJI ODINSTALACI - presunuto z appce-privatniho na verejne uloziste (Downloads/AtariHelp/Sega_ulozene_pozice), presne jako PS1 memory karta v B225, s jednorazovou migraci existujicich pozic.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
