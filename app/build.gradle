plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 296
        versionName "EMU10-B250-ATARI-ZVUK-PREHRAVANI-OPRAVA"  // Rene: "se pokey mas problemy. zvuk dle me nefunguje." Log ale ukazal, ze GENEROVANI funguje spravne (17:28:30 spicka=0.1333, AUDF=60 AUDC=168=cisty ton hlasitost 8 - presne sedi s ocekavanym stavem self-testu) - podezreni tedy padlo na PREHRAVANI, ne na POKEY algoritmus. Dve konkretni prilepseni: (1) AudioContext na Androidu/WebView casto zustava "suspended" (znamy problem, ktery uz resila i JS reference - komentar "BUILD2KF") - pridano podrobne logovani stavu PRED/PO resume() + potvrzeni ze prehravani doopravdy zacalo/skoncilo (predtim se logovala jen statistika GENEROVANI, nikdy jestli PREHRAVANI probehlo - ted uz nemusim hadat, kde presne to vazne). (2) vol/60 vzorec v POKEY znamena max hlasitost jen ~0.25 - u zachyceneho zaznamu jen 0.133 - snadno prehlednutelne na malem repro. Pridan GainNode (zesileni x4x jen pro PREHRAVANI, cisla v logu/statistice zustavaji hardwarove presna, nezmenena). VEDLEJSI NALEZ pri psani testu: zbytkovy "dozvuk" DC-blockeru mezi NESOUVISEJICIMI stisky tlacitka (kazdy stisk je nezavisly snimek "co se deje ted", ne pokracovani) - pridan reset generatoroveho stavu na zacatku audioNative(). OVERENO: rozsireny izolovany test (6 kontrol, vc. overeni ze reset odstranil dozvuk), cely nap_atari_native.cpp znovu zkompilovan cistě s JNI stubem.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
