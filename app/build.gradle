plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 298
        versionName "EMU10-B252-ATARI-CPP-PRUBEZNY-BEH"  // Rene: "nehodlam testovat pokey podle log-cisel, ja to musim slyset/videt jako skutecne atari. Zrus pomocna tlacitka zvuku a grafiky. Po botovani nabehne okamzite realne atari s opravdovym snimkovanim. Po BYE self test - tam v testu zvuku pobezi zvuk presne tak jak na realnem atari." Zasadni prestavba testovaci stranky: ODSTRANENA tlacitka ZIVE (rucni prepinani prubezneho vykreslovani), ZVUK (jednorazovy 2s snimek na pozadani), +2s KROK (rucni posun). MISTO NICH: JEDNA souvisla smycka (requestAnimationFrame), ktera se SAMA spusti hned po kliknuti na NABOOTOVAT - zadne dalsi tlacitko. Smycka bezi PRESNYM TEMPEM skutecneho PAL Atari (50 snimku/s, hlidano akumulatorem skutecneho casu, ne pevnym intervalem) - video (1 snimek) a zvuk (odpovidajici pocet vzorku) se advancuji SPOLU, snimek po snimku, takze zustavaji synchronizovane. Cap 10 snimku/tik proti "honicce" po zadrhnuti prohlizece. Zvuk hraje GAPLESSLY (naplanovane bufferove kousky za sebou, AudioContext.currentTime). NATIVNI STRANA: puvodni jednorazovy audioNative() (JSON+staty+reset stavu, B249/B250) ODSTRANEN, nahrazen lehkym audioChunkNative() (holy base64, ZADNY reset stavu - prubezne navazuje presne jako skutecny POKEY) + regsNative() pro ridke logovani (kazdych ~100 volani, ~2s). Overeno: cely nap_atari_native.cpp znovu zkompilovan cistě s JNI stubem, izolovany POKEY test framebuffer-nezavisly beh vsech 6 kontrol beze zmeny presel (algoritmus se nezmenil, jen jak/kdy se vola), nova jsdom simulace (4 kontroly: stara tlacitka pryc, boot sam spusti smycku, obraz+zvuk se voraji spolu kazdy snimek, uzivatelska tlacitka SELECT/HELP/atd. funguji dal).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
