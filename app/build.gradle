plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 331
        versionName "EMU10-B285-ZVUK-PREDSTIH-OREZAN"  // Rene po B284: "furt
        // zahlcuje... pri nastartovani apky self test funguje bez lagu, ale
        // po csave se to postupne zacne zase zahlcovat a po dalsim spusteni
        // self testu se zacne totalne rozjizdet zvuk od grafiky... projed si
        // kod - projed si internet a hlavne pamatuj toto emu atari ciste c++."
        // NEJPRV OVERENO, NE ODHADNUTO: napsan novy CLI test
        // (test_b285_rychlost_pred_po_csave.cpp) merici SKUTECNY wall-clock
        // cas jadra na 2000 snimku pred/po 3x CSAVE - pomer 1.005-1.015x
        // (opakovane mereno), tedy C++ jadro NENI po CSAVE pomalejsi. Take
        // provereno (grep) - v nap_atari_machine.h nejsou zadne STL
        // kontejnery (vector/map/string/deque/list), takze tam neni kam by
        // mohla C++ pamet "zahlcovat". PRICINA je v JS prehravani
        // (index.html): atariKonzole()/atariHelp() (SELECT/START/OPTION/HELP
        // - presne tlacitka pro ovladani self-testu) posilaji od B284 davku
        // az 42 snimku zvuku NARAZ a "volej()" ji hned cele preda do fronty.
        // "dalsiZvukStart" (kdy se ma prehrat DALSI kousek) nemel ZADNY
        // strop - kazdy stisk tlacitka ho posunul o dalsich ~0.84s DAL DO
        // BUDOUCNA, i kdyz realny cas mezitim sotva uplynul. Obraz se ale
        // porad kresli OKAMZITE (na fronte zvuku vubec nezavisi) - takze po
        // par stiscich pri prochazeni self-testu uz bylo naplanovano
        // nekolik vterin zvuku dopredu = presne "zvuk ujizdi od obrazu", a
        // cim delsi test (vic stisku), tim vic "zahlcovani", protoze fronta
        // jen rostla, nikdy se sama neoriznyla (zkraceni existovalo jen pro
        // OPACNY pripad - podtekani/kousani, BUILD2SB64). CSAVE samo o sobe
        // zadnou frontu nehromadi (bezi po snimcich pres hlavni smycku,
        // B272/B281) - jen MUSI spolknout frontu z mackani tlacitek kolem
        // sebe. OPRAVA: strop na to, o kolik smi byt zvuk naplanovany pred
        // aktualnim casem prehravace (MAX_PREDSTIH_S=1.2s, vic nez
        // nejvetsi jednorazova davka ~0.84s, aby se jeden stisk sam o sobe
        // nikdy neoriznul). Pri prekroceni se vse za stropem (jeste
        // nezacalo hrat) zastavi a fronta "zkrati" zpatky blizko k "ted".
        // OVERENO simulaci v Node (test_b285_js_fronta_zvuku.js - Node nema
        // Web Audio API, takze tohle overuje LOGIKU naplanovani, ne
        // skutecny zvuk z reproduktoru): 20 stisku po 0.3s BEZE stropu ->
        // predstih narostl na 10.8s; STEJNA posloupnost SE stropem ->
        // predstih zustal pod 1.1s (6x orezano); bezne pomale pouzivani (1
        // stisk/2s) stropem vubec nedotceno (0 orezu); jeden jediny stisk
        // nikdy sam o sobe neorizne (0.84s<1.2s). Cela existujici C++ sada
        // (B282 10/10 + 7/7, B283 6/6) beze zmeny prochazi dal - do jadra
        // ani do Java/JNI vrstvy se tentokrat vubec nesahalo, cela oprava je
        // jen v JS prehravani (index.html). NEOVERENO JESTE skutecnym
        // poslechem: zda je prechod pri orezani fronty slyset jako jemne
        // "cvaknuti" (ocekavatelne a v poradku - lepsi nez vteriny zpozdeni)
        // nebo zda je potreba to jeste vyhladit.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
