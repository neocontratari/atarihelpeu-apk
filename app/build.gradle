plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 292
        versionName "EMU10-B246-SEGA-IKONY-PROHOZENY"  // Rene psal navod pro zacatecniky k PS1/Sega (Partak vytvoril 2 PDF) - pri psani vysvitlo, ze SBIRKA ma ikonu KNIHOVNY/POLICKY (= "moje uz mam"), zatimco HRY ma ikonu JEDNE KAZETY (= "vloz jednu konkretni hru") - presne OBRACENE nez odpovida funkci (SBIRKA = stahni NOVOU hru z webu, HRY = MOJE stazena knihovna). Rene: "to je moje slepota, kterou sem nevidel." Opraveno primo v obrazku (sega_megadrive_screen.png) - vyrizeny jen HORNI cast kazdeho tlacitka (ikona, ne popisek "SBIRKA"/"HRY" pod ni) a prohozeno mezi sebou, cisty rez bez viditelnych svu (najit primo v datech pixelu tmavou mezeru mezi ikonou a textem). Zadna zmena kodu/textu/funkce tlacitek - jen ktera ikona je nad kterym popiskem.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
