plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 305
        versionName "EMU10-B259-PS1-DOOM-DIAGNOSTIKA"  // Rene: "podivej se jeste na ps1 a oprav to - ta hra doom a rozsypana grafika me opravdu vydesila." DUKLADNE prozkoumano (vendor PCSX-ReARMed gpu-gles plugin, gpulib_if.c) - nalezeno: promenna nap_disp_interlace (GP1 08h bit 5) se ZAPISUJE a LOGUJE, ale NIKDE NEOVLIVNUJE samotne vykreslovani - komentar primo v kodu to priznava ("jen diagnostika; kreslime vzdy progresivne v plne vysce"). To je silny kandidat na pricinu Doom rozsypane grafiky (prokladany rezim se ignoruje). ALE: na rozdil od Atari (ciste C++, jde zkompilovat a spustit bez telefonu) je tenhle OpenGL/Android render kod NEOVERITELNY v tomhle sandboxu - zadne GPU, zadny Android build retez. Misto NEOVERENEHO hadani (presne to, z ceho se Rene "vydesil" u puvodni formulace "obchazime to") pridana CILENA DIAGNOSTIKA: (1) novy vzdy-se-spousti log pri KAZDE zmene interlace bitu (predtim se logoval jen kdyz SOUCASNE zmenilo i RGB24 - ridke, snadno prehlédnutelne), vc. autoritativnich gpu.screen.vres/hres/src_y z jadra. (2) opraveno pocitadlo VRAM-upload logu, ktere se drive vycerpalo (prvnich 40 CELKEM) uz behem BIOS/menu obrazovek, driv nez Doom vubec zapnul interlace behem hrani - ted ma SAMOSTATNYCH 40 logu specificky PRO DOBU, kdy je interlace aktivni. Zadna zmena vykreslovaci logiky - cisté pridani diagnostiky, nizke riziko. DALSI KROK: Rene spusti Doom, posle log - z BUILD2SB66 radku uvidime jistotou, jestli Doom interlace vubec zapina a jakou vysku jadro hlasi, a pak jde opravit s jistotou misto hadani.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
