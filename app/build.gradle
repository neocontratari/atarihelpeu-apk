plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 324
        versionName "EMU10-B278-CSAVE-DVOUTON-KANALOVE-PREPINANI"  // Rene poslal SKUTECNOU nahravku (wav, 27.5s) realneho Atari CSAVE zvuku - "prosim te prestan odhadovat." Analyzoval jsem SUROVA PCM DATA primo (autokorelace pro presne frekvence, ne odhad ci poslech): behem "piskotu" appka strida MEZI 594.0 Hz A 5278.0 Hz - OBROVSKY skok, ne mala odchylka jak predpokladal predchozi (B276) "pulena perioda" pristup. 594.0 Hz PRESNE odpovida spojenemu kanalu 3+4 (audf3=204,audf4=5 -> 594.7Hz vypocteno). 5278.0 Hz PRESNE odpovida SAMOSTATNEMU kanalu 1 (audf1=5, standardni delic 28 -> 5278.1Hz vypocteno) - SHODA NA DESETINY Hz, potvrzuje mechanismus s vysokou jistotou. Behem "datoveho toku" autokorelace ukazala RYCHLE stridani 565/4009 Hz - STEJNY mechanismus (dva nezavisle kanaly), jen prepinany bit po bitu misto zridkavych bloku v piskotu. ZAVĚR: skutecny POKEY dvoutonovy obvod NEMENI periodu jednoho kanalu (B276 "pulena perioda" pristup byl SPATNY, kompletne prepracovan) - PREPINA, KTERY ZE DVOU NEZAVISLE BEZICICH OSCILATORU (kanal 1 samostatne VERSUS kanal 3+4 spojene) je "pripojen na vystup", jako multiplexer/gate. Oba oscilatory beží CELOU DOBU na svych nezmenenych frekvencich - meni se jen HLASITOST/GATING. IMPLEMENTOVANO: zapisUsekSDvoutonem() ted pro kazdy bit vytvori docasnou audc kopii - bit=1 necha znit jen kanal 1 (kanaly 2/3/4 ztlumeny), bit=0 necha znit jen spojeny kanal 3+4 (kanaly 1/2 ztlumeny) - audf zustava po celou dobu nezmenene. OVERENO: novy cilený test primo overuje namerene frekvence (bity 0-8 v testovacim bajtu $00 -> 595.9Hz, bit9/stop -> 5512.5Hz) - obe v ocekavanem rozmezi zmerenem ze skutecne nahravky. Vsech 9 predchozich testu prochazi beze zmeny. CLOAD regrese-test (ERROR 138) potvrzen beze zmeny. Obrazovka spravne konci READY. Kompletni prekompilace nap_atari_native.cpp, zavorky vyvazeny. POCTIVE: Rene take zminil, ze pocatecni bootovani ted trva o neco dele (vedlejsi efekt drivejsich zmen, oznaceno Renem jako mensi problem) - NEZKOUMANO v tomto kole, zustava pro pristi.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
