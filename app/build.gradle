plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 281
        versionName "EMU10-B235-SEGA-GREEN-HILL-ZONE"  // Rene: "PS1 uzavrena, ted Sega - totez, ale barevne jinak, at ladi se Sonicem. Pozor na START - dolu doprostred, at se neprekryvaji pozice." Stejny princip jako u PS1 (B221-B234): nova AHSega.segaPlochaVisible() (sega nema zOrderOnTop, staci ciste setAlpha, zadna slozitost navic), sdilene #segaNebula pozadi (modra obloha/zelene kopce/zlate Sonicovy prsteny misto planet/rychly pruh misto meteoru), sklenene panely, nadpisy+tlacitka podle Sonicovy palety (zelena=potvrdit,modra=zavrit,zlata=vedlejsi). START presunut z prava-nahore na stred-dole (left:50%;transform:translateX(-50%);bottom:1.8vh), zarovnan se stejnou spodni hranou jako D-pad/sloupec A/B/C - uprostred mezi nimi, nic neprekryva. Rovnou zabudovana poucka z PS1 B234 - layoutEditEnter() hned vypina segaNebulaOn, aby vesmir nezakryl D-pad behem editace.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
