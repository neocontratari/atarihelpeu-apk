plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 279
        versionName "EMU10-B233-POPREDI-BARVY-PS1"  // Rene: "pozadi mame, ted si pohraj s popredim - u pisma men barvu, obdelniky taky muzou hrat barvama PS1, neboj se toho." Nadpisy panelu ted kazdy jina skutecna barva PS1 tlacitka (D-PAD/OVLADANI=zelena trojuhelnik, CD/ISO=modra krizek, SMAZAT HRU=cervena kolecko, MEMORY CARD=fialova ctverec) - na prvni pohled poznat, kde jsi. Tlacitka podle role: potvrdit/pokracovat=zelena, zpet/zavrit (nova trida .zavrit)=modra, vedlejsi=fialova, nebezpecne=cervena (uz existovalo). Popisky ve OVLADANI (Citlivost/Pruhlednost/Velikost tlacitek/Velikost D-padu) kazdy jina barva misto jednotne azurove. DULEZITE: pri vkladani novych .panel button pravidel vznikly docasne DUPLICITNI CSS selektory (stare rezimy jeste v souboru) - hned zachyceno kontrolou a smazano, cisty vysledek.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
