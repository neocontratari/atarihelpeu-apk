plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 313
        versionName "EMU10-B267-ATARI-SKUTECNY-TON-REPRODUKTORU"  // Rene: "je to jednoduche proc prvni Return nic nespusti... je to upozorneni pro uzivatele. Nehledej za tim nic sloziteho... nebud liny a nehadej. U atari nestrim zadny fake." Presne podle rady dukladne PROTRASOVANO (ne odhadnuto) - appka SPRAVNE prochazi "pipaci" smyckou v ROM ($FE00-$FE36 - rychle opakovane prepinani GTIA CONSOL bit3/reproduktor, presny stejny mechanismus jako klik pri bootu) hned po prvnim RETURN. Jadro NEBYLO rozbite v logice prikazu. SKUTECNA PRICINA: genAudio() se volala JEDNOU ZA SNIMEK a kontrolovala jen "je bit ted jiny nez naposledy", ale ROM smycka prepina bit MNOHOKRAT BEHEM JEDNOHO SNIMKU (tón, ne jednotlivy klik) - vzorkovani jen na konci snimku ztratilo VSECHNY mezilehle prechody, zustal jen posledni stav. OPRAVA: kazdy zapis do CONSOL bit3 se ted zaznamena s presnym CPU cyklem (ne jen posledni hodnota) - genAudio() pak zpracuje VSECHNY zaznamenane prechody na jejich spravnych pozicich uvnitr bufferu (vola pokeyGenSamples po castech mezi prechody, misto jednou pro cely buffer), presne tak, jak uz existujici per-vzorkova dozvukova logika (spkLevel/spkDecay, nezmenena) ocekava. OVERENO: (1) izolovany test - 20 rychlych prechodu v jednom bufferu -> 20 spravnych zmen znamenka ve vystupu (predtim by to bylo 0 nebo 1). (2) beze zmeny chovani pro puvodni pripady - ticho zustava tiche, jednotlivy klik (boot) stale spravne dozni behem 4096 vzorku, navaznost mezi opakovanymi volanimi genAudio pres vice snimku funguje. (3) END-TO-END test se SKUTECNOU ROM, presne stejnym volanim jako produkcni kod (genAudio jednou za snimek) - po CSAVE+RETURN je nyni SKUTECNA zvukova energie detekovana v 52 z 90 snimku (predtim 0). Vsech 10 testu (6 puvodnich + 4 nove) prochazi. Cely nap_atari_native.cpp zkompilovan cistě.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
