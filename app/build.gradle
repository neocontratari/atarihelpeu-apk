plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 285
        versionName "EMU10-B239-SEGA-PLOCHA-ODCHOD"  // Rene: "hra se po loadu kousne, mas prekryvani canvasu do vsech vyberu - udelej poradnou kontrolu a nachystej si log." NALEZENO BEZ CEKANI NA LOG - dukladnou kontrolou existujiciho kodu: stopNativeInPlaceHard() (vola se pri KAZDEM odchodu ze Segy - hlavni nabidka, prechod na PS1...) zastavila jadro a uklidila STAROU/mrtvou cestu (nativeInPlaceView), ale SKUTECNOU plochu (segaPlocha, na kterou jadro kresli od B117) se NIKDY nedotkla - zustavala pripojena k rootFrame s alpha=1, ukazovala POSLEDNI ZAMRZLY SNIMEK ze Segy uplne nezavisle na tom, kam appka dal navigovala. DALSI NALEZENA MEZERA: plochaHlidac (300ms watchdog, bezpecnostni sit pro presne tenhle druh problemu) startoval JEN z PS1 kodu (ps1GlEnable) - pri hrani jen Segy (bez PS1 v te relaci) vubec nebezel, zadna periodicka pojistka. OBOJI OPRAVENO: stopNativeInPlaceHard() ted segaPlochu schova a odpoji (stejny vzor jako ps1GlDisable), plochaHlidacStart() ted startuje i ze segaPlochaZapni(). Rozsirene logovani (stranka= v hlidaci, SEGA_PLOCHA_ODPOJENA_PRI_ODCHODU) pro pripad, ze tohle nestaci - priste bude v logu presne videt co se delo.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
