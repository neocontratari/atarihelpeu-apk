plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 312
        versionName "EMU10-B266-PS1-VICESTOPE-CUE-OPRAVA"  // Rene: "tato hra je skladana z nekolika souboru, ne jen z jednoho. Mate me na tom, ze duke nuke 3d funguje bez problemu." Skutecne konkretni nalez, ne diagnostika: appka ma kod na SYNTEZU .cue souboru pro vicestope CD bez vlastniho .cue (BUILD2SA7, _ps1_synth.cue - presne to, co bylo videt v Reneho logu). NALEZENA SKUTECNA CHYBA: stopy se radily OBYCEJNYM abecednim porovnanim retezcu - "track10.bin" abecedne predchazi "track2.bin" (znak '1' < '2'), takze u her s 10+ audio stopami (PS1 Doom ma CD soundtrack, na rozdil od PC verze s MIDI - presne to by vysvetlilo, proc Duke Nukem 3D s min. stopami funguje a Doom ne) by se stopy zaradily do syntetizovaneho .cue ve SPATNEM POREADI - hra by pak z spatne oznacenych/adresovanych stop cetla spatna data. OPRAVA: pridana funkce "prirozeneho razeni" (cisla uvnitr nazvu se porovnavaji jako cisla, ne jako text) - STANDARDNI technika presne pro tenhle problem. Skutecne ZKOMPILOVANO A SPUSTENO (Java 21 primy beh zdrojoveho souboru, java TestRazeni.java) - potvrzeno ze stare razeni SKUTECNE selhavalo (track10 pred track2) a nove ho opravuje spravne, vc. cisel s nulami na zacatku (track01/track02). Navic pridan standardni 2-vterinovy pregap pred audio stopy (Red Book CD-DA norma) - TOHLE JE MENSI JISTOTA (zavisi na tom, jestli extrahovane .bin soubory pregap uz obsahuji nebo ne, coz nejde odsud overit) - nejhorsi mozny dusledek chyby je 2s posun/zmena zvuku, ne poskozeni dat, takze riziko je omezene. Zadna zmena Atari souboru. Dalsi krok: Reneho test s vicestopou hrou (Doom) ukaze, jestli tohle poradek/pregap byla skutecna pricina, nebo jen soucast problemu.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
