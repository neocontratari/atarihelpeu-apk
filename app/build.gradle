plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 295
        versionName "EMU10-B249-ATARI-POKEY-ZVUK-FAZE1"  // Rene: "pokracujeme podle tveho planu, nachystej co a jak jako doposud." FAZE 1 z navrzeneho postupu: POKEY zvuk, presny preklad z Reneho fungujici JS reference (emu_vbxe/index.html, poly4/5/9/17 generatory sumu, stejne bity AUDCTL, stejny vzorec periody kanalu, stejny DC-blocker) - novy soubor nap_atari_pokey.h. Registry AUDF[4]/AUDC[4]/AUDCTL pridany do nap_atari_machine.h (zapis $D200-$D208), STIMER resetuje citadla kanalu. OVERENO SKUTECNOU KOMPILACI A BEHEM (ne jen "melo by fungovat"): izolovany test proti realnemu Machine - ticho pri vol=0, cisty ton na 0.4% presne podle vzorce, zadne NaN/Inf, STIMER funguje, volume-only (digi) rezim generuje vystup. Cely nap_atari_native.cpp (vcetne nove funkce audioNative - PCM16 base64 + statistika spicka/RMS) zkompilovan cistě s JNI stub hlavickou. Java strana: audioSafe() wrapper + atariAudio() bridge metoda s logovanim (jen statistika, ne velky base64 naklad). JS: nove tlacitko "PREHRAT ZVUK" na testovaci strance - precte skutecny vygenerovany zvuk a prehraje ho pres Web Audio API, zadne predstirani.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
