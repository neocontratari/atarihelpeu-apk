plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 272
        versionName "EMU10-B226-VRSTVA-CITLIVE-SCHOVANI-A-GRAFIKA"  // Rene: "na sirku hned, na vysku ne - i hra po nabootovani se na vysku neukaze." Pricina: setAlpha() (B224) spolehlive funguje jen kdyz je plocha POD strankou (landscape, zOrderOnTop=false) - v portraitu (NAD strankou, zOrderOnTop=true) je to zvlastni hardwarova vrstva, kde alpha casto vubec nepusobi. Nova plochaAplikujViditelnost() voli SPRAVNY nastroj podle aktualni vrstvy - setAlpha pro landscape (cisty, bez destroy/create), setVisibility pro portrait (jedine co tam spolehlive funguje). Navic pridan viditelny indikator "NAHRAVAM HRU... Xs" primo v monitoru (ne jen bublina), a grafika panelu prepracovana na SKUTECNE vzorkovane barvy z Reneho vlastniho screenshotu MAIN MENU obrazovky (tmava navy #000120 + modry ram #4650b7), ne dalsi vymysl.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
