plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 330
        versionName "EMU10-B284-KONZOLE-ZVUK-VYPADKY"  // Rene po proslechu B283 na telefonu (log priloha): "v self
        // testu ti ujizdi grafika od zvuku - zvuk je uz cisty - mozna furt
        // lagy??" a pak "pri delsim testu se opravdu zacne emu c++ atari
        // lagovat a zahlcovat se... je tam proste neco furt spatne."
        // PRICINA (nalezena primo v kodu, ne odhadnuta): atariKonzole()
        // (SELECT/START/OPTION) a atariHelp() (MainActivity.java) drzely
        // tlacitko pres 42 snimku (12+30) BEZE VSEHO volani genAudio() -
        // presne ta stejna nemoc, co BUILD2SB79/80 uz davno opravily u
        // psani textu/self-testu-pres-BYE/bootu (viz
        // srovnatSledovaniZvuku() v nap_atari_machine.h a komentar u
        // BUILD2SB64 "v self testu se to kouse" v index.html - ZVUK_POD-
        // TEKANI pocitadlo tam uz existovalo, ale jen MERILO problem, ne
        // ho resilo). Primo v Reneho logu: pocitadlo vypadku leze na 13 a
        // pak PRESNE pri "KONZOLE:start" (vstup do self-testu) vyskoci na
        // 178 - 165 novych ~200ms der najednou. OPRAVA: novy
        // consolSetNative() (jen DRZI masku, bez automatickeho beh/pusteni)
        // + Java strana ted pouziva uz overeny vzorec
        // zachytitCsaveZvukSafe() (stejny jako atariDoSelfTestu) - zvuk z
        // celeho useku SELECT/START/OPTION/HELP uz dojde do JS poctive,
        // misto aby se tise ztratil. OVERENO: novy CLI test (6/6) potvrzuje
        // spravny pocet zachycenych vzorku (drive 0) a ze CPU/konzole stav
        // zustavaji v poradku; cela existujici sada (B282 10/10 + 7/7)
        // beze zmeny prochazi dal - zadny zasah do jadra, jen do Java/JNI
        // vrstvy volani zvuku. NEOVERENO JESTE: jestli tohle vysvetluje
        // CELE Reneho "zahlcovani" pri delsim testu, nebo jestli jde o
        // opakovane vypadky pri kazdem stisku tlacitka behem navigace v
        // self-testu (ktere by takhle zmizely) - pozadano o znovu-otestovani
        // delsiho behu po teto oprave.
        // vani primo do tohoto repa (misto jen zipu v chatu, kvuli 30MB limitu
        // na odesilani souboru) - tohle je PRVNI build pushnuty touhle novou
        // cestou, na Reneho vyslovnou zadost "udelej balicek s nejakou malou
        // zmenou a pusni to sam, at se podivam jak to dopadlo." ZMENA: pri
        // hledani vhodne male zmeny jsem si overoval vlastni komentar z B282 u
        // 50s zalozni pojistky v zahajNahravani() (index.html) - tvrdil
        // "zmereno ~28s pro 100radkovy program". PO KONTROLE to NEBYLO
        // skutecne zmereno - CLI test (i produkcni zaraditText/kbcodeJs,
        // ktere kopiruje) umi psat jen pismena/mezeru/RETURN, cislice
        // radkovych cisel by v nem zmizely, takze zadny skutecny 100radkovy
        // ulozeny program takhle nikdy nevznikl. OPRAVA: komentar prepsan na
        // pravdive tvrzeni (skutecne zmereno je jen CSAVE minimalniho
        // programu, ~24s) - zadna zmena CHOVANI, jen oprava nepravdiveho
        // tvrzeni v komentari, presne v duchu "neodhadovat, overovat", co
        // plati i pro moje vlastni drivejsi poznamky.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
