plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 300
        versionName "EMU10-B254-ATARI-CSAVE-CLOAD-TEXT"  // Rene: "po napsani CSAVE nebo CLOAD a odmacknuti RETURN Atari udela specificky potvrzovaci zvuk (tu tu), driv nez kazetak vubec neco dela - kazetak tam vubec nehraje roli, je to prikaz, po kterem Atari zvukem oznamuje, ze je pripraveno." Zkontrolovano: cela abeceda A-Z uz byla v kbcode() KOMPLETNI (ne jen B,Y,E jak jsem si drive myslel) - overeno PROGRAMOVE (ne okem), extrahovana skutecna tabulka z JS reference (var KEY={...}) a porovnana se vsemi 26 hodnotami v Jave - presna shoda na celou abecedu. Chybela jen MOZNOST napsat cokoli jineho nez napevno "BYE" - pridana obecna atariNapisText(text) (Java) + tlacitka NAPSAT: CSAVE / NAPSAT: CLOAD + volny text vstup na testovaci strance. Zadna zmena POKEY generovani zvuku ani GTIA klik mechanismu (B253) - tohle je jen umoznit RENEMU dostat se k prikazu, ktery uz existujici mechanismus (BASIC pise do POKEY/GTIA, appka to prehraje) by mel spravne ozvucit uplne stejne jako self-test. Overeno: MainActivity.java hloubka zavorek 0 (chytry kontrolor), TV cesta 0 chyb, nova jsdom simulace (3 kontroly - CSAVE/CLOAD tlacitka volaji spravnou funkci, vlastni prikaz se posila velkymi pismeny a pole se vyprazdni).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
