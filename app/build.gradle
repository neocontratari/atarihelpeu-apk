plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 293
        versionName "EMU10-B247-PS1-NACTENI-RYCHLE-POZICE"  // Rene: "kdyby save game po nacteni nabehl presne do toho mista, jak to ted dela Sega - bonus pro ty, co hraji o pauze v praci. Jde o to, jestli to dokazes udelat, aby sis neporusil funkcni PS1 - tohle rozhodnuti nechavam na tobe." NIZKORIZIKOVE reseni: ps1QuickLoad() UZ CELY EXISTOVAL, na obou stranach (Java i JS, vcetne toastu 'SAVE STATE nacten' a logovani) - byl uz i PER HRU (ps1StateFile() pouziva ps1CurrentGameLabel), presne jako Sega. Jen na nej NIKDY nevedlo zadne tlacitko. Misto zasahu do hlavniho radku peti fungujicich tlacitek dole (RESET/MEMORY CARD/CD-ISO/LOAD GAME/SAVE GAME) pridano jedno nove tlacitko "NACIST RYCHLOU POZICI" do jiz existujiciho D-PAD A OVLADANI panelu (vedle UPRAVIT ROZLOZENI/OVLADANI/PROHODIT) - nulove riziko pro existujici funkcni UI. Zadna zmena ukladaciho mechanismu, cesty ani formatu - jen pripojeni JIZ HOTOVE funkce. Overeno vsemi 8 existujicimi PS1 testy (beze zmeny presly) + novy test primo na nove tlacitko (4 kontroly: SAVE beze zmeny funguje, tlacitko existuje ve spravnem panelu, klik zavola ps1QuickLoad, ostatni tlacitka panelu nedotcena).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
