plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 273
        versionName "EMU10-B227-RESET-A-PRUHLEDNOST"  // Rene: RESET tlacitko musi fungovat jako vytazeni CD - hra se zastavi, nabehne BIOS bez disku. Nova ps1Reset() (JS-volatelna) spoji dve uz existujici bezpecne veci presne v poradi: stopPs1SessionHard (stejna cesta jako pri odchodu ze stranky) + ps1MaybeStartBios (uz sama hlida, ze nespusti nic dokud neni jadro uplne dole) - zadna nova nizkourovnova logika. RESET ted ukazuje stejny odpocet/indikator v monitoru jako spusteni hry z knihovny, jen s vlastnim popiskem "Resetuji". Dale: novy rychly prepinac "Pruhledny ovladac" v OVLADANI panelu vedle stavajiciho jemneho posuvniku pruhlednosti - zaskrtnuti/odskrtnuti nastavi 30%/100% a synchronizuje se s posuvnikem obema smery.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
