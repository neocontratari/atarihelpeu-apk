plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 282
        versionName "EMU10-B236-SEGA-ULOZENI-POZICE"  // Rene: "dalo by se vymyslet ukladani her, jako treba Sonic? Osobne si myslim ze asi nejde, ale ptam se." ANO JDE TO - jadro ClownMDEmu uz melo VESTAVENOU ClownMDEmu_SaveState/LoadState (cely snimek stavu - CPU, VDP, zvuk...), jen ji appka dosud vubec nepouzivala. Neni to oficialni SRAM ulozena pozice (tu ma jen par her jako Sonic 3, jen na povolenych mistech) - je to univerzalni "save state" jako u emulatoru, funguje na KTEROUKOLI hru KDEKOLI. OVERENO SKUTECNOU KOMPILACI A BEHEM: zkopirovana realna hlavicka+vsech 24 zdrojovych souboru jadra + oba CPU interpretery, zkompilovano a slinkovano mimo appku, ClownMDEmu_SaveState/LoadState + fwrite/fread cele 1132728-bajtove struktury overeno skutecnym behem (test_sega_state_types.cpp), ne jen "melo by fungovat". KRITICKA BEZPECNOST: buffer je STATICKY/GLOBALNI (g_sega_state_backup), NIKDY lokalni promenna - stejna opatrnost, jakou uz soubor ma pro g_real (>1MB, "muze pretect stack"). Nove AHSega.segaSaveState()/segaLoadState() (appce-privatni jeden spolecny slot - zadna knihovna jako PS1, appka pro Segu zatim zadnou nema), nova tlacitka ULOZIT POZICI VE HRE / NACIST ULOZENOU POZICI v D-PAD panelu.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
