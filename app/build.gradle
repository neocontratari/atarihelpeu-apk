plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 318
        versionName "EMU10-B272-ATARI-ZVUK-OBRAZ-SYNC"  // Rene testoval B271 na realnem telefonu: "zvuky jsou lepsi nez Java, ciste, ale je tam hrozne zpozdeni 5-15s - obraz uz je hotovy (READY, kurzor), zvuk hraje az pozdeji - a tak to mas u vseho ted." SKUTECNA PRICINA: B271 opravila "zvuk se zahazuje" tim, ze zacala zvuk PRUBEZNE ZACHYTAVAT behem velkych synchronnich bloku (psani textu, self-test vstup, boot) - ale porad delala CELY blok (stovky snimku) BLESKOVE v jednom volani a vratila HOTOVY obraz OKAMZITE, zatimco zachyceny zvuk (nekolik SIMULOVANYCH vterin) se pak musel prehrat REALNOU rychlosti (zvuk nejde zrychlit) - vznikla fronta "zvuku z minulosti" dohanejici uz hotovy obraz. Cim vic takovych bloku, tim vetsi zpozdeni (presne 5-15s pozorovanych po nekolika akcich za sebou). SKUTECNA OPRAVA (architekturni, ne zaplata): misto zvlastnich "velkych bloku" appka ted KAZDY stisk klavesy (psani CSAVE/CLOAD/vlastni prikaz, RETURN, BYE pro self-test, i cely boot) zpracovava PRESNE stejnym zpusobem jako normalni beh - jeden snimek najednou, v prirozenem tempu hlavni JS smycky (smyckaTik), stejne jako drzeni START/SELECT. Nova JS fronta klaves (frontaKlaves) - kazdy znak/RETURN se zaradi jako sekvence poloz. ve fronte, kterou hlavni smycka odbavuje PO JEDNOM za tik, PRESNE synchronne s obrazem i zvukem (oboji vznika ZAROVEN, snimek po snimku, zadna fronta k dohaneni). KRITICKA TECHNICKA POJISTKA (overeno testem, ne predpokladem): jadro (klavesa()) pri KAZDEM volani ZNOVU vyvolava preruseni klavesnice (IRQ) - kdyby fronta poslala stejny kod 8x (jednou za drzeny snimek), appka by to videla jako OSM SAMOSTATNYCH stisknuti mist jednoho drzeneho. Oprava: kod se posila jen NA PRVNIM snimku drzeni, zbylych 7 snimku se jen bezi dal (-1 = nesahat na klavesnici, klavesa zustane "drzena" sama od sebe, presne jako drzeny prst). Primo testem overeno, ze opraveny vzor vyvola IRQ presne 1x, stejne jako puvodni pristup (8x klavesa() by bylo 8 IRQ - presne to se NEdeje). Boot a RESET ted take NEBEZI stovky snimku najednou - jen resetuji stroj (bleskove, bez zvuku) a hned spusti/pokracuji normalni smycku, ktera zbytek (OS test pri startu atd.) odehraje prirozenym tempem presne jako cokoli jineho - "dlouhy boot zvuk" by ted mel hrat SOUCASNE s tim, jak se obraz meni, ne az pozdeji. VYJIMKA: atariCsaveDoWav (export do WAV souboru) ZUSTAVA jako "velky blok" schvalne - jde o export na pozadi, ne o zive sledovanou akci, zpozdeni mezi obrazem a zvukem tam nikoho nerusi (nic se v tu chvili neprehrava naziv). OVERENO: vsech 12 predchozich testu prochazi beze zmeny + 3 nove testy (presne porovnani poctu vyvolani IRQ mezi starym a opravenym vzorem - identicke, 1x; kompletni end-to-end simulace nove architektury pro CSAVE - zvuk pritomen prubezne, motor spravne zapnuty po 2. RETURN, zadna zmena v zakladni logice). Kompletni prekompilace nap_atari_native.cpp i MainActivity.java, oboji zavorky vyvazeny.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
