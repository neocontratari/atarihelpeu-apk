plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 316
        versionName "EMU10-B270-ATARI-ZVUK-DRIFT-OPRAVA"  // Rene testoval B269 na REALNEM telefonu: "nejde zvuk pri nabootovani, nejde zvuk pri csave/cload pipnuti, self-test zvuk pomaly, RESET zni jako cold hard reset." ALE potvrdil: CLOAD ERROR 138 logika FUNGUJE SPRAVNE (jen trva dele nez 54s - telefon nebezi presne v mem CLI testovacim tempu). NALEZENA SKUTECNA PRICINA vsech audio hlaseni: genAudio() (B267/B268) pocitalo pozici prechodu v bufferu vuci "audioCyklusPocatek" - AKUMULATORU, ktery se KAZDYM volanim jen PRICITAL o "n*cyklu_na_vzorek" v predpokladu, ze presne tolik CPU cyklu SKUTECNE uplynulo od minuleho volani. V CLI testu (genAudio volano PRESNE 882 vzorku PRESNE jednou na kazdy runFrame()) tenhle predpoklad platil dokonale. Na REALNEM zarizeni JS smycka vola audioChunkNative() s velikostmi podle SKUTECNE ubehleho casu (Web Audio API scheduling), NE podle pevneho poctu snimku - drobne odchylky se KAZDYM volanim SCITALY (drift), az zaznamenane prechody vypocitane vuci timhle "ujizdejicim" pocatkem vysly MIMO aktualni buffer a orezavaci pojistka je vsechny namackala na kraj bufferu misto spravneho umisteni - presne to by vysvetlilo "zadny zvuk" (namacknuty na okraj = bud nic, nebo jeden nesmyslny bzukot na kraji, ne skutecny tón). OPRAVA: NEAKUMULOVAT nic - pocatek KAZDEHO bufferu se ted pocita VZDY ZNOVU primo z aktualniho cpu.c.cycles (jedine vzdy spravne, autoritativni cislo pro "kde jsme ted"), ne z odhadu postaveneho na predchozich volanich. Zadny drift nemuze vzniknout, protoze se nikdy nic nesklada z minulosti - kazde volani je nezavisle spravne. OVERENO: (1) vsech 6 puvodnich + 4 predchozi testy prochazi beze zmeny (jeden test musel byt upraven - simuloval nerealisticky scenar "zapis pri cyklu=0, hned genAudio bez uplynuti casu", coz v NOVEM spravnem modelu umisti klik na konec bufferu misto zacatku - opraveno na realisticky scenar s uplynutim casu). (2) NOVY test specificky simulujici REALNE, NEPRAVIDELNE casovani (1-3 snimky najednou, velikost bufferu nahodne 800-950 vzorku misto pevnych 882 - presne ten druh nepravidelnosti, co CLI test nikdy nemel a realny telefon ma vzdycky) - zvuk detekovan ve VSECH 90 sledovanych "ticich", ne jen nekdy. POCTIVE: TOHLE NEOPRAVUJE (1) self-test zvuk/rychlost - to je oddelena vykonnostni otazka, jeste nezkoumana (2) CSAVE chybejici zaverecnou "uvodni stopu" typicky zvuk pri dokonceni - jeste nezkoumano (3) attract mode (zmena barev) nefunguje v PRAXI na telefonu i kdyz CLI test (izolovane, bez realneho casovani) ukazal spravne chovani po ~11 min - pravdepodobne souvisi se stejnou vykonnostni otazkou (self-test pomaly = appka bezi pomaleji nez 50fps na realnem HW, takze 11 minut "atari casu" trva podstatne dele nez 11 minut realneho casu). Vsechny tri zustavaji pro pristi kolo.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
