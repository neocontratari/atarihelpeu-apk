plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 257
        versionName "EMU10-B211-LEVAK-DIAGNOSTIKA"  // Rene: PROHODIT D-PAD A AKCE (LEVAK) bylo v B209 mrtve tlacitko. Kod, zapojeni i logika jsou stejne jako u UPRAVIT ROZLOZENI/OVLADANI (ty fungovaly), simulace projde cisto - pricinu jsem staticky nenasel. V Reneho vlastnim logu z B209 neni ANI JEDEN radek LAYOUT_MIRROR, takze klik ocividne vubec nedosel do JS. Pridal jsem jsLog('LAYOUT_MIRROR_TAP') hned na zacatek click handleru - pri dalsim testu z /8765/log poznam, jestli se to ted spusti vubec, nebo az uvnitr funkce. Tlacitko je navic ted v B210 v uplne novem, kratsim panelu (bez rolovani pres velky log textarea a spoustu jinych tlacitek predtim) - mozna se tim problem vyresil sam.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
