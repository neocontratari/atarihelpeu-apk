plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 289
        versionName "EMU10-B243-NATIVE-IN-PLACE-NALEZENA"  // Rene: "ne nic neopraveno - ani zacatek - sega zadna zmena." Novy log odhalil SKUTECNOU pricinu prolinani obrazu, kterou jsem hledal od B235: appka ma DVE soubezne vykreslovaci cesty pro Segu - segaPlocha (SurfaceView, "SEGA_OBRAZ_PRIMO_ZAPNUT" - tuhle jsem resil celou dobu) A nativeInPlaceView (TextureView, "ENABLE_IN_PLACE"/"NATIVE_TEXTURE_FRAME_RV" - volana primo z JS pri KAZDEM vyberu hry pres startNativeCppInPlace->AHNATIVE.enableInPlace()). Log ukazal OBOJI FIRE SOUCASNE pro tutez hru - presne Reneho puvodni hypoteza "vsechny videa bezi vzadu, jen neco pousti", potvrzena. NativeInPlaceView JE ta skutecna, primarni plocha ("normalSegaUI=YES") - segaPlocha vedlejsi/starsi. Pridano schovavani NativeInPlaceView (setVisibility, TextureView normalni cast hierarchie) na vsech mistech, kde uz segaPlocha byla resena (segaPlochaVisible, 300ms hlidac). DALSI OPRAVA: "furt se to stahuje po reinstalaci i kdyz jsou v mobilu" - cesta k BIOS/Sonic souborum se ted zapamatuje HNED pri uspesnem stazeni (kdy appka JISTE VI, ze soubor existuje - prave ho zapsala), ne az dodatecnym prohledavanim adresare pres listFiles(), ktere appka sama v komentarich uznava jako nespolehlive na novejsim Androidu (Scoped Storage).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
