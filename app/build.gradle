plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 322
        versionName "EMU10-B276-CSAVE-DVOUTON-KODOVANI-DAT"  // Rene - "reset/power/self-test presne jak ma, CSAVE piska spravne, ale na konci pisknuti chybi to puvodni chrapteni - ten datovy zvuk." Rozsahle vysetreni: real-log ukazal appku hrajici KONSTANTNI tón (AUDF=[5,7,204,5]) po celych 42 vteřin, pak naráz ticho - zadna zmena behem "prenosu dat". OVERENO primo (Timer4 IRQ, typicky spojovany s bit-po-bitu prekreslovanim, je behem cele teto faze VYPNUTY - 0 vyvolani za 50s pozorovani) a v JS referenci (genericka POKEY syntéza audf/audc/audctl, ZADNA zminka o SKCTL/dvoutonovem rezimu/sériovem bitu v syntéze zvuku vubec) - zavěr: skutecny POKEY hardware v "dvoutonovem" rezimu (SKCTL bit3, drive primo overeno jako rozlisujici bit CSAVE/CLOAD) dela vyber mezi dvema frekvencemi SAM, v kremiku, podle AKTUALNIHO BITU v posuvnem registru sériovych dat - tenhle mechanismus v emulaci chybel uplne. IMPLEMENTOVANO: pri zapisu do SEROUT se ted naklada 10-bitovy sériovy ramec (start=0, 8 datovych bitu LSB prvni, stop=1), casovany podle 600 baudu. genAudio() ted deli buffer na useky podle hranic jednotlivych bitu a pro bit=0 pouzije dvojnasobnou frekvenci (polovicni periodu spojeneho 16-bit citace kanalu 3+4) - presne chovani realneho POKEY dvoutonoveho obvodu. Behem vyvoje odhaleno a opraveno METODOLOGICKE UPOZORNENI: prvni izolovany test davil "obracene"/matouci vysledky - pricina byla v samotnem testu (genAudio() pocita buffer jako "poslednich N vzorku KONCICICH ted", takze bez SPRAVNEHO posunuti CPU cyklu mezi nalozenim ramce a volanim genAudio() vysel cely buffer PRED zacatkem ramce). Po oprave testovaci metodiky primo overeno: pomer rychlosti prechodu nulou mezi bit=0 a bit=1 regiony = 1.91 (ocekavano ~2.0 pro genuinni 2:1 frekvencni pomer dvoutonoveho rezimu). OVERENO: vsech 9 predchozich testu prochazi beze zmeny, CLOAD regrese-test (ERROR 138) potvrzuje zadnou zmenu v CLOAD chovani. Kompletni prekompilace nap_atari_native.cpp, zavorky vyvazeny. POCTIVE: presny percepcni charakter zvuku (zni to jako skutecne "chrceni" na realnem uchu) muze potvrdit jen test na realnem 130XE.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
