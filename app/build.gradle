plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 269
        versionName "EMU10-B223-SKUTECNA-PRICINA-HLIDAC"  // Rene: "musim minimalizovat nebo pretocit, abych to probudil." NALEZENA SKUTECNA PRICINA (ne dalsi hadanka): plochaHlidac - samostatny watchdog bezici KAZDYCH 300ms - vubec nevedel o plochaSchovanaKvuliPanelu (B223 pridalo priznak jen do ps1PlochaUmisti, ne sem) a NASILNE vracel plochu na VISIBLE, protoze jsme porad na strance emu_ps1 (otevreny panel stranku neopousti). Kazde schovani od JS tak hlidac do 300ms zase zrusil. Opraveno - hlidac ted respektuje stejny priznak. Grafika vsech panelu prepracovana na skutecne vzorkovane barvy ze skinu (#03060c pozadi, #d9a84e text - zadne vymyslene gradienty/zare).

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
