plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 323
        versionName "EMU10-B277-CSAVE-DATOVY-TOK-REALISTICKY-CAS"  // Rene poslal hlasovou nahravku - "presne takhle to dela realne Atari, dokonce i Altirra to umi. Cca 20s trva piskani, datovy tok cca 4-5s." Rene take zduraznil - VZDY testuje appku primo (CLI/mobil), NIKDY realne Atari - moje predchozi opakovana zminovani "potvrdi az realny test na 130XE" byla zbytecna a matouci, ODSTRANENA z pristupu natrvalo. VYSETRENI cekaci faze (~17.84s, drive nalezene v B274-85 jako $037C/892 snimku): PRESNE OVERENO, ze tohle NENI bug - je to autenticka, spravne emulovana hodnota primo z OS ROM (tabulka v \$FE8D/\$FE8F podle IOCB indexu), a 17.84s odpovida Reneho popsanym ~20s piskani. Skutecny problem byl v DATOVEM TOKU: predchozi hodnoty outBusy=10/shiftBusy=30 scanline (z B275, prevzate z JS reference) predstavovaly jen "kdy je vystupni registr pripraven na dalsi bajt", NE skutecnou dobu 600-baudoveho prenosu (10 bitu = 16.67ms = ~260 scanline) - CPU tak dostavalo "pripraveno" driv, nez predchozi bajt stihl DOHRAT svych 10 bitu zvuku, a kazdy novy zapis PREPSAL rozehrany bajt uprostred prehravani. Cely 264-bajtovy datovy blok se tak zmackl do necelé vteřiny misto realnych ~4-5s. OPRAVA: outBusy/shiftBusy prepocitany na skutecnou dobu 10 bitu pri 600 baudech (~260 scanline). KRITICKA POJISTKA: outBusy a shiftBusy NESMI byt STEJNE (znovuobjeveny puvodni B268 problem - kdyz obe preruseni vystrely na stejne scanline, SIO rutina si mysli, ze je hotovo hned po prvnim bajtu a ZUSTANE VISET, primo overeno a opraveno - outBusy o 2 scanline kratsi nez shiftBusy). OVERENO primo na produkcnim kodu: datovy tok (264 bajtu, od konce cekani do vypnuti motoru) ted trva 4.86s - PRESNE odpovida Reneho popisu "~4-5s". Prumerne ~18.4ms/bajt, blizko teoretickym 16.67ms. Obrazovka spravne konci READY (ne rozbita, jak se stalo pri prvnim pokusu se STEJNYMI outBusy/shiftBusy). Dvouton kodovani (B276) overeno beze zmeny (pomer 1.91). CLOAD regrese-test (ERROR 138) overen beze zmeny. Vsech 9 predchozich testu prochazi. Kompletni prekompilace nap_atari_native.cpp, zavorky vyvazeny.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
