plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    defaultConfig {
        applicationId "eu.atarihelp.emu10"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "EMU10-BUILD2QA-SEGA-NATIVE-CPP-OFFLINE-VENDOR"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
