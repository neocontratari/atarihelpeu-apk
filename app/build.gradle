plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 309
        versionName "EMU10-B263-PS1-DOOM-VIDEO-DIAGNOSTIKA"  // Rene: "co ten doom a grafika v ps1?" B261 interlace-enable oprava zadnou zmenu nepřinesla ("zadna zmena Partaku") - hypoteza tedy NENI potvrzena (Doom pravdepodobne skutecny interlace pro hlavni hrani vubec nepouziva). Dalsi kandidati prozkoumani: (1) Enhanced Resolution (enhancement_active/gpu.mmap) - ma rozsahlou historii jiz overenou samotnym Renem (viz stary komentar "nedotknutelne"), NESAHAT bez tvrdych dukazu. (2) stride/pitch mismatch v nap_video() - PRI CTENI KODU vypada spravne (pouziva se skutecny pitch, ne predpoklad w*bpp), ale nejde to overit bez behu. MISTO DALSIHO HADANI: pridana cilena diagnostika primo v nap_video() (misto, kam snimek od gpu_neon SKUTECNE prichazi) - zaznamena KAZDOU ZMENU w/h/pitch/format + OCEKAVANY pitch (w*bpp) pro prime srovnani, jestli sedi (padding by se projevil jako nesoulad). Loguje se jen pri ZMENE (ne kazdy snimek), at log zustane citelny. STEJNE OMEZENI jako u vsech PS1 zmen: nejde zkompilovat/spustit v tomto sandboxu - overena syntaxe (existujici makro NAPDIAG, existujici konstanty PIXFMT) a rovnovaha zavorek, ne skutecny beh. Cisté pridani diagnostiky, zadna zmena chovani - nizke riziko. Dalsi krok: Reneho test s timhle logem ukaze, jestli se pitch/w/h behem Doom hrani nekdy neshoduje s ocekavanym, coz by ukazalo presne, kde hledat dal.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
