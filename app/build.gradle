plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 348
        versionName "EMU10-B305-SEGA-PS1-TV-CPP"
        // B305: Rene - "udelas ten tv prenos u segi a ps1 na tv a pc jako si
        // udelal u atari emu c++, aby to bylo taky v c++ a tak super jak v emu
        // atari c++?" Sega a PS1 na TV / PC cele v C++ (app/src/main/cpp/tvproud):
        // snimek hned z jadra, Sega bez ztraty (paleta + LZ i pri posunu obrazu),
        // PS1 JPEG jen zmenenych casti v puvodnim rozliseni (vlastni rychly koder,
        // velky obraz na 2 jadrech), zvuk ve stejnem paketu; Java (/sega.stream,
        // /ps1.stream) jen posila bajty, prohlizec kresli do canvasu.
        // B304: Rene - "udelej uvodni demo nove podle tohoto navrhu a nechat to
        // na tobe - grafika muze byt HD a nemusi splnovat pozadavky atari sega
        // a ps1". Nove uvodni demo podle jeho scenare (N&P STUDIO MASTER SCI-FI
        // PROMO MANIFEST, 45 s, 5 scen, titulky CZ + EN) cele v C++: OpenGL ES
        // 2.0 na vlastnim vlakne (knihovna napintro, NapDemoView), 3D Atari
        // 130XE, mraky, blesky, energie do mobilu, zlate logo; zvuk spocitany
        // v C++ (AudioTrack jen prehrava), obraz se ridi podle zvuku; TV / PC
        // dostava vlastni obraz 16:9. Viz CO_JE_V_B304.md.
        // B291: Rene po B290 - "to preved v helpu presne tak vcetne kazetaku a
        // obrazovky - podle toho navrhu na kterem jsme se dohodli". Cele Atari
        // 130XE ze schvaleneho navrhu (obrazovka, klavesnice, konzole, kazetak,
        // POWER, N&P logo, servisni tlacitka) kresli a ridi C++ primo na
        // displej (AtariDeviceView + nap_atari_device.h), emulace ve vlastnim
        // C++ vlaknu. Viz CO_JE_V_B291.md.
        // (puvodni komentar B287:) Rene po B286:
        // "Ne - tu kontrolu udelej jeste pred testem - chci ciste jadro
        // atari emu v c++ - Java odhaduje a to je problem - Partaku
        // nelakuj me - atari emu v jave je v aplikaci. Proto ted delame
        // atari emu v c++ !!!" KONTROLA PROVEDENA PRED DALSIM TESTEM (jak
        // pozadoval), primo v kodu, ne odhadem: appka SKUTECNE obsahuje
        // DVE ODDELENE Atari jadra. (1) emu_vbxe/index.html - stary,
        // kompletni, cely v JS napsany 6502 emulator (vlastni opcode
        // tabulka, vlastni zvuk pres ScriptProcessorNode) - PRESNE tohle
        // je zavesene na HLAVNI tlacitko menu appky "ATARI 130XE
        // EMULATOR" (viz app/src/main/assets/index.html). V gitu ma
        // presne 1 commit - od zacatku viditelne historie nedotcene. (2)
        // emu_atari_cpp/index.html - nase C++ jadro (na kterem delame
        // B282-B286) - zavesene na tlacitko "HELP" (v help panelu appky
        // dokonce ani nevysvetlene). Reneho vlastni log (ZVUK_PREDSTIH_OREZAN,
        // existuje jen v C++ jadru) potvrzuje, ze celou dobu testoval
        // spravne pres HELP - nic z prace B282-B286 nebylo nazmar.
        // Rene po nahlaseni rozhodl: "ne za 1 [tj. nemenit hlavni menu]
        // nez bude pod tlacitkem help atari emu v c++ kompletne hotove na
        // java atari nechytej. Ale vyzaduji aby na tom co delame bylo
        // opravdu emu atari pod tlacitkem HELP ciste v c++." Tenhle build
        // je presne to: posledni zbyvajici JS vrstva (Web Audio API
        // planovani/odhadovani - AudioContext, dalsiZvukStart,
        // orezavani fronty z B285/B286) je pryc. Zvuk ted hraje PRIMO z
        // C++ jadra pres nativni OpenSL ES - stejny, uz overeny a v
        // produkci bezici vzor jako ma PS1 jadro teto appky ("CESTA A:
        // zvuk bez Javy", funguje od API 9, sedi s minSdk 24). Nove:
        // nap_atari_audio_ring.h (cisty C++, bez JNI/SLES - kruhovy buffer
        // + 4x zisk/oriznuti/int16 prevod, presne nahrazujici drivejsi JS
        // GainNode hodnotu) + OpenSL kod v nap_atari_native.cpp, napojene
        // na VSECHNY 3 existujici genAudio() mista (bootNative,
        // atariZachytitCsaveZvukNative, audioChunkNative) - genAudio()
        // samotne se NEMENI (stejny pocet volani jako driv), jen se navic
        // vysledek posila do nativni fronty. Start/stop navazano na
        // zivotni cyklus obrazovky HELP (jeNactene/onPageStarted-Finished/
        // onPause/onDestroy/onResume - presny vzor isPs1OwnerUrl/
        // stopPs1IfLeaving), aby se predeslo stejne "hadajici se jadra"
        // chybe, jaka uz jednou vznikla mezi Segou a Atari. V index.html
        // zcela ODSTRANENO (ne jen vypnuto): zvukCtx/pripravZvuk/
        // zvukHromada/naplanovaneZdroje/zkratitPrilisDlouhouFrontu/
        // pridejVzorkyDoHromady/naplanujZvukovyBuffer - zadna JS
        // "odhadovaci" vrstva uz v zivem prehravani neexistuje. CSAVE->WAV
        // nahravka (pripojKeNahravce) zustava beze zmeny - porad bere ze
        // stejnych bajtu, co uz atariAudioChunk vracel, jen uz se tyhle
        // bajty navic neprehravaji pres JS. OVERENO: novy CLI test
        // (test_b287_atari_audio_ring.cpp, 21 kontrol) overuje kruhovy
        // buffer (zapis/cteni, zabaleni pres konec, preteceni = zahozeni
        // nejstarsiho, ne nejnovejsiho) a zisk/oriznuti/int16 prevod
        // (vcetne shody se stavajicim gain-less prevodem pri gain=1.0).
        // CELA existujici CLI sada (16 ze 16 souboru, vsechny beze zmeny)
        // prochazi dal - do CPU/pameti/POKEY jadra se vubec nesahalo.
        // Samotne OpenSL ES volani (realny Android audio hardware) CLI
        // test overit NEUMI - to muze potvrdit jen Reneho telefon.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
