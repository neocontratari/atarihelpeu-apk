plugins {
    id 'com.android.application'
}
android {
    namespace 'eu.atarihelp.emu10'
    compileSdk 34
    ndkVersion '26.3.11579264'  // PRIDANO: kvuli stavbe PS1/Sega jader
    defaultConfig {
        applicationId "eu.atarihelp.emu10.test"  // TEST vedle prave apky (neprepise ji)
        minSdk 24
        targetSdk 34
        versionCode 321
        versionName "EMU10-B275-CSAVE-PRENOS-REALISTICKY-CAS"  // Rene - "chybi zaverecni chrceni CSAVE, jen uvodni piskot je tam." Rozsahle vysetrovani ve dvou kolech. PRVNI POKUS (B283, ODSTRANEN): domnenka, ze appka do sériove-vystupni IRQ obsluhy ($EA88/$EAAD) nikdy nevstoupi kvuli chybejici "prvni jiskre" - zkusil jsem 3 ruzne spustece (IRQEN bit4 samotny, IRQEN bit4+SKCTL bit3, jen SKCTL bit3), VSECHNY primo testem ZAMITNUTY (bud rozbily CLOAD ERROR 138, nebo zablokovaly CSAVE uplne, nebo se ukazaly nespolehlive kvuli tomu, ze dispecer preruseni v OS ROM bezne docasne prepina IRQEN bity i behem beznych stisku klaves). DELSIM SLEDOVANIM (presne overeno, ne odhad) zjisteno: appka do $EA88 dojde SAMA, prirozene, BEZ JAKEKOLIV "opravy" - jen to trva pres 20 vterin (ceka se na Timer1 preruseni na uplne jinem miste, $EBC6, nesouvisejicim s SEROUT). Tato zbytecna a riskantni "oprava" byla ODSTRANENA. SKUTECNA PRICINA (nalezena primym srovnanim s JS referenci - jedinym zdrojem pravdy pro logiku): byte-k-bytu zpozdeni po zapisu do SEROUT (drive "serStav/serOdpocet", 2 scanline) bylo AZ 140x rychlejsi, nez ma byt. JS reference pouziva DVA NEZAVISLE citace: "outBusy=10, shiftBusy=30" scanline (viz komentar primo v referenci: "byte opusti vystupni registr za ~10 radek, posuv dobehne za ~30"), NE 2 spolecne kroky. Cely blok dat (za realny test zmereno 701 bajtu) se s chybnym casovanim odesilal za pouhych 0.3s misto realistickych ~30s - zvuk pak vypadal jako jeden nerozeznatelny impuls na konci dlouheho tonu, ne jako "chrceni" rozlozene v case. OPRAVA: nahrazen puvodni stavovy automat (serStav/serOdpocet) dvema nezavislymi citaci (outBusy/shiftBusy), presne casovani a logika prevzata z JS reference - kazdy citac se snizuje o 1 KAZDOU scanline nezavisle na druhem, presne jako "if(outBusy>0 && --outBusy===0) zvedni bit4; if(shiftBusy>0 && --shiftBusy===0) zvedni bit3;". OVERENO: cely prenos (701 bajtu) ted trva ~31.8s (~45ms/bajt, radove spravne oproti ocekavanym ~18ms/bajt pri 600 baudech - presne rytmus overi az realny test na 130XE, ne CLI). Vsech 9 predchozich testu prochazi beze zmeny. CLOAD ERROR 138 regrese-test potvrzuje zadnou zmenu v CLOAD chovani (SEROUT zmena se CLOAD vubec netyka - CLOAD pouziva SERIN, ne SEROUT). Kompletni prekompilace nap_atari_native.cpp, zavorky vyvazeny.

        ndk {
            abiFilters 'arm64-v8a'  // PRIDANO: PS1 jadro je jen arm64
        }

        externalNativeBuild {
            cmake {
                // BUILD2RY: debug APK stavel jadro emulatoru (.c soubory) s -O0.
                // cFlags tu drive uplne chybely; cppFlags mely jen -O2 pro frontend.
                // Optimalizace je vynucena i v CMakeLists per-target, tohle je pojistka.
                cppFlags "-std=c++17 -O3"
                cFlags "-O3"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // OPRAVA duplicity: PS1/Sega jadra stavi CMake a Gradle je pak nachazel
    // 2x (merged_jni_libs + cxx cesta) -> "DuplicateRelativeFileException".
    // pickFirst rekne: kdyz je knihovna na vic mistech, vezmi prvni. Standardni
    // a bezpecne reseni pro .so stavene pres externalNativeBuild.
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libnapps1core.so', '**/libnapsega_native_proof.so', '**/*.so']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
