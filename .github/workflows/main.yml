name: AtariHelp_eu_EMU10_BUILD1
on: [push, workflow_dispatch]
jobs:
  build:
    name: Vyrob debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Uklid pozustatku (local.properties z Windows rozbiji CI)
        run: rm -f local.properties app/local.properties
      - name: Sestaveni
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Ulozit APK jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EMU10-BUILD1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
