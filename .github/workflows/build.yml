name: Build APK

on:
  push:
  workflow_dispatch:

# Opravneni pro pojistku nize (vypinani ostatnich receptu na build)
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stazeni kodu
        uses: actions/checkout@v4

      - name: Pojistka - jediny povoleny build je tento (jeden push = jeden balicek)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Recepty na build nalezene v repozitari:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | "  [\(.state)] \(.path)  (\(.name))"' || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | [.id, .state, .path] | @tsv' > /tmp/wf.tsv || true
          while IFS=$'\t' read -r id state path; do
            if [ "$path" != ".github/workflows/build.yml" ] && [ "$state" = "active" ]; then
              echo "Vypinam cizi recept: $path"
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" \
                && echo "  -> vypnuto (nic se nemaze, da se kdykoli zapnout zpet)" \
                || echo "  -> vypnuti se nepovedlo, build bezi dal"
            fi
          done < /tmp/wf.tsv
          echo "Hotovo. Od pristiho pushe pobezi vzdy jen Build APK."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # OPRAVA: v3 ma ve vychozim seznamu balicku i stary "tools" balicek,
          # ktery Google uz ze svych serveru odstranil - sdkmanager ho nenajde
          # a cely krok skonci chybou ("Failed to find package 'tools'", exit
          # code 1), i kdyz vsechno ostatni, co skutecne potrebujeme, uz stejne
          # instaluje explicitne dalsi krok nize ("Instalace SDK komponent").
          # Prazdny retezec rika akci, at vubec nezkousi instalovat svuj
          # vychozi seznam balicku - jen pripravi cmdline-tools/sdkmanager
          # samotny, zbytek uz je na dalsim kroku. (Oprava az ve verzi v4 teto
          # akce, ale prechod na v4 by zaroven zmenil i jine vychozi hodnoty -
          # radeji jen tohle jedno konkretni misto.)
          packages: ''

      - name: Instalace SDK komponent (pripnute verze)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sestaveni APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # B321: soukromy podpisovy klic N&P. Rotace klice (APK Signature Scheme v3): Android 9+ bere
      # novy klic N&P (stary verejny debug klic uz aktualizaci neprotlaci), Android 7-8 dal debug klic (v2).
      # Klic je v tajemstvi NAP_PODPIS (1. radek heslo, zbytek base64 PKCS12), rodokmen app/nap_rodokmen.bin.
      - name: Podpis klicem N&P (rotace z debug klice)
        env:
          NAP_PODPIS: ${{ secrets.NAP_PODPIS }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$NAP_PODPIS" ]; then
            echo "::warning::Chybi tajemstvi NAP_PODPIS - APK zustava podepsane jen starym verejnym debug klicem."
            exit 0
          fi
          printf '%s\n' "$NAP_PODPIS" | tr -d '\r' > "$RUNNER_TEMP/podpis.txt"
          NAP_HESLO="$(head -n1 "$RUNNER_TEMP/podpis.txt" | tr -d ' ')"
          echo "::add-mask::$NAP_HESLO"
          export NAP_HESLO
          tail -n +2 "$RUNNER_TEMP/podpis.txt" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/nap.p12"
          rm -f "$RUNNER_TEMP/podpis.txt"
          "$BT/apksigner" sign \
            --ks app/debug.keystore --ks-type PKCS12 --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer --ks "$RUNNER_TEMP/nap.p12" --ks-type PKCS12 --ks-key-alias nap --ks-pass env:NAP_HESLO --key-pass env:NAP_HESLO \
            --lineage app/nap_rodokmen.bin --rotation-min-sdk-version 28 --v4-signing-enabled false \
            --out "$RUNNER_TEMP/podepsane.apk" "$APK"
          rm -f "$RUNNER_TEMP/nap.p12"
          mv "$RUNNER_TEMP/podepsane.apk" "$APK"
          echo "Podepsano klicem N&P (rotace)."

      - name: Kontrola APK - podpis, verze, osobni klic jako server N&P v10
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$BT/aapt2" dump badging "$APK" | head -1
          "$BT/apksigner" verify -v --print-certs --min-sdk-version 24 "$APK" | grep -E "^Verif|certificate DN|Number of signers"
          echo "--- Android 9 a novejsi (v3):"
          "$BT/apksigner" verify --print-certs --min-sdk-version 28 "$APK" | grep "certificate DN" || true
          "$BT/apksigner" lineage --in "$APK" --print-certs 2>/dev/null | grep "DN" || echo "(APK bez rotace klice)"
          echo "--- osobni klic N&P vlozeny jako na serveru v10 (APK Signing Block):"
          python3 test_overeni/b321/vloz_klic.py "$APK" "$RUNNER_TEMP/s_klicem.apk"
          "$BT/apksigner" verify --min-sdk-version 24 "$RUNNER_TEMP/s_klicem.apk" && echo "APK s klicem: podpis plati"
          mkdir -p "$RUNNER_TEMP/k"
          javac -d "$RUNNER_TEMP/k" app/src/main/java/eu/atarihelp/emu10/NapApkKlic.java test_overeni/b321/jvm/NapApkKlicTest.java
          java -cp "$RUNNER_TEMP/k" NapApkKlicTest "$RUNNER_TEMP/s_klicem.apk" | tee "$RUNNER_TEMP/klic.txt"
          grep -q "tajemstvi=5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a" "$RUNNER_TEMP/klic.txt"

      - name: Ulozeni APK ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3   # setri misto na artefakty (kazdy build ma ~39 MB)
