name: VYROBIT APK ATARIHELP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Vyrob release APK
    runs-on: ubuntu-latest
    env:
      ATARIHELP_RELEASE_STORE_PASSWORD: ${{ secrets.ATARIHELP_RELEASE_STORE_PASSWORD }}
      ATARIHELP_RELEASE_KEY_ALIAS: ${{ secrets.ATARIHELP_RELEASE_KEY_ALIAS }}
      ATARIHELP_RELEASE_KEY_PASSWORD: ${{ secrets.ATARIHELP_RELEASE_KEY_PASSWORD }}

    steps:
      - name: 1 - Stahnout projekt
        uses: actions/checkout@v4

      - name: 1b - Vycistit stare duplicitni ikony
        run: |
          echo "Mazani starych problematickych ikon, ktere GitHub upload neumi sam odstranit..."
          rm -f app/src/main/res/drawable/ic_launcher.png
          rm -f app/src/main/res/drawable/ic_launcher.webp
          rm -f app/src/main/res/drawable/ic_launcher.jpeg
          rm -f app/src/main/res/drawable/ic_launcher.jpg
          echo "Obsah drawable po vycisteni:"
          ls -la app/src/main/res/drawable || true

      - name: 2 - Pripravit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3 - Pripravit Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Doinstalovat Android balicky
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 5 - Pripravit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 5b - Pripravit release podpis
        env:
          ATARIHELP_RELEASE_KEYSTORE_B64: ${{ secrets.ATARIHELP_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$ATARIHELP_RELEASE_KEYSTORE_B64" ]; then
            echo "$ATARIHELP_RELEASE_KEYSTORE_B64" | base64 -d > app/atarihelp-release.p12
            echo "Pouzivam release podpis z GitHub Secrets."
          else
            echo "Pouzivam stabilni release podpis z projektu."
          fi
          test -f app/atarihelp-release.p12
          keytool -list -keystore app/atarihelp-release.p12 -storepass "${ATARIHELP_RELEASE_STORE_PASSWORD:-AtariHelpEuFixRelease2026}" -alias "${ATARIHELP_RELEASE_KEY_ALIAS:-atarihelp}"

      - name: 6 - Vyrobit release APK
        run: |
          gradle --version
          gradle assembleRelease --stacktrace --info --no-daemon
          ls -lh app/build/outputs/apk/release

      - name: 6b - Diagnostika pri padu buildu
        if: failure()
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== APP BUILD FILE ==="
          sed -n '1,120p' app/build.gradle || true
          echo "=== ROOT BUILD FILE ==="
          sed -n '1,120p' build.gradle || true
          echo "=== SETTINGS ==="
          sed -n '1,120p' settings.gradle || true
          echo "=== MANIFEST ==="
          sed -n '1,160p' app/src/main/AndroidManifest.xml || true
          echo "=== ASSETS ==="
          ls -lh app/src/main/assets || true

      - name: 7 - Ulozit hotove APK ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: HOTOVE_RELEASE_APK_ATARIHELP_STAHNI_ME
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
